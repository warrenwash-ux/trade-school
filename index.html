  {w:'Support',d:'A price level where buyers consistently show up and prevent the price from falling further. The price bounces up from this level repeatedly.',x:'Think of support as the floor of a room. A ball thrown inside keeps bouncing off the floor. Support is the price floor a stock keeps bouncing off of.'},
  {w:'Resistance',d:'A price level where sellers consistently show up and prevent the price from rising further. The price gets pushed back down from this level repeatedly.',x:'Think of resistance as the ceiling. A ball thrown upward keeps hitting the ceiling and coming back down. Resistance is the price ceiling a stock keeps getting rejected from.'},
  {w:'Level',d:'A specific price point on a chart that has been significant multiple times. Prices tend to react at levels because many traders are watching the same areas.',x:'If a stock bounced off $50 three times over the past year then $50 is a significant level. Many traders have it marked and will make decisions based on what happens there.'},
],
teach:[
  {n:1,t:'Why support and resistance exist',x:'Support and resistance levels exist because of human psychology and memory. When a stock price falls to $50 and bounces back up three times buyers start to remember that $50 is where the stock tends to recover. They see $50 approaching and buy in anticipation of another bounce. This buying pressure itself creates the bounce at $50. When a stock price rises to $80 and gets rejected back down three times sellers start to remember that $80 is where the stock stalls. They see $80 approaching and sell to lock in profits. This selling pressure itself creates the rejection at $80. Support and resistance are self-fulfilling because traders act on them which makes them happen.'},
  {n:2,t:'How to identify support levels on a chart',x:'Look at a chart and find the low points. Areas where the price fell to and then bounced back up. If the price touched a certain price area two or more times and bounced each time that area is a support level. The more times the price has bounced off a level the stronger that support is. Three bounces off $50 is stronger support than two bounces. Five bounces is stronger than three. Strong support levels that have been tested many times are reliable areas where buyers are likely to step in again. As a trader you can buy near strong support with a stop loss just below it.'},
  {n:3,t:'How to identify resistance levels on a chart',x:'Look at the high points on a chart. Areas where the price rose to and then got pushed back down. If the price touched a certain price area two or more times and fell back each time that area is a resistance level. The more times the price has been rejected from a level the stronger that resistance is. Strong resistance levels are areas where sellers have repeatedly stepped in. As a trader you might take profits near resistance or wait to see if the price can actually break through before entering a trade.'},
  {n:4,t:'What happens when support breaks',x:'When a support level breaks it is a significant event. If a stock has been bouncing off $50 for months and then falls through $50 and stays below it something important changed. The buyers who used to show up at $50 are no longer there. Or the selling pressure has become too strong for them to hold. When support breaks the old support level often becomes new resistance. The price may fall to $40 or $35 looking for the next support level. This is why stop losses are so important. If you bought near $50 expecting a bounce and the support breaks you want to be out of the trade immediately.'},
  {n:5,t:'Breakouts — when resistance gets smashed',x:'A breakout happens when a stock price pushes through a resistance level that has been holding it back. Imagine a stock stuck below $100 for two months. Every time it approaches $100 it gets pushed back. Then one day on heavy volume it pushes through $100 and closes at $105. That is a breakout. Breakouts can lead to big moves because traders who were waiting for confirmation of a move now pile in buying. Short sellers who were betting on the stock staying below $100 now have to buy back their positions to cut losses. This combination of new buyers and short sellers covering can create explosive upward moves.'},
  {n:6,t:'Role reversal — the concept that ties everything together',x:'One of the most powerful concepts in trading is role reversal. When a support level breaks it becomes resistance. When a resistance level breaks it becomes support. Here is why. The $50 support that broke — buyers who bought there at $50 and watched the price fall are now stuck in a losing trade. When the price comes back up to $50 those buyers want to get out at breakeven. This selling from stuck buyers creates resistance at the old support level. The opposite happens with broken resistance. Traders who missed the breakout at $100 want to buy the dip. When the price comes back down to $100 their buying creates support at the old resistance level.'},
],
analogy:'Support and resistance are like floors and ceilings in a multi-story building. A stock price is like a bouncing ball in that building. It hits the ceiling (resistance) and falls down. It hits the floor (support) and bounces back up. Sometimes the ball hits the ceiling so hard it breaks through and that floor becomes a new ceiling on the next level. Sometimes it hits the floor so hard it breaks through and that ceiling becomes a new floor on the level below.',
quiz:{q:'A stock has bounced off $75 exactly four times over the past three months. Now the price is approaching $75 again for the fifth time. What does this tell you and what would a trader consider doing?',choices:['Four bounces means nothing. Past price history does not matter in trading.','$75 is a strong support level. A trader might consider buying near $75 with a stop loss just below it in case the support breaks this time.','The stock will definitely bounce again so you should buy now with no stop loss needed.','$75 is resistance because the stock keeps going back to that price.'],correct:1,explain:'Four previous bounces from $75 makes it a strong proven support level. The more times a level has held the more likely it is to hold again because more traders are aware of it and making decisions based on it. A trader might buy near $75 and place a stop loss slightly below it. If the level holds they profit from the bounce. If the support breaks they exit quickly with a small controlled loss.',lesson:'Multiple bounces from the same price level create strong support. Stronger support levels get respected more often. But no support holds forever which is why stop losses are essential.'}
},
{id:'1-4',title:'The Psychology of Trading — Why Most People Lose Money',sub:'Understanding the emotional traps before you ever make your first trade',
terms:[
  {w:'Fear',d:'The emotion that makes traders sell too early or avoid good trades because they are scared of losing money.',x:'Stock drops 3%. Fear makes you sell immediately. Then it bounces back up 10%. You sold for a small loss and missed a big gain because of fear.'},
  {w:'Greed',d:'The emotion that makes traders hold winning positions too long hoping for more profit until the trade reverses and turns into a loss.',x:'Trade is up $500. Greed says hold for $1,000. Price reverses and drops. Now the trade is only up $100 or is actually losing. Greed gave back the profit.'},
  {w:'Discipline',d:'Following your trading rules consistently even when emotions are telling you to do something different. The single most important trait in trading.',x:'Your plan says sell when profit reaches $300. The trade hits $300. Discipline means selling at $300 even if you think it might go to $500. Following the plan every time.'},
],
teach:[
  {n:1,t:'Why 90% of day traders lose money',x:'Studies consistently show that around 90% of day traders lose money over the long term. This is not because they are stupid or lazy. Many are intelligent hardworking people. They lose because they do not manage their emotions. They let fear stop them from taking good setups. They let greed make them hold losing trades too long hoping they will recover. They take revenge trades after losing money trying to make it back quickly. They increase their position sizes after a win because they feel unstoppable. Then a single loss wipes out multiple wins. Emotional trading is the primary reason people fail in the market.'},
  {n:2,t:'FOMO — the most dangerous emotion in trading',x:'FOMO stands for Fear Of Missing Out. It is the feeling you get when you watch a stock shoot up 20% in an hour and you were not in it. You panic buy at the top because you do not want to miss more gains. But by the time you buy everyone who already had the position is starting to take profits. They are selling to you. The stock reverses and you are stuck holding a position at the highest price while it falls. FOMO buying at the top is one of the most reliable ways to lose money. The move has already happened. Professional traders buy setups before moves not during them.'},
  {n:3,t:'The proper way to think about losses',x:'Every professional trader loses money on some trades. Losses are not failures. They are a cost of doing business in trading. If you make 6 winning trades and 4 losing trades but your winners are twice as large as your losers you are profitable overall. The key is to keep your losses small by using stop losses consistently. A trader who cuts losses at $100 per trade and lets winners run to $300 per trade is profitable even if they only win 40% of their trades. The math works in their favor. A trader who refuses to take small losses hoping for recovery eventually takes a catastrophic loss that destroys their account.'},
  {n:4,t:'Revenge trading — the account killer',x:'You lose $200 on a trade. You feel angry. You immediately take another trade to make it back. You have not planned this trade. You just want to recover your money quickly. You lose another $300. Now you are down $500 and even angrier. You take a bigger trade trying to recover everything at once. You lose $600. Your account that started at $2,000 is now at $900. This spiral happens to traders at every level. The solution is simple but hard to follow emotionally. After a loss follow your rule to stop trading for the day or take a break of at least 30 minutes. Never trade to recover losses. Trade the plan not the emotion.'},
  {n:5,t:'The trading plan — your protection against emotions',x:'A trading plan is a set of written rules you follow before during and after every trade. It answers specific questions. What are the conditions required before I enter a trade? Where exactly is my stop loss before I enter? Where exactly is my profit target before I enter? How much of my account am I risking on this trade? What are my rules for when I stop trading for the day? When you have a written plan and follow it your emotions have less power over your decisions. You are not making choices in the heat of the moment. You made the decisions calmly in advance and now you are simply executing them.'},
  {n:6,t:'The 1% rule — how professionals protect their accounts',x:'Professional traders risk no more than 1% to 2% of their account on any single trade. This sounds boring but it is the most powerful risk management concept in trading. If you have a $5,000 account and risk 1% per trade you risk $50 per trade. Even if you lose 10 trades in a row you have only lost $500. Your account is still at $4,500. You can recover from that. Now imagine risking 20% per trade. Five losing trades in a row and your account is nearly gone. Big risks lead to big losses that destroy accounts before you even develop the skills needed to be consistently profitable.'},
],
analogy:'Trading psychology is like driving a car in heavy rain. The car is your trading account. Your skills are the steering wheel. But your emotions are like heavy rain reducing visibility and making the road slippery. A skilled driver with poor visibility and slippery roads will still crash eventually. A skilled trader who cannot control their emotions will lose money regardless of their technical knowledge. Controlling your emotions is learning to drive in any weather condition.',
quiz:{q:'You have a $3,000 trading account. Using the 1% risk rule what is the maximum amount you should risk losing on a single trade?',choices:['$300 because 10% feels more exciting','$30 because 1% of $3,000 is $30','$150 because 5% is more reasonable for beginners','$600 because you need bigger risk to make meaningful money'],correct:1,explain:'1% of $3,000 is exactly $30. That means your stop loss should be placed so that if it triggers you lose no more than $30 on that trade. At this rate you could lose 10 trades in a row and still have $2,700 left. As your account grows the dollar amount of 1% grows too. At $10,000 your 1% risk is $100. At $50,000 it is $500.',lesson:'The 1% rule protects your account from catastrophic losses. Small consistent losses that you can recover from are acceptable. One huge loss that destroys your account is not. Professional traders protect capital above everything else.'}
},
{id:'1-5',title:'Types of Markets — Stocks Forex and Crypto Explained',sub:'Understanding every market you can trade and the differences between them',
terms:[
  {w:'Stock Market',d:'The market where shares of companies are bought and sold. Open Monday to Friday 9:30am to 4pm Eastern Time.',x:'The New York Stock Exchange and NASDAQ are the main US stock exchanges. Companies like Apple Google and Amazon are traded here.'},
  {w:'Forex Market',d:'The Foreign Exchange market where currencies of different countries are traded against each other. The largest financial market in the world. Open 24 hours a day 5 days a week.',x:'You trade currency pairs like EUR/USD or GBP/USD. If you think the US dollar will get stronger against the Euro you sell the EUR/USD pair.'},
  {w:'Cryptocurrency',d:'Digital currencies that exist only online and are not controlled by any government or central bank. Bitcoin and Ethereum are the most well known.',x:'Unlike the dollar which is printed by the US government Bitcoin is created by computer algorithms and its supply is strictly limited. This makes it behave differently from traditional currencies.'},
],
teach:[
  {n:1,t:'The stock market — what it is best for',x:'The stock market is the most well-known market and the one most people think of when they hear the word investing. It is best for long-term investors who want to build wealth over years or decades. It is also used by day traders who buy and sell within single trading days. The advantage of stocks is that you own real pieces of real businesses. If a company grows and becomes more profitable your stock grows in value. The disadvantage for beginners is the PDT rule which limits day trading unless you have $25,000 or more in your account.'},
  {n:2,t:'Forex — the market with no PDT rule',x:'The Forex market trades currencies. You are essentially betting on whether one country currency will become stronger or weaker compared to another country currency. Forex is attractive to beginners for specific reasons. It has no PDT rule so you can make as many day trades as you want regardless of account size. It is open 24 hours a day giving you flexibility to trade any time. The markets can be highly liquid meaning trades execute quickly. The disadvantage is that currency movements can be subtle requiring larger position sizes and leverage to make meaningful profits which increases risk.'},
  {n:3,t:'Cryptocurrency — the highest risk highest reward market',x:'Cryptocurrency markets operate 24 hours a day 7 days a week including weekends and holidays. Crypto prices can move 10% 20% or even 50% in a single day. This volatility creates opportunities for large gains but also large losses. Bitcoin the largest cryptocurrency has gone from nearly worthless to over $60,000 per coin and back down again multiple times. Crypto has no central authority and relatively little regulation compared to stocks. This is both its appeal and its danger. The same volatility that creates opportunity can wipe out positions very quickly.'},
  {n:4,t:'Paper trading — practice with fake money before real money',x:'Before you ever risk a single real dollar you should paper trade. Paper trading means making trades in a simulated account with fake money. The experience feels exactly like real trading but no real money is at stake. Most major brokerages offer free paper trading accounts. ThinkorSwim by TD Ameritrade has excellent paper trading. Webull also has paper trading. The goal of paper trading is to practice your strategy and learn to control your emotions without financial consequences. You will make mistakes. You will learn from them at zero cost. Most professional traders paper traded for months before going live. Set a minimum 60 day paper trading requirement for yourself before touching real money.'},
  {n:5,t:'Choosing where to start',x:'Most beginners should start with one market and master it before trying others. If you have $25,000 or more and want to day trade US companies the stock market makes the most sense. If you have less than $25,000 and want to day trade consider Forex first because it has no PDT rule restriction. If you want to invest long term for retirement or wealth building the stock market with index ETFs is the most proven path. If you enjoy high risk and high volatility and can afford to lose your entire investment cryptocurrency might appeal to you. There is no single right answer. The right market is the one you understand best and can trade without emotional chaos.'},
  {n:6,t:'The broker — how you actually buy and sell',x:'A broker is a company that gives you access to the markets. You deposit money with a broker. The broker executes your buy and sell orders on the exchange. You never go to a physical exchange. Everything happens digitally through the broker platform. Popular stock brokers include Webull, TD Ameritrade, Fidelity, Charles Schwab, and Interactive Brokers. Many offer commission free trading meaning no fee per trade. Choose a broker based on the features you need. Day traders need fast execution and good charting. Long term investors care more about low fees and investment options.'},
],
analogy:'Different markets are like different sports. The stock market is like basketball — structured season specific rules and trading hours. Forex is like running — you can do it anytime anywhere in the world at any hour. Crypto is like extreme sports — the thrills are real the risks are real and you need to know exactly what you are doing before jumping in.',
quiz:{q:'You have $5,000 to start trading and you want to make multiple trades per week. Which market is most appropriate for you to start with and why?',choices:['The stock market with a margin account because stocks are the most popular','Cryptocurrency because it has the highest potential returns','Forex because it has no PDT rule restriction allowing unlimited day trades regardless of account size. The stock market would restrict you to 3 day trades per 5 days with an account under $25,000.','It does not matter. All markets are the same for beginners.'],correct:2,explain:'With $5,000 and a desire to trade frequently the stock market would trigger the PDT rule after 3 day trades in a 5-day period restricting your activity. Forex has no such restriction. You can make as many trades as you want in Forex regardless of account size. Starting in Forex allows you to practice day trading freely while you build your account.',lesson:'The PDT rule requires $25,000 minimum for unlimited day trading in US stocks. Forex has no PDT rule making it accessible for active day traders with smaller accounts.'}
},
{id:'1-6',title:'Level 1 Complete — Your Foundation Is Built',sub:'Everything you have mastered and exactly what Level 2 brings',
terms:[],
teach:[
  {n:1,t:'What you have mastered in Level 1',x:'You started this level knowing nothing about the stock market. Here is what you know now. You understand what stocks are and why companies sell them. You can read a price chart and understand what candlesticks are telling you. You know what support and resistance are and why they matter. You understand the psychological traps that make most traders lose money including fear greed FOMO and revenge trading. You know the 1% risk rule and why professional traders never risk more than 1% to 2% per trade. You understand the difference between stock trading Forex and cryptocurrency. That is a real foundation.'},
  {n:2,t:'The single most important lesson from Level 1',x:'Controlling your emotions is more important than any technical skill. You can learn every chart pattern in existence and still lose money if you cannot follow your plan when fear and greed are fighting you. The traders who survive long enough to become profitable are not always the most talented. They are the most disciplined. They follow their rules when it feels terrible to do so. They cut losses quickly when their brain is telling them to hold on and hope. They take profits at their target when greed is screaming for more. Discipline is the skill that makes all other skills work.'},
  {n:3,t:'What Level 2 brings',x:'Level 2 teaches you how to read charts at a professional level. Candlestick patterns. Moving averages. RSI. MACD. Volume analysis. Everything that tells you what is happening in a market and where the price might go next. You will learn to identify trends spot reversals and find the specific entry points that professional traders look for.'},
],
analogy:'You have just completed the orientation. You know the rules of the game the basic pieces on the board and the most common mistakes beginners make. Level 2 teaches you strategy. How to look at the board and decide what move to make.',
quiz:{q:'LEVEL 1 FINAL: Someone tells you they made 8 trades this week and won 7 of them. They say they are ready to trade with real money. What important information is missing before you can evaluate if they are ready?',choices:['Nothing is missing. Winning 7 out of 8 trades proves they are ready.','How much did they win on the 7 winners and how much did they lose on the 1 loser? A trader who wins $50 on 7 trades but loses $400 on 1 trade is not profitable overall despite a 87% win rate.','What stock they traded.','Whether they used a margin account.'],correct:1,explain:'Win rate alone tells you very little. A trader who wins $50 seven times and loses $400 once earned $350 but lost $400 for a net loss of $50. A trader who wins $200 three times and loses $50 three times has a 50% win rate but is very profitable. What matters is the relationship between average win size and average loss size combined with win rate. This is called expectancy.',lesson:'Win rate alone does not determine profitability. What matters is the combination of win rate and the ratio of average winner to average loser. Protect your losses and let your winners run.'}
},
]},
{num:2,title:'Chart Reading & Candlestick Patterns',desc:'Reading price charts like a professional — every pattern explained simply before tested',
lessons:[
{id:'2-1',title:'Candlestick Patterns — What Buyers and Sellers Are Telling You',sub:'The most important patterns and what they actually mean in plain English',
terms:[
  {w:'Bullish Pattern',d:'A candlestick pattern that suggests the price is likely to move higher. Buyers are showing strength.',x:'A big green candle closing near the top of its range after several red candles is a bullish sign. Buyers came in strong.'},
  {w:'Bearish Pattern',d:'A candlestick pattern that suggests the price is likely to move lower. Sellers are showing strength.',x:'A big red candle closing near the bottom of its range after several green candles is a bearish sign. Sellers came in strong.'},
  {w:'Doji',d:'A candle where the opening price and closing price are almost exactly the same. The body is tiny or invisible. Shows market indecision — neither buyers nor sellers won.',x:'A doji after a long uptrend can signal the uptrend is losing momentum. Neither buyers nor sellers dominated during that period.'},
],
teach:[
  {n:1,t:'Why candlestick patterns matter',x:'Candlestick patterns are not magic. They do not guarantee what the price will do next. What they do is show you the battle between buyers and sellers. A candle with a long lower wick tells you that sellers pushed the price way down during that period but buyers came in and pushed it back up. The closing price was much higher than the low. Buyers won that battle. A candle with a long upper wick tells you buyers pushed the price way up but sellers came in and pushed it back down. Sellers won that battle. Patterns of candles together tell you who is winning the ongoing war between bulls and bears.'},
  {n:2,t:'The hammer — a powerful reversal signal',x:'A hammer candle has a small body at the top and a long lower wick at least two to three times the length of the body. It looks like a hammer with the head at the top and the handle at the bottom. What happened during this candle: The price fell dramatically to a very low point. Then buyers came in aggressively and pushed the price all the way back up to close near the top. The long lower wick shows how hard sellers tried and failed to keep the price down. Buyers rejected the low price decisively. When you see a hammer at or near a support level it is a strong bullish signal that buyers are defending that price level.'},
  {n:3,t:'The shooting star — the bearish version of a hammer',x:'A shooting star has a small body at the bottom and a long upper wick at least two to three times the length of the body. It looks like a star with a tail shooting upward. What happened: The price rose dramatically to a high point. Then sellers came in aggressively and pushed the price all the way back down to close near the bottom. The long upper wick shows how hard buyers tried and failed to hold the high price. Sellers rejected the high price decisively. When you see a shooting star at or near a resistance level it is a strong bearish signal that sellers are defending that price level.'},
  {n:4,t:'The engulfing pattern — confirmation of a reversal',x:'A bullish engulfing pattern appears after a downtrend. You see a red candle followed by a green candle that is larger than the red candle and completely covers it from top to bottom. The buyers overpowered the sellers so completely that their green candle engulfed the entire red candle from the day before. This is a strong signal that buyers have taken control. A bearish engulfing is the opposite. A green candle followed by a red candle that is larger and completely covers the green one. Sellers overpowered buyers completely. These patterns are most reliable when they appear at key support or resistance levels.'},
  {n:5,t:'Multiple candle patterns — three candles that matter',x:'Three white soldiers is a bullish pattern showing three consecutive green candles each opening higher than the last and closing near their highs. This shows sustained buying pressure over three periods. Three black crows is the opposite. Three consecutive red candles each opening lower and closing near their lows. Sustained selling pressure. Morning star is a three candle bullish reversal. A large red candle followed by a small indecisive candle followed by a large green candle. The indecision day shows sellers losing steam and the final green candle shows buyers taking control. Evening star is the opposite bearish version.'},
  {n:6,t:'The most important rule about candlestick patterns',x:'Never trade a candlestick pattern in isolation. Context is everything. A hammer at a strong support level with high volume is a reliable signal. A hammer in the middle of nowhere with low volume means very little. Always ask these questions before acting on a pattern. Is this pattern at a key support or resistance level? Is the volume confirming the pattern? Is this pattern consistent with the overall trend? Does this pattern make sense in the current market environment? A candlestick pattern is one piece of evidence. Professional traders stack multiple pieces of evidence before entering a trade.'},
],
analogy:'Candlestick patterns are like body language in a conversation. A single gesture means little. But someone who crosses their arms avoids eye contact and turns their body away from you is showing you clear signals of discomfort or disagreement through multiple combined signals. Candlestick patterns work the same way. One candle is one gesture. Patterns of multiple candles together with context like support levels and volume are the complete body language of the market.',
quiz:{q:'You see a hammer candle at a price level where the stock has bounced 3 times before. The volume on the hammer day is twice the average. What does this combination tell you and what would you consider doing?',choices:['Nothing. Hammer candles are unreliable indicators.','This is a high probability bullish signal. The hammer shows buyers rejected lower prices. The prior bounces show proven support at this level. The high volume confirms strong buying interest. A trader might consider a long entry near this level with a stop loss just below the support level.','Sell immediately because the stock has been going down.','Wait for a year to see if the price moves higher.'],correct:1,explain:'This is a textbook high probability setup. Multiple confirmation factors line up together. Hammer pattern showing buyer rejection of lower prices. Three previous bounces creating proven strong support. High volume confirming real buying interest not random movement. Three independent signals all pointing to the same conclusion is much more reliable than any single signal alone.',lesson:'Stack your evidence before entering a trade. A pattern plus a proven level plus confirming volume is a high quality setup. Any one of those alone is weak. All three together is strong.'}
},
{id:'2-2',title:'Moving Averages — The Trend Following Tool',sub:'What moving averages are, how to use them, and the specific settings that matter',
terms:[
  {w:'Simple Moving Average (SMA)',d:'The average closing price of a stock over a specific number of past trading days. Recalculates every day dropping the oldest day and adding the newest.',x:'The 20 day SMA adds up the closing prices from the last 20 trading days and divides by 20. This gives you one number representing the average price over that period.'},
  {w:'Exponential Moving Average (EMA)',d:'Similar to SMA but gives more weight to recent prices making it respond faster to current price changes.',x:'The 9 EMA responds quickly to price changes and is commonly used by day traders. The 200 EMA is slow and shows the very long term trend direction.'},
  {w:'Golden Cross',d:'A bullish signal where a shorter term moving average crosses above a longer term moving average. Often signals the start of an uptrend.',x:'The 50 day moving average crossing above the 200 day moving average is a classic golden cross that signals long term bullish momentum.'},
],
teach:[
  {n:1,t:'What a moving average actually tells you',x:'A moving average is a line on a chart that shows the average price over a specific time period. It smooths out the daily noise and shows you the underlying trend direction. When the price is above the moving average the trend is generally up. When the price is below the moving average the trend is generally down. The moving average line itself shows the direction of the trend. If the line is sloping upward the trend is up. If it is sloping downward the trend is down. If it is flat there is no clear trend and you are in sideways consolidation.'},
  {n:2,t:'The most commonly used moving averages',x:'Different traders use different moving average periods depending on their trading style. Day traders often use the 9 EMA and 20 EMA on shorter time frame charts. These respond quickly to price changes. Swing traders who hold for days or weeks often use the 50 SMA and 200 SMA. Long term investors watch the 200 day SMA closely. If the stock is above its 200 day SMA the long term trend is positive. Below the 200 day SMA the long term trend is negative. The 50 day SMA is the most watched by institutional investors. When a stock holds above its 50 day SMA after a pullback it is often a buying opportunity.'},
  {n:3,t:'Moving averages as dynamic support and resistance',x:'Moving averages act as dynamic support and resistance levels. Unlike a fixed support at $50 a moving average support moves with the price. In an uptrending stock the price will often pull back to the 20 or 50 day moving average and then bounce higher. Buyers see the moving average as a value area and step in. When the price falls below a key moving average that level often becomes resistance. The same buyers who used to buy at the moving average now sell there because the trend has changed. This is why many traders use moving averages to define their bias. Above the 200 day SMA means bullish bias. Below means bearish bias.'},
  {n:4,t:'Moving average crossovers as signals',x:'A crossover happens when one moving average crosses over another. The golden cross occurs when a shorter term moving average crosses above a longer term one. The most famous is when the 50 day SMA crosses above the 200 day SMA. This historically signals the start of a sustained uptrend. The death cross is when the 50 day SMA crosses below the 200 day SMA signaling potential sustained downtrend. These signals happen rarely but when they do they are significant. Day traders use shorter term crossovers like the 9 EMA crossing the 20 EMA on 5 minute charts to signal trend changes within a single trading day.'},
  {n:5,t:'The limitation of moving averages',x:'Moving averages are lagging indicators. They tell you what has already happened not what is going to happen. They are calculated from past prices so they always trail the current price action. This means they are great at confirming a trend once it is established but poor at catching the very beginning of a move. A stock can move up 30% before the moving average fully reflects the new trend. The solution is to use moving averages for trend direction and bias while using other indicators like support resistance levels and volume for specific entry timing.'},
  {n:6,t:'A simple moving average strategy for beginners',x:'Here is a simple strategy using moving averages that beginners can start practicing. Look at a daily chart. Add the 50 day SMA and 200 day SMA. If the price is above both moving averages you have a bullish bias. Only look for buying opportunities. If the price is below both moving averages you have a bearish bias. Avoid buying. Wait for the price to pull back to the 50 day SMA in an uptrend. If it bounces with increasing volume that is a potential entry. Set your stop loss just below the 50 day SMA. This is not a complete system but it is a framework for thinking about trend and entry that beginners can practice in paper trading.'},
],
analogy:'Moving averages are like the speed limit signs you see that show the average speed of traffic. They do not tell you exactly how fast the next car will go but they tell you what the general flow of traffic has been doing. If most cars have been moving at 65mph and one car slows to 45mph it is likely to speed back up to match traffic flow. Stock prices tend to do the same thing returning to their moving average after temporary deviations.',
quiz:{q:'A stock has been in a strong uptrend for 6 months. The price pulls back and touches the 50 day moving average for the first time. What does this tell you and what would a trader watch for?',choices:['The trend is over. Sell immediately.','The stock is going to crash below all moving averages.','This is a normal healthy pullback in an uptrend. A trader would watch for the price to show signs of bouncing from the 50 day SMA. A bounce with increasing volume at the 50 day SMA would be a potential buying opportunity with a stop loss just below the moving average.','Moving averages do not matter during pullbacks.'],correct:2,explain:'In a strong uptrend the first pullback to the 50 day SMA is often a buying opportunity. The trend is intact until proven otherwise. Professional traders often set alerts for when trending stocks reach their 50 day SMA because it is a commonly watched level where buyers step in. The stop loss just below the SMA is logical because if the price breaks below it the thesis of SMA support is invalidated.',lesson:'First pullback to the 50 day SMA in an uptrend is often a buying opportunity. The 50 SMA acts as dynamic support in uptrending stocks. A bounce with volume confirms buyers are defending that level.'}
},
{id:'2-3',title:'Support, Resistance and Breakouts — Trading the Key Levels',sub:'How to use support and resistance to find real trade setups with specific entries and exits',
terms:[
  {w:'Entry Point',d:'The exact price at which you buy or sell to enter a trade. Defined precisely before you enter.',x:'Entry at $50.25 means you buy when the price reaches exactly $50.25 not somewhere around $50. Specific entry points protect you from buying at the wrong moment.'},
  {w:'Exit Point',d:'The exact price at which you will close your trade. Either a profit target or a stop loss. Defined before you enter.',x:'Enter at $50. Stop loss at $48. Profit target at $56. You know exactly three things before you risk a dollar. Entry exit and maximum loss.'},
  {w:'Risk to Reward',d:'How much you could lose compared to how much you could gain on a single trade. A 1 to 2 ratio means risking $1 to potentially make $2.',x:'Entry $50. Stop $48. Risk is $2 per share. Target $54. Reward is $4 per share. Risk to reward is 1 to 2. For every dollar risked you could make two dollars.'},
],
teach:[
  {n:1,t:'How to define a trade setup before entering',x:'A trade setup is a specific situation where the price is at a level that gives you a clear plan for entry stop loss and profit target before you risk any money. You identify a strong support level at $50 where the price has bounced three times before. You decide that if the price pulls back to $50 and shows a bullish candlestick pattern you will buy. Your stop loss will go just below $50 at $48.50. Your profit target will be the next resistance level at $56. Before you ever click buy you know your entry your maximum loss and your profit target. This is how professional traders approach every trade.'},
  {n:2,t:'Trading the bounce off support',x:'The most straightforward trade setup for beginners is buying the bounce off a strong support level. Here is the process step by step. Find a stock with a clear support level where the price has bounced at least twice before. Wait for the price to pull back and approach that support level. Do not buy immediately. Wait for confirmation. Watch for a bullish candle pattern at support such as a hammer or engulfing candle. When you see the confirmation signal buy with your stop loss just below the support level. Set your profit target at the next resistance level. The key word is patience. You wait for the price to come to you at your level. You do not chase it.'},
  {n:3,t:'Trading the breakout above resistance',x:'A breakout trade buys a stock when it breaks above a resistance level it has been stuck below. The setup is specific. Find a stock that has tested a resistance level two or more times and been rejected each time. Watch for the price to approach that level again. When the price breaks above the resistance level on high volume that is your signal. Buy as close to the breakout point as possible. Your stop loss goes just below the resistance level you just broke. If the breakout was real the old resistance becomes new support. If the price falls back below the resistance level the breakout was false and your stop loss protects you. Your target is the next resistance level above.'},
  {n:4,t:'The fake breakout — protecting yourself',x:'Fake breakouts or fakeouts are one of the biggest traps in trading. The price breaks above resistance attracting buyers then immediately reverses back below the level. Traders who bought the breakout are now stuck in a losing position. How to protect yourself from fake breakouts. Wait for a candle to close above the resistance level not just touch it. Look for higher than average volume confirming real buying interest. If the breakout is real the price should hold above the broken resistance on the next candle. If it immediately falls back below exit quickly. Time on the other side of the level matters. A price that stays above broken resistance for multiple candles is more trustworthy than one that briefly pokes through and retreats.'},
  {n:5,t:'Calculating your risk before every trade',x:'Before entering any trade do this calculation. First identify your entry price. Second identify your stop loss price. Third subtract to find your dollar risk per share. Fourth identify your profit target. Fifth divide the potential gain by the potential risk to get your risk to reward ratio. Only take trades where the risk to reward is at least 1 to 2 preferably 1 to 3 or better. Example: Entry at $50. Stop loss at $47. Risk is $3 per share. Target at $59. Potential gain is $9 per share. Risk to reward is 1 to 3. This is a high quality setup. You could be wrong more than half the time and still be profitable if your winners average three times your losers.'},
  {n:6,t:'Patience — the hardest and most valuable trading skill',x:'The biggest difference between professional traders and beginners is patience. Beginners see the market moving and want to be involved. They take trades out of boredom or FOMO. Professionals wait for their specific setups. If no setup appears today they do not trade. They understand that missing a trade is not a loss. Taking a bad trade is a loss. A day with no trades is a profitable day if it means you avoided bad setups. Think of yourself as a sniper not a machine gunner. A sniper waits hours for the perfect shot and takes one precise action. A machine gunner fires constantly hoping something hits. In trading the machine gunner approach costs you money every time you pull the trigger on a bad setup.'},
],
analogy:'Trading support resistance and breakouts is like a basketball game. Support is the floor of the court. Every time the ball is dribbled it bounces back up from the floor. Resistance is the ceiling of the arena. The ball shot toward the ceiling gets rejected and falls back down. A breakout is when the ball is thrown so hard at the ceiling that it smashes through and enters a new level. Once it breaks through the ceiling becomes a new floor on the level above.',
quiz:{q:'A stock has been rejected from $100 resistance four times over 3 months. On the fifth approach the price breaks above $100 on volume that is 3 times the average and closes at $103. What is your trade plan?',choices:['Do not trade it. Four rejections means it will reject again.','Buy immediately when it first touches $100 before the breakout is confirmed.','This is a high quality breakout. Entry around $103 on the breakout candle close. Stop loss just below $100 because old resistance should become new support. Target the next resistance level above. The high volume strongly confirms real buying interest.','Wait a month to see if the breakout holds before entering.'],correct:2,explain:'This is a textbook high quality breakout setup. Four prior rejections make $100 a very well established resistance level. Breaking through with 3x average volume shows massive buying conviction. Entering near the breakout and placing the stop just below $100 makes logical sense because the thesis is that old resistance becomes new support. Waiting a month would mean missing the entire move.',lesson:'High volume breakouts above strong multi-test resistance levels are among the highest quality setups in trading. Enter near the breakout. Stop below the broken resistance. Target the next level above.'}
},
{id:'2-4',title:'Level 2 Complete — Chart Reading Mastered',sub:'You can now read charts at a professional level',
terms:[],
teach:[
  {n:1,t:'What you have mastered in Level 2',x:'You started Level 2 unable to read a candlestick. Here is what you know now. You understand what candlestick patterns mean and what buyers and sellers are communicating through them. You know the hammer shooting star engulfing and doji patterns and what each signals. You understand moving averages — what they tell you about trend direction and how they act as dynamic support and resistance. You can identify a trade setup with a clear entry stop loss and profit target before entering. You understand how to trade bounces off support and breakouts above resistance. You know the difference between a real breakout and a fake breakout.'},
  {n:2,t:'What Level 3 brings',x:'Level 3 is technical indicators. RSI MACD Bollinger Bands and Volume. These are the tools that help you measure momentum confirm trends and time your entries more precisely. Used together with chart patterns and support resistance levels they give you a more complete picture of what a stock is likely to do next.'},
],
analogy:'You now speak the language of price charts. Level 3 adds the additional vocabulary of indicators. Charts tell you what happened. Indicators tell you how strong the move was and whether it is likely to continue.',
quiz:{q:'LEVEL 2 FINAL: Without using any indicators what three pieces of information do you need before entering any trade?',choices:['The company name earnings date and CEO','Entry price stop loss price and profit target — these three define your risk and reward before you ever click buy','The 52 week high the current price and the moving average','Whether the company pays a dividend'],correct:1,explain:'Every trade must have three things defined before entry. The exact entry price where you will buy or sell to open the position. The exact stop loss price where you will exit if wrong to limit your loss. The exact profit target where you will take your gain. Without all three you are not trading with a plan. You are gambling.',lesson:'Congratulations on completing Level 2. You are now a chart reader. Level 3 adds the technical indicators that confirm and strengthen your analysis.'}
},
]},
];
const TRACKS_INVESTIQ_RAW = {
  day: {
    name:'Day Trading',color:'var(--gold)',emoji:'📈',
    sub:'8 lessons · Beginner',
    lessons:[
      {title:'What Is Day Trading?',duration:'3 min',content:`
        <div class="lesson-h1">What Is Day Trading?</div>
        <p class="lesson-p">Day trading means you <strong>buy and sell stocks (or other assets) within the same day.</strong> You never hold anything overnight. You open a trade in the morning, close it before the market closes, and go to sleep with cash — not positions.</p>
        <div class="callout callout-gold">💡 Think of it like flipping sneakers. You buy low in the morning, sell higher by afternoon. Same idea — just with stocks.</div>
        <div class="lesson-h2">Why Do People Day Trade?</div>
        <p class="lesson-p">Because the market moves <strong>every single day</strong> — up and down, sometimes wildly. Day traders make money from those moves. They don't care if a company is good long-term. They only care about the next few hours.</p>
        <div class="lesson-h2">What Do You Need?</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Brokerage Account</div><div class="term-def">Where you buy and sell. Think TD Ameritrade, Webull, or Robinhood.</div></div>
          <div class="term-card"><div class="term-word">Capital</div><div class="term-def">The money you trade with. You can start with as little as $100 on some platforms.</div></div>
          <div class="term-card"><div class="term-word">Charts</div><div class="term-def">Visual maps of price movement. This is how you decide when to buy and sell.</div></div>
          <div class="term-card"><div class="term-word">Discipline</div><div class="term-def">The most important tool. Most beginners lose because of emotion, not strategy.</div></div>
        </div>
        <div class="callout callout-red">⚠️ Day trading is real risk. Most beginners lose money at first. The goal is to learn on a simulator before using real money.</div>
        <div class="quiz-section">
          <div class="quiz-title">Quick Check</div>
          <div class="quiz-q">What does a day trader do with their positions overnight?</div>
          <div class="quiz-options">
            <button class="quiz-opt" onclick="checkAnswer(this,false)">Hold them and wait for gains</button>
            <button class="quiz-opt" onclick="checkAnswer(this,true)">Close all positions before the day ends</button>
            <button class="quiz-opt" onclick="checkAnswer(this,false)">Transfer them to another account</button>
          </div>
        </div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'The PDT Rule — Why It Matters',duration:'4 min',content:`
        <div class="lesson-h1">The PDT Rule</div>
        <p class="lesson-p">PDT stands for <strong>Pattern Day Trader.</strong> This is a US government rule that limits how often you can day trade with a small account.</p>
        <div class="callout callout-red">⚠️ The Rule: If you make <strong>4 or more day trades in 5 business days</strong> with an account under $25,000 — your broker flags you as a Pattern Day Trader and restricts your trading.</div>
        <div class="lesson-h2">What Happens If You Get Flagged?</div>
        <p class="lesson-p">Your broker will restrict you from making day trades for <strong>90 days</strong> — or until you bring your account above $25,000. That's brutal if you're just starting.</p>
        <div class="lesson-h2">How Do You Avoid It?</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Use Forex</div><div class="term-def">The forex market has NO PDT rule. You can trade as many times as you want. This is why beginners start there.</div></div>
          <div class="term-card"><div class="term-word">Use Cash Account</div><div class="term-def">PDT only applies to margin accounts. A cash account has no PDT rule — but you can only use settled funds.</div></div>
          <div class="term-card"><div class="term-word">Stay Under 4 Trades</div><div class="term-def">If you have a margin account under $25K — just make 3 or fewer day trades per 5-day window.</div></div>
          <div class="term-card"><div class="term-word">Fund to $25K</div><div class="term-def">Once your account hits $25,000 the PDT rule no longer restricts you.</div></div>
        </div>
        <div class="callout callout-green">✅ Bottom line: Start with Forex or a cash account. No PDT headaches.</div>
        <div class="quiz-section">
          <div class="quiz-title">Quick Check</div>
          <div class="quiz-q">How many day trades can you make in 5 days before PDT kicks in on a margin account under $25K?</div>
          <div class="quiz-options">
            <button class="quiz-opt" onclick="checkAnswer(this,false)">2</button>
            <button class="quiz-opt" onclick="checkAnswer(this,true)">3 (the 4th triggers PDT)</button>
            <button class="quiz-opt" onclick="checkAnswer(this,false)">10</button>
          </div>
        </div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'How to Read a Stock Chart',duration:'5 min',content:`
        <div class="lesson-h1">Reading a Stock Chart</div>
        <p class="lesson-p">A stock chart shows you the <strong>price of a stock over time.</strong> The X-axis is time. The Y-axis is price. Simple as that.</p>
        <div class="lesson-h2">The Two Basic Chart Types</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Line Chart</div><div class="term-def">Just a line connecting closing prices over time. Simple but limited — doesn't show the full picture of each period.</div></div>
          <div class="term-card"><div class="term-word">Candlestick Chart</div><div class="term-def">The professional standard. Shows open, close, high, and low for each time period. Way more information. Learn this one.</div></div>
        </div>
        <div class="lesson-h2">Timeframes</div>
        <p class="lesson-p">Every chart has a timeframe — how much time each candle or data point represents. Day traders mostly use:</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">1-minute chart</div><div class="term-def">Each candle = 1 minute. Very fast, very noisy. Used for quick scalp trades.</div></div>
          <div class="term-card"><div class="term-word">5-minute chart</div><div class="term-def">Most popular for day trading. Good balance of detail and signal.</div></div>
          <div class="term-card"><div class="term-word">15-minute chart</div><div class="term-def">Smoother view. Good for spotting trends within a day.</div></div>
          <div class="term-card"><div class="term-word">Daily chart</div><div class="term-def">Each candle = one full day. Used by swing traders and for big picture context.</div></div>
        </div>
        <div class="callout callout-gold">💡 Start with the 5-minute chart. It's the sweet spot for beginners learning day trading.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Support & Resistance',duration:'4 min',content:`
        <div class="lesson-h1">Support & Resistance</div>
        <p class="lesson-p">These are the two most important concepts in all of trading. Once you understand them, charts start making sense.</p>
        <div class="lesson-h2">Support — The Floor</div>
        <p class="lesson-p"><strong>Support</strong> is a price level where a stock keeps bouncing back up from. Think of it as the floor. Every time the price drops to that level, buyers step in and push it back up.</p>
        <div class="callout callout-green">✅ Rule: Buy near support. The price has a history of bouncing from here.</div>
        <div class="lesson-h2">Resistance — The Ceiling</div>
        <p class="lesson-p"><strong>Resistance</strong> is a price level where a stock keeps getting pushed back down from. The ceiling. Every time it reaches that level, sellers take profits and push it down.</p>
        <div class="callout callout-red">⚠️ Rule: Be careful buying near resistance. The price has a history of reversing here.</div>
        <div class="lesson-h2">When Support or Resistance Breaks</div>
        <p class="lesson-p">When price <strong>breaks through resistance</strong> — that old ceiling becomes the new floor. This is called a <strong>breakout</strong> and it's one of the best trade signals.</p>
        <div class="callout callout-gold">💡 Breakouts are where most day trading opportunities live. Price breaks resistance → momentum carries it higher.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Risk Management — The #1 Skill',duration:'5 min',content:`
        <div class="lesson-h1">Risk Management</div>
        <p class="lesson-p">This is the most important lesson in this entire course. More traders blow up their accounts from bad risk management than from bad strategy.</p>
        <div class="lesson-h2">The 1% Rule</div>
        <p class="lesson-p">Never risk more than <strong>1% of your account on a single trade.</strong> If you have $1,000 — never risk more than $10 on any one trade. This keeps you in the game even after losing streaks.</p>
        <div class="callout callout-gold">💡 Even if you lose 10 trades in a row (unlikely) — you've only lost 10% of your account. You can recover. Blow 50% in one bad trade and recovery is brutal.</div>
        <div class="lesson-h2">Stop Loss</div>
        <p class="lesson-p">A <strong>stop loss</strong> is an automatic order that closes your trade if the price drops to a certain level. It's your safety net. You set it before you enter the trade — not after things go bad.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Stop Loss</div><div class="term-def">The price where you automatically exit a losing trade. Non-negotiable — always set one.</div></div>
          <div class="term-card"><div class="term-word">Take Profit</div><div class="term-def">The price where you automatically exit a winning trade. Lock in gains before they disappear.</div></div>
          <div class="term-card"><div class="term-word">Risk/Reward Ratio</div><div class="term-def">Compare your potential loss vs potential gain. Minimum 1:2 — risk $1 to make $2.</div></div>
        </div>
        <div class="callout callout-red">⚠️ The #1 mistake beginners make: moving their stop loss when a trade goes against them. Never do this. Set it and respect it.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Entry & Exit Strategy',duration:'4 min',content:`
        <div class="lesson-h1">Entry & Exit Strategy</div>
        <p class="lesson-p">Knowing <strong>when to get in and when to get out</strong> is the whole game. Most beginners enter randomly and exit emotionally. You need a plan before every trade.</p>
        <div class="lesson-h2">Before You Enter Any Trade — Ask These</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Why am I entering?</div><div class="term-def">There must be a clear reason — breakout, bounce off support, pattern signal. Not just "it looks like it's going up."</div></div>
          <div class="term-card"><div class="term-word">Where is my stop?</div><div class="term-def">Know exactly where you'll exit if wrong. Set it before you enter.</div></div>
          <div class="term-card"><div class="term-word">Where is my target?</div><div class="term-def">Know exactly where you'll take profits. Have a number — not just "when it feels right."</div></div>
          <div class="term-card"><div class="term-word">What's my risk?</div><div class="term-def">Calculate the dollar amount you're risking. Make sure it's within your 1% rule.</div></div>
        </div>
        <div class="callout callout-green">✅ A trade without a plan is a gamble. A trade with a plan — even if it loses — is trading.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Paper Trading — Practice Without Risk',duration:'3 min',content:`
        <div class="lesson-h1">Paper Trading</div>
        <p class="lesson-p"><strong>Paper trading</strong> means trading with fake money on real charts. The prices are real. The market is real. The money is not. It's the safest way to practice.</p>
        <div class="lesson-h2">Why Paper Trade First?</div>
        <p class="lesson-p">Because every beginner thinks they have it figured out until real money is on the line. When it's your actual money, emotions take over — fear, greed, panic. Paper trading lets you build the habit of following your plan without financial pressure.</p>
        <div class="callout callout-gold">💡 Rule: Paper trade until you're consistently profitable for 30 days. Then and only then consider real money.</div>
        <div class="lesson-h2">Free Simulators</div>

          <div class="term-card"><div class="term-word">Investopedia Simulator</div><div class="term-def">Free. Real stocks. $100K virtual money to practice with. Best starting point.</div></div>

      {title:'Your First Trade Checklist',duration:'3 min',content:`
        <div class="lesson-h1">Your First Trade Checklist</div>
        <p class="lesson-p">Before you ever place a real trade — run through this list every single time.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">✓ I have a reason</div><div class="term-def">Clear signal — breakout, support bounce, or pattern. Not a hunch.</div></div>
          <div class="term-card"><div class="term-word">✓ Stop loss is set</div><div class="term-def">I know exactly where I exit if wrong. It's already placed.</div></div>
          <div class="term-card"><div class="term-word">✓ Target is set</div><div class="term-def">I know exactly where I take profits. It's already placed.</div></div>
          <div class="term-card"><div class="term-word">✓ Risk is 1% or less</div><div class="term-def">I calculated it. The dollar amount I can lose is acceptable.</div></div>
          <div class="term-card"><div class="term-word">✓ I'm not emotional</div><div class="term-def">I'm not revenge trading after a loss. I'm not chasing a pump. I'm calm.</div></div>
          <div class="term-card"><div class="term-word">✓ I've paper traded this</div><div class="term-def">I've practiced this strategy on a simulator and it works for me.</div></div>
        </div>
        <div class="callout callout-green">✅ If you can check all 6 — you're ready to trade. If not — go back to the simulator.</div>
        <div class="sim-cta">
          <div class="sim-title">Day Trading Track Complete! 🎉</div>

          <a href="https://www.investopedia.com/simulator/" target="_blank" class="sim-btn">🎮 Open Simulator</a>
        </div>
        <button class="complete-btn" onclick="completeLesson()">✓ Track Complete!</button>
      `}

        <p class="lesson-p">Forex stands for <strong>Foreign Exchange.</strong> It's the market where currencies are traded. When you buy euros with US dollars — that's forex.</p>
        <div class="callout callout-green">✅ Forex is the largest financial market in the world. Over $7 trillion traded every single day. It never sleeps.</div>
        <div class="lesson-h2">Why Forex for Beginners?</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">No PDT Rule</div><div class="term-def">Unlike stocks, forex has no Pattern Day Trader rule. You can trade as many times as you want — even with a small account.</div></div>
          <div class="term-card"><div class="term-word">24/5 Market</div><div class="term-def">Forex trades 24 hours a day, 5 days a week. Trade before work, after work, whenever.</div></div>

      {title:'Currency Pairs Explained',duration:'4 min',content:`
        <div class="lesson-h1">Currency Pairs</div>
        <p class="lesson-p">In forex you always trade <strong>one currency against another.</strong> That's called a currency pair. You're betting that one currency will get stronger or weaker relative to the other.</p>
        <div class="lesson-h2">How to Read a Pair</div>
        <p class="lesson-p">EUR/USD means Euros vs US Dollars. The first currency (EUR) is the <strong>base</strong>. The second (USD) is the <strong>quote.</strong> If EUR/USD is 1.10 — it costs $1.10 to buy 1 Euro.</p>
        <div class="lesson-h2">The Major Pairs</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">EUR/USD</div><div class="term-def">Euro vs Dollar. Most traded pair in the world. Tight spreads, great liquidity. Start here.</div></div>
          <div class="term-card"><div class="term-word">GBP/USD</div><div class="term-def">British Pound vs Dollar. More volatile than EUR/USD. Good for experienced beginners.</div></div>
          <div class="term-card"><div class="term-word">USD/JPY</div><div class="term-def">Dollar vs Japanese Yen. Very popular. Moves in a predictable way often.</div></div>
          <div class="term-card"><div class="term-word">USD/CAD</div><div class="term-def">Dollar vs Canadian Dollar. Influenced heavily by oil prices.</div></div>

        <div class="callout callout-gold">💡 Start with EUR/USD. It's the most beginner-friendly pair — low cost to trade, very liquid, well documented.</div>

      {title:'What Are Pips?',duration:'3 min',content:`
        <div class="lesson-h1">What Are Pips?</div>
        <p class="lesson-p">A <strong>pip</strong> is the smallest price move a currency pair can make. It's how forex traders measure profit and loss.</p>
        <div class="callout callout-blue">📊 For most pairs: 1 pip = 0.0001. So if EUR/USD moves from 1.1000 to 1.1001 — that's 1 pip.</div>
        <div class="lesson-h2">How Much Is a Pip Worth?</div>
        <p class="lesson-p">It depends on your lot size — how much currency you're trading.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Standard Lot</div><div class="term-def">100,000 units. 1 pip = ~$10. For experienced traders.</div></div>
          <div class="term-card"><div class="term-word">Mini Lot</div><div class="term-def">10,000 units. 1 pip = ~$1. Good for learning with real money.</div></div>
          <div class="term-card"><div class="term-word">Micro Lot</div><div class="term-def">1,000 units. 1 pip = ~$0.10. Perfect for absolute beginners.</div></div>

      {title:'Forex Market Sessions',duration:'3 min',content:`
        <div class="lesson-h1">Forex Market Sessions</div>
        <p class="lesson-p">Forex runs 24/5 but not all hours are equal. The market is divided into four major sessions based on which financial centers are open.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Sydney Session</div><div class="term-def">5pm–2am EST. Quietest session. Low volatility. Good for learning.</div></div>
          <div class="term-card"><div class="term-word">Tokyo Session</div><div class="term-def">7pm–4am EST. JPY pairs are most active. Moderate volatility.</div></div>
          <div class="term-card"><div class="term-word">London Session</div><div class="term-def">3am–12pm EST. Highest volume. EUR and GBP pairs most active. Best setups.</div></div>
          <div class="term-card"><div class="term-word">New York Session</div><div class="term-def">8am–5pm EST. Second highest volume. USD pairs most active.</div></div>
        </div>
        <div class="callout callout-gold">💡 The best time to trade: London–New York overlap (8am–12pm EST). Both sessions are open — maximum volume and volatility.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Leverage — Power and Danger',duration:'4 min',content:`
        <div class="lesson-h1">Leverage</div>
        <p class="lesson-p">Leverage lets you control a large position with a small amount of money. Forex brokers offer very high leverage — sometimes 50:1 or even 500:1.</p>
        <div class="callout callout-gold">💡 Example: With 50:1 leverage and $100 — you control $5,000 worth of currency. A 1% move = $50 profit OR $50 loss.</div>
        <div class="lesson-h2">The Double Edge</div>
        <p class="lesson-p">Leverage <strong>amplifies both gains AND losses.</strong> This is where most beginners blow up their accounts. They use too much leverage, the market moves against them slightly, and their account is wiped.</p>
        <div class="callout callout-red">⚠️ Rule: Start with the lowest leverage your broker offers. 10:1 or less while learning. Never use maximum leverage as a beginner.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>

      {title:'Choosing a Forex Broker',duration:'3 min',content:`

          <div class="term-card"><div class="term-word">Regulated</div><div class="term-def">Only use brokers regulated by CFTC/NFA (US) or FCA (UK). This protects your money.</div></div>
          <div class="term-card"><div class="term-word">Spread</div><div class="term-def">The difference between buy and sell price. This is how the broker makes money. Lower is better.</div></div>
          <div class="term-card"><div class="term-word">Demo Account</div><div class="term-def">Free practice account with fake money. Every good broker offers one. Use it first.</div></div>
          <div class="term-card"><div class="term-word">Platform</div><div class="term-def">MetaTrader 4 (MT4) is the most popular forex platform. Most brokers support it.</div></div>

    name:'Candlesticks',color:'var(--orange)',emoji:'🕯',

    lessons:[
      {title:'What Is a Candlestick?',duration:'4 min',content:`
        <div class="lesson-h1">What Is a Candlestick?</div>
        <p class="lesson-p">A candlestick is a visual representation of price movement over a specific time period. One candle tells you <strong>4 pieces of information</strong> at once.</p>
        <div class="candle-visual">
          <div class="candle">
            <div class="candle-wick" style="height:30px;"></div>
            <div class="candle-body" style="height:60px;background:#00D4AA;"></div>
            <div class="candle-wick" style="height:20px;"></div>
            <div class="candle-label">Bullish<br>(Green)</div>
          </div>
          <div style="width:60px;"></div>
          <div class="candle">
            <div class="candle-wick" style="height:25px;"></div>
            <div class="candle-body" style="height:50px;background:#FF4444;"></div>
            <div class="candle-wick" style="height:35px;"></div>
            <div class="candle-label">Bearish<br>(Red)</div>
          </div>
        </div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Open</div><div class="term-def">Where the price started at the beginning of the time period.</div></div>
          <div class="term-card"><div class="term-word">Close</div><div class="term-def">Where the price ended at the end of the time period.</div></div>
          <div class="term-card"><div class="term-word">High</div><div class="term-def">The highest price reached during the period. Top of the wick.</div></div>
          <div class="term-card"><div class="term-word">Low</div><div class="term-def">The lowest price reached during the period. Bottom of the wick.</div></div>
        </div>
        <div class="callout callout-green">✅ Green candle = price went UP (close higher than open). Red candle = price went DOWN (close lower than open).</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Bullish Candle Patterns',duration:'5 min',content:`
        <div class="lesson-h1">Bullish Candle Patterns</div>
        <p class="lesson-p"><strong>Bullish</strong> means price is likely going UP. These patterns signal buying opportunities.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Hammer 🔨</div><div class="term-def">Small body at top, long lower wick. Means sellers pushed price down but buyers fought back hard. Bullish reversal signal.</div></div>
          <div class="term-card"><div class="term-word">Bullish Engulfing</div><div class="term-def">A large green candle that completely covers the previous red candle. Strong signal that buyers took over.</div></div>
          <div class="term-card"><div class="term-word">Morning Star</div><div class="term-def">3-candle pattern: red candle, tiny candle, big green candle. Signals the end of a downtrend.</div></div>
          <div class="term-card"><div class="term-word">Doji</div><div class="term-def">Open and close are nearly the same. Looks like a cross. Signals indecision — often precedes a reversal.</div></div>
        </div>
        <div class="callout callout-gold">💡 No single candle is 100% reliable. Always confirm with the surrounding context — where is the price? Near support? After a downtrend?</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Bearish Candle Patterns',duration:'5 min',content:`
        <div class="lesson-h1">Bearish Candle Patterns</div>
        <p class="lesson-p"><strong>Bearish</strong> means price is likely going DOWN. These patterns signal selling opportunities or times to exit longs.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Shooting Star ⭐</div><div class="term-def">Small body at bottom, long upper wick. Buyers pushed price up but sellers crushed it back. Bearish reversal.</div></div>
          <div class="term-card"><div class="term-word">Bearish Engulfing</div><div class="term-def">Large red candle covers previous green candle completely. Sellers took full control.</div></div>
          <div class="term-card"><div class="term-word">Evening Star</div><div class="term-def">3-candle pattern: green candle, tiny candle, big red candle. End of uptrend signal.</div></div>
          <div class="term-card"><div class="term-word">Hanging Man</div><div class="term-def">Same shape as hammer but appears at the TOP of an uptrend. Bearish signal.</div></div>
        </div>
        <div class="callout callout-red">⚠️ Context is everything. A shooting star at resistance after a long uptrend = strong sell signal. Same candle in the middle of nowhere = weak signal.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'The 5 Most Important Patterns',duration:'5 min',content:`
        <div class="lesson-h1">The 5 Patterns That Matter Most</div>
        <p class="lesson-p">Out of dozens of candlestick patterns — these 5 are the ones every trader uses daily.</p>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">1. Hammer / Shooting Star</div><div class="term-def">The most reliable reversal signals. Hammer at support = buy. Shooting star at resistance = sell.</div></div>
          <div class="term-card"><div class="term-word">2. Engulfing Patterns</div><div class="term-def">Bullish or bearish. When one candle swallows the previous — momentum shifted. High probability signal.</div></div>
          <div class="term-card"><div class="term-word">3. Doji</div><div class="term-def">Indecision. Watch the next candle carefully — it often tells you which direction wins.</div></div>
          <div class="term-card"><div class="term-word">4. Long Wicks</div><div class="term-def">A very long wick in any direction shows rejection. Price tried to go there but was pushed back hard.</div></div>
          <div class="term-card"><div class="term-word">5. Inside Bar</div><div class="term-def">A small candle completely inside the previous candle's range. Market is coiling — a big move is coming.</div></div>
        </div>
        <div class="callout callout-green">✅ Master these 5 before learning any others. They cover 80% of what you'll see on real charts.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Reading Candles in Context',duration:'4 min',content:`
        <div class="lesson-h1">Reading Candles in Context</div>
        <p class="lesson-p">A single candle means nothing on its own. <strong>Where it appears on the chart is everything.</strong></p>
        <div class="lesson-h2">The 3 Questions to Ask</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">What's the trend?</div><div class="term-def">Is price generally going up, down, or sideways? Trade with the trend — not against it as a beginner.</div></div>
          <div class="term-card"><div class="term-word">Where is price?</div><div class="term-def">Near support? Near resistance? At a key level? Candles at key levels carry much more weight.</div></div>
          <div class="term-card"><div class="term-word">What's the volume?</div><div class="term-def">High volume confirms the pattern. A hammer on high volume is far more reliable than a hammer on low volume.</div></div>
        </div>
        <div class="callout callout-gold">💡 The best trades happen when multiple signals align — a hammer at support with high volume after a downtrend. That's a high-probability setup.</div>
        <button class="complete-btn" onclick="completeLesson()">✓ Got It — Next Lesson</button>
      `},
      {title:'Practice Reading Live Charts',duration:'3 min',content:`
        <div class="lesson-h1">Now Go Read Live Charts</div>
        <p class="lesson-p">The only way to truly learn candlesticks is to look at thousands of them. No amount of reading replaces practice.</p>
        <div class="lesson-h2">Your Practice Routine</div>
        <div class="term-grid">
          <div class="term-card"><div class="term-word">Daily Habit</div><div class="term-def">Open TradingView every day. Look at EUR/USD on a 5-min chart. Identify every pattern you see.</div></div>
          <div class="term-card"><div class="term-word">Replay Mode</div><div class="term-def">TradingView has a bar replay feature. You can rewind any chart and practice reading candles in real time.</div></div>
          <div class="term-card"><div class="term-word">Annotate</div><div class="term-def">Draw on the chart. Mark your support/resistance. Circle patterns you recognize. This builds your eye.</div></div>

      `}

        <div class="lesson-h1">What Are Options?</div>
        <p class="lesson-p">An option is a <strong>contract that gives you the right — but not the obligation</strong> — to buy or sell a stock at a specific price before a specific date.</p>
        <div class="callout callout-red">⚠️ Options are more complex than stocks or forex. Complete the Day Trading and Candlesticks tracks first. Do not trade options with real money until you deeply understand them.</div>

          <div class="term-card"><div class="term-word">Put Option</div><div class="term-def">The right to SELL a stock at a set price. You buy puts when you think the price will go DOWN.</div></div>
