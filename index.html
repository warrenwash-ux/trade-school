correct:1,explain:'The 5+ unit threshold is critical. 1-4 unit properties = residential financing (lower down payment, better rates, easier to qualify). 5+ units = commercial financing (25-35% down, stricter qualification, different valuation methods). <strong>A fourplex is treated like a home by the bank. A sixplex requires commercial financing.</strong>',lesson:'Property classification determines how you finance it, how it\'s valued, and what rules apply. The 4-unit threshold is one of the most important lines in real estate investing.'}
},
{id:'1-3',title:'How Real Estate Transactions Work — The Full Process',sub:'From finding a property to getting the keys — every step explained',
terms:[
  {w:'Purchase Agreement',d:'The legally binding contract between buyer and seller that specifies the price, terms, and conditions of the real estate sale.',x:'When your offer is accepted and both parties sign, the purchase agreement is formed. This is when you\'re legally committed.'},
  {w:'Closing',d:'The final step in a real estate transaction where ownership officially transfers from seller to buyer. All documents signed, funds transferred, keys handed over.',x:'Closing day: you sign 50+ documents, wire your down payment and closing costs, and receive the keys to your new property.'},
  {w:'Closing Costs',d:'Fees and expenses paid at closing beyond the purchase price. Includes lender fees, title insurance, appraisal, escrow fees, and prorations.',x:'On a $200,000 purchase with a $160,000 loan, expect $3,200-$8,000 in closing costs (2-5% of loan amount).'},
],
teach:[
  {n:1,t:'Step 1 — Get pre-approved for a mortgage (before looking)',x:'Before you look at a single property, go to a bank or mortgage broker and get pre-approved. They review your income, credit score, debts, and assets. They tell you exactly how much you can borrow and at what rate. <strong>Without a pre-approval letter, sellers won\'t take your offer seriously.</strong> This step takes 1-3 days and costs nothing.'},
  {n:2,t:'Step 2 — Find the property and make an offer',x:'Work with a buyer\'s agent (free to you — seller pays their commission) or search Zillow, Realtor.com, and your local MLS. When you find the right property, your agent writes a purchase offer specifying: price, earnest money amount, contingencies (inspection, financing, appraisal), and closing timeline. The seller accepts, rejects, or counters.'},
  {n:3,t:'Step 3 — Due diligence period (investigate everything)',x:'After an offer is accepted, you typically have 10-30 days to investigate. During this time: hire a licensed home inspector ($300-500) to examine the property, review all seller disclosures, have the title company run a title search, and your lender orders an appraisal. <strong>This is your only chance to find problems before they\'re legally yours.</strong>'},
  {n:4,t:'Step 4 — Closing day',x:'The title company or real estate attorney coordinates closing. You sign dozens of documents including the deed, mortgage note, and closing disclosure. You wire your down payment and closing costs. The seller receives their proceeds. The deed is recorded with the county. <strong>The moment recording happens, you are legally the owner.</strong>'},
],
analogy:'A real estate transaction is like a relay race with four legs: Pre-approval (getting your running shoes on and stretching), Making an offer (the starting gun), Due diligence (the middle lap — your chance to find any problems), and Closing (the finish line — where ownership officially transfers). Skip any leg and you risk problems.',
quiz:{q:'During the due diligence period, a home inspector finds the HVAC system is 22 years old and needs replacement (estimated $8,000). What can the buyer do with this information?',
choices:['Nothing — the inspector\'s report is for information only','Negotiate a price reduction, ask the seller to fix it or credit money at closing, or cancel the contract and get earnest money back if within the inspection contingency period','Immediately terminate the deal with no recourse','Only use it to make a decision, but cannot ask the seller for anything'],
correct:1,explain:'The due diligence period exists precisely for this reason. If the inspection reveals significant issues, the buyer has multiple options within the contingency period: negotiate a lower price, request repairs, ask for a seller credit at closing to cover the repair cost, or cancel the contract and recover the earnest money. <strong>The inspection contingency is one of the most powerful protections a buyer has.</strong>',lesson:'The due diligence period is your window to discover problems and negotiate solutions. Never waive your inspection contingency — it is your most important protection as a buyer.'}
},
{id:'1-4',title:'Financing Basics — Mortgages, Rates & Loan Types',sub:'Every type of mortgage explained in plain English before you ever apply',
terms:[
  {w:'Principal',d:'The original loan amount borrowed. The part of your payment that reduces what you owe.',x:'$160,000 mortgage = $160,000 principal. Each month a small part of your payment reduces this balance.'},
  {w:'Interest Rate',d:'The annual percentage the lender charges for borrowing money. Determines how much your monthly payment is.',x:'$160,000 at 7% interest for 30 years = $1,065/month. At 6% = $959/month. Rate matters enormously.'},
  {w:'Fixed Rate Mortgage',d:'A mortgage where the interest rate stays the same for the entire loan term. Your payment never changes.',x:'30-year fixed at 7%: your payment of $1,065 stays exactly the same for all 360 payments. Predictable and stable.'},
  {w:'Adjustable Rate Mortgage (ARM)',d:'A mortgage where the rate can change periodically after an initial fixed period. Can rise or fall.',x:'5/1 ARM: fixed at 6% for first 5 years, then adjusts annually. Payment could increase significantly after year 5.'},
],
teach:[
  {n:1,t:'Conventional loans — the standard mortgage',x:'A conventional loan is a standard mortgage not backed by the government. Requires 3-20% down payment, good credit (620+ minimum, 740+ for best rates), and proof of income. <strong>Put 20% down and avoid PMI (Private Mortgage Insurance)</strong> — a monthly charge added when you put less than 20% down, typically 0.5-1.5% of the loan annually.'},
  {n:2,t:'FHA loans — the beginner\'s best friend',x:'FHA (Federal Housing Administration) loans are government-backed mortgages designed to help first-time and lower-income buyers. Key benefits: only <strong>3.5% down payment</strong>, credit score as low as 580, and more flexible income requirements. Downside: you must pay MIP (Mortgage Insurance Premium) for the life of the loan. <strong>This is the most used loan type for first-time investors using house hacking.</strong>'},
  {n:3,t:'VA loans — for veterans and active military',x:'VA loans are guaranteed by the Department of Veterans Affairs. Key benefits: <strong>zero down payment</strong>, no PMI, competitive rates, and easier qualification. Available to veterans, active-duty military, and eligible surviving spouses. If you qualify, this is almost always the best loan option available.'},
  {n:4,t:'Hard money loans — for investors and flippers',x:'Hard money loans come from private investors or companies, not banks. They\'re based on the property value (not the borrower\'s creditworthiness), close in days not weeks, and have high interest rates (10-15%+). <strong>Used primarily by house flippers</strong> who need fast financing, plan to sell within 6-12 months, and can\'t wait for bank approval. Not for long-term holds.'},
],
analogy:'Loan types are like different tools in a toolbox. Conventional = a standard hammer (works for most jobs, requires some skill to use). FHA = a starter tool kit (easier to start with, slight limitations). VA = a professional tool given free to those who earned it (best quality, zero cost for qualifying veterans). Hard money = a power saw (fast, powerful, expensive to operate, and you better know what you\'re doing).',
quiz:{q:'You\'re a first-time buyer with a 620 credit score and only $8,000 saved. You want to buy a $180,000 duplex and house hack. Which loan type is most appropriate and approximately how much down payment is required?',
choices:['Conventional loan — requires 20% down ($36,000) — not feasible with $8,000 saved','FHA loan — requires 3.5% down ($6,300) — feasible with $8,000 saved (leaving money for closing costs too)','Hard money loan — requires no credit check','VA loan — requires 0% down — unless you\'re a veteran, this is not available to you'],
correct:1,explain:'With $8,000 saved and a 620 credit score, FHA is the right tool. 3.5% of $180,000 = $6,300 down payment. Remaining $1,700 helps with closing costs (though you may need seller credits or a gift for full closing costs). <strong>FHA loans make owner-occupied purchases like house hacking accessible to buyers who couldn\'t otherwise afford a conventional loan\'s 20% down requirement.</strong>',lesson:'Matching the right loan type to your situation is crucial. FHA opens doors for beginners. Conventional becomes better once you have 20%+ down. VA is the best available loan for those who qualify. Hard money is a tool for experienced investors moving fast.'}
},
{id:'1-5',title:'Reading the Real Estate Market',sub:'How to know if it\'s a buyer\'s market or seller\'s market — and why it matters',
terms:[
  {w:'Buyer\'s Market',d:'When there are more homes for sale than buyers. Properties sit on the market longer. Buyers have more negotiating power.',x:'If 500 homes are for sale in a city with only 200 active buyers, sellers compete for attention. Buyers can negotiate price reductions, repairs, and concessions.'},
  {w:'Seller\'s Market',d:'When there are more buyers than available homes. Properties sell quickly, often above asking price. Sellers have the power.',x:'During 2021-2022, extreme demand and low inventory caused most US markets to go heavily seller\'s market. Homes sold in days with multiple offers above asking price.'},
  {w:'Absorption Rate',d:'How quickly homes are selling in a market. Calculated as sales per month divided by active listings. Shows months of supply.',x:'100 homes sell per month in a city with 200 active listings = 2 months of supply. Under 6 months = seller\'s market. Over 6 months = buyer\'s market.'},
],
teach:[
  {n:1,t:'What drives real estate markets',x:'Real estate prices are driven by supply and demand. Supply = number of homes available for sale. Demand = number of buyers actively looking. <strong>When demand exceeds supply, prices rise. When supply exceeds demand, prices fall or stagnate.</strong> Local factors (job growth, population change, new construction) matter more than national trends in real estate.'},
  {n:2,t:'Interest rates and their impact',x:'When interest rates rise, monthly mortgage payments increase, reducing what buyers can afford, which reduces demand and can cool prices. When rates fall, buying power increases, demand grows, and prices often rise. <strong>Interest rates are one of the most powerful forces in the real estate market.</strong> A 1% rate increase on a $300,000 loan adds about $175/month to the payment.'},
  {n:3,t:'Key market indicators to track',x:'(1) <strong>Days on Market (DOM)</strong> — how long homes sit unsold. Low DOM = hot market. High DOM = slow market. (2) <strong>List-to-sale ratio</strong> — what percentage of asking price homes actually sell for. Above 100% = multiple offers above asking (hot). Below 95% = buyer negotiating power. (3) <strong>Months of supply</strong> — how long it would take to sell all current inventory at today\'s pace. Under 3 months = very hot. Over 6 = buyer\'s market.'},
  {n:4,t:'Why local matters more than national',x:'National real estate headlines can be misleading. While one city might be crashing, another might be booming. <strong>Real estate is hyperlocal.</strong> A ZIP code 5 miles away can have completely different market conditions. Always research your specific target area: job growth, population trends, new businesses opening, school quality, crime trends. These local factors predict values better than any national statistic.'},
],
analogy:'The real estate market works like a parking lot at a popular restaurant. Seller\'s market = Saturday night, everyone wants a spot, people circle the lot aggressively (buyers compete for homes). Buyer\'s market = Tuesday at 3pm, plenty of spots available, you can park anywhere and even negotiate a discount (buyers have choices and leverage). The restaurant\'s food (property quality) matters — but the time and day (market conditions) determines the price you pay.',
quiz:{q:'A city has 400 active homes for sale and sells an average of 50 homes per month. What is the months of supply and what type of market is this?',
choices:['2 months of supply — a very hot seller\'s market','8 months of supply — a buyer\'s market where buyers have negotiating power','4 months of supply — a balanced market','400 months of supply — an extreme buyer\'s market'],
correct:1,explain:'Months of supply = active listings / monthly sales = 400 / 50 = 8 months of supply. The rule of thumb: under 3 months = strong seller\'s market. 4-6 months = balanced. Over 6 months = buyer\'s market. <strong>8 months of supply means buyers have significant leverage — sellers are competing for fewer buyers and must negotiate on price, repairs, and terms.</strong>',lesson:'Months of supply is one of the most useful market indicators. Calculate it for any market you\'re considering: active listings / homes sold per month. Under 3 = competitive. Over 6 = negotiate hard.'}
},
{id:'1-6',title:'Level 1 Complete — Foundation Check',sub:'Lock in your real estate foundation before advancing',
terms:[],
teach:[
  {n:1,t:'Everything you\'ve learned in Level 1',x:'✅ What real estate is — land plus everything permanently attached\n✅ Four wealth-building forces — cash flow, appreciation, equity, tax benefits\n✅ Types of real estate — residential (1-4 units), commercial (5+ units, office, retail), industrial, land\n✅ The full transaction process — pre-approval → offer → due diligence → closing\n✅ Loan types — conventional, FHA (3.5% down), VA (0% down for veterans), hard money\n✅ Market dynamics — buyer\'s vs seller\'s market, months of supply, what drives prices'},
  {n:2,t:'The single most important Level 1 insight',x:'<strong>Real estate builds wealth four ways simultaneously — cash flow, appreciation, equity buildup, and tax benefits.</strong> No other common investment does all four at once. This is why real estate has created more millionaires than any other asset class. And you do not need to be rich to start — you just need the right knowledge and the right loan.'},
  {n:3,t:'What Level 2 brings',x:'Now that you understand what real estate is and how the system works, Level 2 teaches you how to BUY your first property — mortgages, down payments, making offers, negotiating, and getting to the closing table.'},
],
analogy:'You\'ve learned the rules of the game. You know what the board looks like, how the pieces move, and what winning looks like. Level 2 is where you start playing.',
quiz:{q:'Which single advantage makes real estate unique compared to stocks, bonds, or savings accounts?',
choices:['Real estate never loses value','Real estate builds wealth through four simultaneous forces — cash flow, appreciation, equity buildup, AND tax benefits — all working at the same time from a single investment','Real estate requires no work or management','Real estate always outperforms the stock market'],
correct:1,explain:'Real estate\'s unique power is the four simultaneous wealth-building forces. A stock only appreciates (or doesn\'t). A bond only pays interest. A savings account only earns minimal interest. Real estate does all four at once — often using borrowed money (leverage) to amplify all four forces simultaneously.',lesson:'Congratulations on completing Level 1. You have the foundation most people never get before investing. Level 2 starts your practical education on buying your first property.'}
},
]},
{num:2,title:'Buying Your First Property',desc:'From finding the right deal to sitting at the closing table — the complete buying process',
lessons:[
{id:'2-1',title:'What to Look For in a Property',sub:'How to evaluate any property before making an offer',
terms:[
  {w:'Comparable Sales (Comps)',d:'Recently sold properties similar to the one you\'re evaluating, in the same neighborhood. Used to determine fair market value.',x:'To value a 3-bed/2-bath house in a neighborhood, find 3-5 similar 3/2 houses that sold within the last 3 months nearby.'},
  {w:'Market Value',d:'The price a willing buyer and willing seller agree on in an arm\'s length transaction. What the property is actually worth in today\'s market.',x:'A property\'s market value is NOT necessarily its asking price. Comps determine real value, not what the seller wants.'},
  {w:'Price Per Square Foot',d:'The property\'s price divided by its total square footage. Used to quickly compare property values.',x:'House A: $200,000 / 1,500 sq ft = $133/sq ft. House B: $180,000 / 1,200 sq ft = $150/sq ft. House A is cheaper per square foot.'},
],
teach:[
  {n:1,t:'Location — the single most important factor',x:'The old real estate saying "location, location, location" is true. <strong>You can renovate a house. You cannot move it.</strong> Key location factors: school district quality (affects value even for non-parents), proximity to employment centers and transit, neighborhood trajectory (improving, stable, or declining), crime rates, and future development planned nearby. A great house in a bad location is a bad investment. A mediocre house in a great location is often a great investment.'},
  {n:2,t:'Evaluating the physical condition',x:'Before making an offer, do a preliminary walkthrough. Look for: roof condition (most expensive repair, $8,000-$25,000+), HVAC system age (15-20 year lifespan, $5,000-$12,000 to replace), foundation issues (cracks, uneven floors — very expensive), water damage signs (stains on ceilings, walls, smell), and electrical/plumbing age. <strong>Big-ticket items affect your negotiation and your renovation budget.</strong>'},
  {n:3,t:'Running the basic numbers',x:'For any potential rental property, quickly run the 1% rule first: if the monthly rent is at least 1% of the purchase price, it may cash flow. $200,000 property → needs $2,000/month rent to pass the 1% rule. This is a quick screening tool, not a final analysis. Properties passing the 1% rule deserve deeper analysis. Those failing it rarely cash flow well.'},
  {n:4,t:'Neighborhood trajectory — where is it going?',x:'Look at trends, not just today\'s snapshot. Signs of improvement: new restaurants and coffee shops opening, renovation activity on neighboring homes, businesses moving in, younger residents. Signs of decline: boarded up buildings, businesses closing, population loss, deferred maintenance on most homes. <strong>Improving neighborhoods offer the best appreciation potential.</strong>'},
],
analogy:'Evaluating a property is like evaluating a used car. You check the big mechanical systems (engine = foundation and structure), cosmetics (paint = curb appeal), history (CarFax = title search), and what similar cars sold for recently (comps = comparable sales). A great paint job hiding a broken engine is a bad deal. A rough-looking car with a perfect engine in a good neighborhood is a great deal.',
quiz:{q:'A house is listed for $220,000 in a neighborhood where similar homes recently sold for $185,000-$195,000. The seller says it\'s worth more because they renovated the kitchen. What should you do?',
choices:['Pay the asking price — the renovation clearly adds value','Run comps yourself using recent sales data. If similar renovated homes sold for $185,000-$195,000, the market determines value not the seller\'s cost of renovations. Offer based on comps, not asking price.','Always offer 10% under asking regardless of comps','Trust the seller\'s valuation since they know the house best'],
correct:1,explain:'A seller\'s renovation costs do NOT automatically add equivalent value. What matters is what the market will pay — determined by comparable sales. If similar homes (even renovated ones) sold for $185,000-$195,000, that\'s the market\'s verdict on value. <strong>Comps determine value. Seller asking price is just a starting point for negotiation.</strong>',lesson:'Always run your own comps before making an offer. Never pay more than market value supports. The seller\'s cost of renovations has no bearing on what a buyer should pay.'}
},
{id:'2-2',title:'Making an Offer & Negotiating',sub:'How to write a strong offer and negotiate effectively without overpaying',
terms:[
  {w:'Counteroffer',d:'When a seller responds to a buyer\'s offer with different terms (usually a different price). Legally rejects the original offer and creates a new one.',x:'You offer $185,000. Seller counters at $195,000. Your original offer is dead. You can accept $195K, counter again, or walk away.'},
  {w:'As-Is',d:'Selling in current condition without any repairs or concessions. Buyer accepts the property however it is.',x:'"Sold as-is" means the seller won\'t fix anything found in inspection. You can still inspect and walk away if problems are severe.'},
  {w:'Seller Concessions',d:'Money or credits the seller agrees to pay toward the buyer\'s costs — such as paying closing costs or fixing repairs.',x:'Seller agrees to give $5,000 credit at closing. That credit reduces how much cash you need to bring to closing.'},
],
teach:[
  {n:1,t:'What goes into an offer',x:'A real estate offer includes: (1) Purchase price, (2) Earnest money amount (1-3% of price shows seriousness), (3) Contingencies — inspection (right to inspect and negotiate based on findings), financing (right to cancel if you can\'t get a mortgage), appraisal (right to cancel if it appraises below purchase price), (4) Closing date (typically 30-45 days from accepted offer), (5) What\'s included (appliances? furniture?).'},
  {n:2,t:'How to determine your offer price',x:'Start with comps — recent sales of similar properties. If comps show $185,000-$195,000, your initial offer depends on market conditions. In a seller\'s market (hot): offer at or above asking. In a buyer\'s market (slow): start at 5-10% below asking. Always know your maximum price BEFORE negotiating and stick to it. <strong>Emotional overbidding is the most expensive mistake in real estate.</strong>'},
  {n:3,t:'Contingencies — your protection, not weakness',x:'Contingencies are conditions that must be met for the sale to close. They protect you. Key contingencies: Inspection (you can negotiate or walk away based on inspection results), Financing (you can cancel if the bank denies your loan — you get earnest money back), Appraisal (if the property appraises below your offer price, you can cancel or renegotiate). <strong>Never waive contingencies on properties you haven\'t thoroughly researched.</strong>'},
  {n:4,t:'Negotiating effectively',x:'Negotiation is about information and emotions. Know your comps (information) and stay unemotional (discipline). After inspection reveals problems: request credits equal to the repair cost rather than asking the seller to fix things yourself (you control quality and cost). Be willing to walk away — <strong>the moment you MUST have a property, you\'ve lost your negotiating power.</strong> There is always another deal.'},
],
analogy:'Making a real estate offer is like negotiating for a car. You research what similar cars sold for recently (comps), make an offer based on real data not emotions, add conditions protecting you (test drive = inspection, financing approval = financing contingency), and walk away if the seller won\'t come to a fair price. The dealer knowing you NEED this specific car = you overpay. The dealer knowing you\'ll walk = fair deal.',
quiz:{q:'Your home inspection reveals the need for a new roof ($14,000) and new HVAC ($9,000) — total $23,000 in deferred maintenance. The seller says "sold as-is" and won\'t negotiate. What should you consider?',
choices:['Buy it anyway — as-is sales are always great deals','Request a $23,000 credit at closing or price reduction. If seller refuses, carefully evaluate: can you buy it at a price that accounts for the repairs ($23K deducted from your offer)? If not, walk away — the deal economics don\'t work.','Always avoid as-is sales completely','Only buy if the seller fixes everything before closing'],
correct:1,explain:'As-is doesn\'t mean you can\'t negotiate — it means the seller doesn\'t want to make repairs themselves. You can still counter with a lower price or closing credit reflecting repair costs. If they refuse and the economics don\'t work with $23K in immediate repairs, <strong>walking away is not failure — it\'s smart investing.</strong> Bad deals don\'t get better at closing.',lesson:'As-is properties can be good deals or bad ones. The key: build ALL known repair costs into your offer price. If the math doesn\'t work after accounting for repairs, walk away. There will always be another property.'}
},
{id:'2-3',title:'The Closing Process — Step by Step',sub:'Everything that happens between accepted offer and getting the keys',
terms:[
  {w:'Title Search',d:'A review of public records to confirm the seller legally owns the property and there are no undisclosed liens, judgments, or ownership claims.',x:'Before closing, a title company searches county records going back decades to find any hidden claims on the property.'},
  {w:'Deed',d:'The legal document that transfers property ownership from seller to buyer. Must be recorded with the county to make the transfer official.',x:'At closing, the seller signs the deed transferring ownership to you. The title company then records it with the county — that\'s when you legally own it.'},
  {w:'Prorations',d:'Costs split between buyer and seller based on what portion of the year or month each party owned the property.',x:'Seller paid property taxes for the full year but you\'re buying in October. They get a credit for the Jan-Sep taxes they already paid for a period you\'ll own the property.'},
],
teach:[
  {n:1,t:'What happens after an offer is accepted',x:'Once both parties sign the purchase agreement: (1) Buyer deposits earnest money with escrow/title company. (2) Buyer applies for the mortgage (if not already started). (3) Lender orders appraisal. (4) Buyer schedules and completes inspection. (5) Title company begins title search. (6) Buyer purchases homeowner\'s insurance (required by lender). (7) Final walk-through typically 24 hours before closing.'},
  {n:2,t:'The appraisal — and what happens if it comes in low',x:'Your lender requires an independent appraisal to confirm the property is worth what you\'re paying. If it appraises at or above your purchase price — the deal proceeds normally. If it appraises BELOW your purchase price — you have options: (1) Renegotiate the purchase price down to the appraised value, (2) Pay the difference in cash out of pocket (risky), (3) Cancel the contract if you have an appraisal contingency. <strong>Never waive the appraisal contingency unless you have cash to cover a potential gap.</strong>'},
  {n:3,t:'Closing day — what to bring and expect',x:'Bring to closing: government-issued photo ID, a cashier\'s check or proof of wire transfer for your closing funds (personal checks not accepted for large amounts), and your checkbook for any small last-minute adjustments. The closing process takes 1-3 hours. You will sign approximately 50-100 pages of documents. A title officer or attorney will explain each one. Do not rush — ask questions if anything is unclear.'},
  {n:4,t:'After closing — your responsibilities',x:'Once you own the property: (1) Change all the locks immediately. (2) Notify utilities to transfer to your name. (3) File for homestead exemption if it\'s your primary residence (reduces property taxes in most states). (4) Start a maintenance reserve — budget 1% of property value annually for repairs. (5) If renting, begin tenant screening and lease signing process.'},
],
analogy:'The closing process is like a relay race where multiple teams run simultaneously. Team 1 (lender) handles mortgage approval and appraisal. Team 2 (title company) handles title search and document preparation. Team 3 (buyer) handles inspection, insurance, and gathering closing funds. All teams must finish their legs before the race officially ends on closing day — when the baton (the deed) is officially handed to you.',
quiz:{q:'Three days before closing, the appraisal comes back at $185,000. Your purchase price is $200,000. You have an appraisal contingency. What are your options?',
choices:['You must proceed at $200,000 — the appraisal doesn\'t change your contract obligation','You can: (1) Negotiate the price down to $185,000, (2) Pay the $15,000 gap in cash, or (3) Cancel the contract and recover your earnest money using your appraisal contingency','Your lender will simply lend based on $200,000 regardless','You lose your earnest money if you cancel due to a low appraisal'],
correct:1,explain:'An appraisal contingency gives the buyer the right to cancel (and recover earnest money) if the property doesn\'t appraise at the purchase price. The lender will only loan based on the appraised value ($185,000), not the contract price ($200,000). <strong>This means you would need to bring an additional $15,000 cash to closing — or renegotiate the price down.</strong> The appraisal contingency protects you from being forced to do either.',lesson:'The appraisal contingency is critical protection. Never waive it unless you have cash to cover a potential gap AND you\'re certain of the property\'s value. A low appraisal gives you leverage to renegotiate the price down.'}
},
{id:'2-4',title:'Level 2 Complete — First Purchase Ready',sub:'You now know how to buy property',
terms:[],
teach:[
  {n:1,t:'What you\'ve mastered in Level 2',x:'✅ What to look for in a property — location, condition, numbers, neighborhood trajectory\n✅ Comparable sales — how to determine real market value\n✅ The 1% rule — quick screening for rental properties\n✅ Making an offer — what goes in it, how to price it, using contingencies\n✅ Negotiating — using information and staying unemotional\n✅ The closing process — appraisal, title search, closing day, post-closing responsibilities'},
  {n:2,t:'The single most important Level 2 lesson',x:'<strong>Contingencies are your protection, not weakness.</strong> The inspection contingency lets you discover and negotiate around problems. The financing contingency protects your earnest money if the loan falls through. The appraisal contingency prevents you from overpaying. Never waive these protections on a property you haven\'t thoroughly researched — one expensive surprise can eliminate years of profit.'},
  {n:3,t:'What Level 3 brings',x:'Level 3 teaches you how to turn property ownership into monthly income — rental analysis, tenant management, lease structure, and the exact math behind cash flow investing.'},
],
analogy:'You\'ve learned to drive. You know the rules of the road, how to use the controls, and how to get from point A to point B safely. Level 3 teaches you where to go and how to make money along the way.',
quiz:{q:'You find a property listed for $175,000 in a neighborhood where similar homes sold for $155,000-$165,000. In a balanced market, what is the most appropriate initial offer strategy?',
choices:['Offer the full $175,000 to show you\'re serious','Offer based on comps — approximately $155,000-$162,000, with justification from comparable sales. Let the seller counter. The $175,000 asking price is above market value.','Never make an offer below asking price — it insults the seller','Offer $130,000 — always start 25% below asking in all markets'],
correct:1,explain:'In a balanced market, comps determine value. If similar homes sold for $155-165K, the $175K asking price is above market. A reasonable initial offer of $155-162K is justified by the data. <strong>Start with the data, not with emotions.</strong> The seller may counter, and you negotiate from there. If the seller won\'t come to fair market value, there are other properties.',lesson:'Congratulations on completing Level 2. You now understand the complete buying process. Level 3 turns that purchased property into a monthly income machine.'}
},
]},
{num:3,title:'Rental Income & Cash Flow',desc:'How to analyze rental properties, manage tenants, and build passive income',
lessons:[
{id:'3-1',title:'Analyzing a Rental Property — The Complete Formula',sub:'Every number in a rental deal explained and calculated before any question',
terms:[
  {w:'Gross Rental Income',d:'The total rent collected if the property is 100% occupied for the full year. The starting point for any rental analysis.',x:'4 units at $900/month each = $3,600/month × 12 months = $43,200 annual gross rental income.'},
  {w:'Vacancy Rate',d:'The percentage of time a property is expected to be empty (between tenants). Budget 5-10% for most markets.',x:'$43,200 gross income × 7% vacancy = $3,024 vacancy loss. Effective income = $40,176.'},
  {w:'Operating Expenses',d:'All costs of running the property EXCEPT the mortgage payment. Includes taxes, insurance, management, repairs, maintenance.',x:'Property taxes: $3,000. Insurance: $1,200. Management (10%): $4,018. Repairs/maintenance: $2,000. Total expenses: $10,218.'},
],
teach:[
  {n:1,t:'Step 1 — Gross Rental Income',x:'Start with the total rent if fully occupied all year. Research current market rents by checking Zillow rentals, Craigslist, Apartments.com, and asking local property managers. Use CURRENT market rents, not what the seller is currently charging (which may be below market). <strong>This is your income ceiling.</strong>'},
  {n:2,t:'Step 2 — Subtract Vacancy (5-10%)',x:'No property is 100% occupied 100% of the time. Budget 5-10% vacancy for the months between tenants, difficult-to-rent units, and seasonal softness. A 7% vacancy rate = approximately 25 days per year of vacancy per unit. <strong>Never assume 100% occupancy in your analysis — that\'s how investors get into trouble.</strong>'},
  {n:3,t:'Step 3 — Subtract Operating Expenses to get NOI',x:'Operating expenses include: property taxes, insurance, property management fees (typically 8-12% of rent if you hire a manager), repairs and maintenance (budget 10% of rent or 1% of property value annually), capital expense reserve (budget 5-8% of rent for big future repairs like roof, HVAC, water heater), and any utilities you pay. Subtracting expenses from effective income gives you <strong>NOI — Net Operating Income</strong>.'},
  {n:4,t:'Step 4 — Subtract Mortgage to get Cash Flow',x:'Subtract your monthly mortgage payment from NOI. What\'s left is your cash flow. <strong>Positive cash flow = the property makes money monthly.</strong> Even $100-200/month positive cash flow per unit is good — remember you\'re also building equity AND benefiting from appreciation simultaneously. Calculate cash-on-cash return: annual cash flow / total cash invested × 100. Target 8%+.'},
],
analogy:'Analyzing a rental property is like evaluating a small business for purchase. Gross revenue = total rent. Subtract the cost of goods sold (vacancy = unsold inventory). Subtract operating expenses (rent, staff, utilities). What remains is operating profit (NOI). Subtract debt payments (mortgage). What\'s left is your take-home cash flow. Would you buy a business without running these numbers first? Of course not.',
quiz:{q:'A duplex rents for $1,200/unit/month ($2,400 total). Operating expenses are $800/month. Mortgage is $1,100/month. What is the monthly cash flow and is this a good deal?',
choices:['$2,400 cash flow — that\'s the total rent received','$500 cash flow ($2,400 - $800 expenses - $1,100 mortgage) — positive cash flow, generally a solid rental investment','No cash flow — operating expenses and mortgage equal the rent','Negative $500 — the mortgage and expenses exceed the rent'],
correct:1,explain:'Cash flow = Rent ($2,400) - Operating expenses ($800) - Mortgage ($1,100) = $500/month positive cash flow. That\'s $6,000/year. <strong>Additionally, the mortgage is being paid down (equity building) and the property likely appreciates over time.</strong> $500/month on a duplex is solid — multiply that over a portfolio of 5 duplexes and you have $2,500/month in passive income.',lesson:'Cash flow = Rent minus ALL expenses including the mortgage. Positive cash flow means the property pays you monthly. Negative cash flow means you pay the property. Always run the complete numbers before buying.'}
},
{id:'3-2',title:'Tenant Management & Landlord Fundamentals',sub:'How to find great tenants, write solid leases, and manage like a professional',
terms:[
  {w:'Tenant Screening',d:'The process of evaluating rental applicants to find reliable tenants who will pay rent on time and take care of the property.',x:'Screen for: credit score (typically 620+ minimum), income (usually 3x monthly rent), rental history, background check, and employment verification.'},
  {w:'Security Deposit',d:'Money collected from a tenant before move-in to cover unpaid rent or damages beyond normal wear and tear. Returned (with any deductions) after move-out.',x:'Monthly rent = $1,200. Security deposit = $1,200-$2,400 (1-2 months rent, depending on your state).'},
  {w:'Lease Agreement',d:'A legally binding contract between landlord and tenant specifying the rent amount, lease term, rules, and responsibilities of both parties.',x:'A 12-month lease at $1,200/month that started January 1st. Tenant is legally obligated to pay through December 31st.'},
],
teach:[
  {n:1,t:'Finding quality tenants — the most important skill',x:'A great tenant pays on time, takes care of the property, and stays long-term. A bad tenant costs you: missed rent, legal fees, property damage, and months of vacancy. Screening is everything. Minimum standards: proof of income (pay stubs, tax returns — look for 3x monthly rent in gross income), credit check ($30-50, tenant can pay), background check (criminal history, eviction history), and rental references from previous landlords.'},
  {n:2,t:'The application and screening process',x:'Step 1: Create a professional rental application form. Step 2: Require ALL applicants to complete the same application (Fair Housing requires consistent screening criteria for all applicants). Step 3: Run credit and background checks through a tenant screening service (TransUnion SmartMove, RentSpree, etc.). Step 4: Call previous landlords directly — ask "Would you rent to this person again?" Step 5: Select the best-qualified applicant. <strong>Document your selection criteria and apply it consistently to avoid Fair Housing violations.</strong>'},
  {n:3,t:'The lease — your most important document',x:'A solid lease covers: rent amount and due date, late fee policy, security deposit amount and conditions for withholding, what\'s included (utilities? parking?), pet policy, maintenance responsibilities (who fixes what), entry notice requirements, renewal and termination procedures, and prohibited activities. <strong>Use a state-specific lease template from your local landlord association or an attorney — not a generic template from the internet.</strong> Lease laws vary dramatically by state.'},
  {n:4,t:'Property management companies — when to hire one',x:'A property management company handles: tenant screening, rent collection, maintenance coordination, tenant communication, and evictions. They typically charge 8-12% of monthly rent + lease-up fees. Consider hiring if: you own out-of-state property, you have multiple units, you work a demanding full-time job, or you simply don\'t want the landlord responsibilities. <strong>Management fees cost money but return your time — calculate if the trade is worth it.</strong>'},
],
analogy:'Good tenant screening is like hiring an employee. You wouldn\'t hire someone without checking references, verifying their experience (rental history), and ensuring they can perform the job (afford the rent). The screening process takes time but prevents the much more costly alternative — a bad tenant who doesn\'t pay, damages the property, and requires an expensive eviction process to remove.',
quiz:{q:'A rental applicant has a 590 credit score but provides pay stubs showing income of 4x the monthly rent and a glowing reference from their previous landlord of 5 years. Your minimum credit score is 620. What should you do?',
choices:['Automatically reject — your minimum is 620, no exceptions','Consider the full picture: low credit score (below minimum) but very strong income and excellent rental history suggest financial reliability. You can apply consistent criteria that weighs all factors, or you can require a larger security deposit and document your reasoning clearly. But if you set 620 as a hard minimum and apply it consistently to all applicants, you must apply it here too.','Approve immediately — income and references override credit score','This is a Fair Housing violation to even ask about credit score'],
correct:1,explain:'This requires judgment. Strong income and 5-year rental history are genuinely positive factors. Options: (1) If 620 is a hard consistent policy, apply it — reject with documentation. (2) If your policy considers the full picture, you can approve with higher security deposit and document your reasoning. <strong>The critical factor: whatever criteria you use must be applied consistently to ALL applicants.</strong> Inconsistent application creates Fair Housing liability.',lesson:'Tenant screening is about evaluating the full picture consistently. Set clear written criteria. Apply them the same way to every applicant. Document your decisions. Inconsistent application of screening criteria is a Fair Housing violation.'}
},
{id:'3-3',title:'Landlord Laws & Tenant Rights',sub:'What you must know legally before renting any property',
terms:[
  {w:'Eviction',d:'The legal process of removing a tenant from a property. Requires following specific legal procedures — you cannot simply change the locks.',x:'Tenant hasn\'t paid rent in 60 days. You must: serve proper written notice, file court paperwork, attend a hearing, get a judgment, and have the sheriff enforce the order. Cannot just lock them out.'},
  {w:'Habitability',d:'The legal requirement that rental properties be safe and livable. Must have: working heat, plumbing, electricity, weatherproofing, and freedom from pests.',x:'If a landlord doesn\'t fix a broken heater in winter, the tenant may legally withhold rent or terminate the lease in most states.'},
  {w:'Rent Control',d:'Local laws limiting how much a landlord can increase rent. Exists in some cities (New York, San Francisco, Los Angeles) but not most US markets.',x:'San Francisco rent control: landlord can only raise rent by a small percentage each year for existing tenants, regardless of market rates.'},
],
teach:[
  {n:1,t:'The landlord\'s legal obligations',x:'As a landlord, you are legally required to: maintain the property in habitable condition (working heat, plumbing, electricity, no structural hazards), make repairs within a reasonable timeframe, provide proper notice before entering (typically 24-48 hours, varies by state), return the security deposit with an itemized deduction list within a specific timeframe (14-45 days depending on state), and comply with all local housing codes.'},
  {n:2,t:'The eviction process — never skip a step',x:'Never try to force a tenant out illegally — changing locks, removing doors, shutting off utilities. This is called "self-help eviction" and is illegal in all 50 states. The legal eviction process: (1) Serve written notice (pay or quit, cure or quit, or unconditional quit — type depends on the violation). (2) If tenant doesn\'t comply, file eviction lawsuit (unlawful detainer) with local court. (3) Attend hearing. (4) If you win, sheriff enforces the order. The process takes 30-90+ days in most states.'},
  {n:3,t:'Fair Housing — what you cannot do',x:'The Fair Housing Act (1968) prohibits discrimination in housing based on: Race, Color, Religion, National Origin, Sex, Familial Status, and Disability. You cannot: refuse to rent, set different terms, or advertise in ways that discriminate based on these protected classes. Additional protected classes vary by state (age, sexual orientation, source of income, etc.). <strong>Fair Housing violations can result in massive fines and lawsuits.</strong>'},
  {n:4,t:'Security deposit rules',x:'Security deposit laws vary by state. Generally: maximum amount (typically 1-2 months rent), must be held in a separate account in many states, must return within a set timeframe after move-out (14-45 days by state), must provide itemized list of any deductions, cannot deduct for normal wear and tear (only damage beyond normal use). <strong>Failing to follow security deposit laws can result in double or triple damages to the tenant.</strong>'},
],
analogy:'Landlord-tenant law is like the rules of a formal partnership. Both sides have rights and obligations. The landlord must provide a safe, livable space and honor the lease. The tenant must pay rent on time and not damage the property. When either side breaks the rules, there\'s a formal process to resolve it — not a lawless confrontation. Skip the process and the law will rule against you, even if you\'re "right."',
quiz:{q:'Your tenant hasn\'t paid rent for 45 days. You go to the property, change the locks, and remove their belongings to force them out. What are the legal consequences?',
choices:['This is legal if the tenant has violated the lease','This is illegal self-help eviction in all 50 states. You can face: liability for tenant\'s property, damages equal to months of rent, legal fees, and the tenant being legally allowed to return to the property.','You can do this after 30 days of non-payment','This is only legal if you gave written notice first'],
correct:1,explain:'Self-help eviction — changing locks, removing belongings, shutting off utilities — is illegal in every US state regardless of how long the tenant hasn\'t paid. <strong>The tenant can sue you, get a court order allowing them back in, AND collect significant damages from you.</strong> The only legal path is the formal eviction process through the courts — even if it takes 60-90 days.',lesson:'Never attempt to force a tenant out outside of the legal eviction process. It always backfires legally and financially. Follow the legal process: proper notice → court filing → hearing → sheriff enforcement.'}
},
{id:'3-4',title:'Level 3 Complete — Rental Mastery',sub:'You now understand rental investing from end to end',
terms:[],
teach:[
  {n:1,t:'What you\'ve mastered in Level 3',x:'✅ Full rental property analysis — gross income → vacancy → expenses → NOI → mortgage → cash flow\n✅ Cash-on-cash return — measuring return on actual cash invested\n✅ Tenant screening — the complete process applied consistently\n✅ Lease fundamentals — what must be included and why\n✅ Property management — when to self-manage vs hire\n✅ Landlord legal obligations — habitability, Fair Housing, security deposits\n✅ Eviction process — the legal steps, never skip them\n✅ Rent control basics — where it exists and how it affects landlords'},
  {n:2,t:'The most important Level 3 lesson',x:'<strong>Cash flow analysis is not optional — it is mandatory before every purchase.</strong> Run the complete numbers: gross income, vacancy, ALL operating expenses, NOI, mortgage, final cash flow, and cash-on-cash return. A property that looks profitable on the surface can be a cash drain when you include all realistic expenses. The spreadsheet doesn\'t lie.'},
  {n:3,t:'What Level 4 brings',x:'Level 4 is house flipping — buying distressed properties, renovating them, and selling for profit. You\'ll learn the 70% rule (fully explained before any question uses it), ARV analysis, managing renovations, and calculating real profit.'},
],
analogy:'You now understand how to operate a rental business. You can find properties, analyze them mathematically, find and screen tenants, write leases, manage legally, and build cash flowing income. Level 4 adds a completely different strategy — short-term property transformation for immediate profit.',
quiz:{q:'A rental property\'s gross annual income is $24,000. Vacancy is 8%. Operating expenses are $7,500/year. Annual mortgage is $11,400. What is the annual cash flow?',
choices:['$24,000 — the full rent collected','$5,100 — ($24,000 - $1,920 vacancy - $7,500 expenses - $11,400 mortgage)','$16,500 — rent minus operating expenses only','Negative — this property doesn\'t cash flow'],
correct:1,explain:'Step by step: $24,000 gross - $1,920 vacancy (8%) = $22,080 effective income. $22,080 - $7,500 expenses = $14,580 NOI. $14,580 - $11,400 mortgage = <strong>$3,180 annual cash flow ($265/month).</strong> This property cash flows positively — the tenant\'s rent covers all expenses AND the mortgage with money left over.',lesson:'Congratulations on completing Level 3. You can now analyze any rental property from scratch. Level 4 teaches the completely different strategy of buying, fixing, and selling for profit.'}
},
]},
{num:4,title:'House Flipping',desc:'Buy distressed, renovate, sell for profit — the complete flipping system',
lessons:[
{id:'4-1',title:'House Flipping Fundamentals — The 70% Rule Explained From Zero',sub:'What flipping is, how profit works, and the formula that protects you every time',
terms:[
  {w:'House Flip',d:'Buying a distressed or undervalued property, renovating it, and selling it for a profit — all within a short timeframe (typically 3-9 months).',x:'Buy a rundown house for $90,000. Spend $40,000 fixing it up. Sell for $175,000. Profit = $175,000 - $90,000 - $40,000 - other costs = approximately $30,000-$35,000.'},
  {w:'ARV (After Repair Value)',d:'What the property will be worth AFTER all renovations are complete. This is the most important number in any flip.',x:'Research recently sold fully renovated similar homes in the same neighborhood. Average of those sales = your ARV estimate.'},
  {w:'The 70% Rule',d:'A formula: never pay more than 70% of the ARV minus your estimated repair costs. Protects your profit margin and buffers for unexpected costs.',x:'ARV = $200,000. Repairs = $40,000. Maximum purchase price = ($200,000 × 70%) - $40,000 = $140,000 - $40,000 = $100,000.'},
],
teach:[
  {n:1,t:'What house flipping actually is',x:'Flipping is buying a property below market value (usually because it needs significant repairs or the seller needs a fast sale), renovating it to bring it to market standards, and selling it for a profit. The profit comes from three sources: (1) Buying below market value, (2) Adding value through renovations, (3) Selling at full market value. <strong>You make money when you BUY at the right price — not when you sell.</strong>'},
  {n:2,t:'The ARV — your most important number',x:'Before you can apply the 70% rule, you must determine the ARV (After Repair Value) — what the property will sell for after renovations. To find ARV: research comparable sales of fully renovated, similar homes (same bedroom/bath count, similar square footage, same neighborhood) that sold within the last 3-6 months. Average those sales prices. That average is your ARV. Be conservative — if comps range $180K-$210K, use $185K, not $210K.'},
  {n:3,t:'The 70% Rule — the formula that protects your profit',x:'The 70% Rule formula: Maximum Purchase Price = (ARV × 70%) - Repair Costs.\n\nARV = $200,000.\n70% of $200,000 = $140,000.\nRepair estimate = $40,000.\nMaximum purchase price = $140,000 - $40,000 = $100,000.\n\nWhy 70%? The remaining 30% covers: your profit (typically 10-15%), selling costs including agent commission (5-8%), holding costs during renovation (mortgage, taxes, insurance, utilities), and a buffer for unexpected costs. <strong>The 70% Rule builds your profit into the buying price — never negotiate with the formula, only negotiate with the seller.</strong>'},
  {n:4,t:'Where to find flip deals',x:'Distressed properties below market value are found through: foreclosures (bank-owned REO properties, short sales), probate sales (inherited homes where heirs want to sell quickly), tired landlords (small landlords who are done managing property), direct mail campaigns to absentee owners, driving for dollars (spotting neglected properties and contacting owners), and wholesalers (investors who find deals and sell the contract to flippers). <strong>The best flippers spend more time finding deals than doing anything else.</strong>'},
],
analogy:'The 70% Rule is like a car mechanic\'s rule for buying used cars to resell. If a restored classic car sells for $50,000 (ARV), and restoration costs $10,000 (repairs), the mechanic should never pay more than ($50,000 × 70%) - $10,000 = $25,000 for the unrestored car. This leaves room for profit, unexpected problems, and the costs of selling the finished car. The formula is the same — only the product changes.',
quiz:{q:'Before using the 70% rule, you need to determine the ARV. A house you\'re considering flipping is a 3-bed/2-bath, 1,400 sq ft in the Oakwood neighborhood. You find these recent sales of similar renovated homes nearby: $178,000, $192,000, $185,000, $187,000. What is your conservative ARV estimate?',
choices:['$192,000 — use the highest comp to maximize potential profit','$185,500 — average of all 4 comps ($742,000 / 4)','$183,000-$185,000 — use a conservative estimate below the average to protect yourself from market fluctuations','$178,000 — always use the lowest comp to be maximally safe'],
correct:2,explain:'The average of the 4 comps is $185,500. For a conservative ARV, use slightly below the average — around $183,000-$185,000. This protects you if the market softens slightly or if your renovations don\'t quite reach the top tier of the market. <strong>Conservative ARV estimates protect your profit. Aggressive ARV estimates eliminate it.</strong>',lesson:'Always be conservative with ARV. Use recent sales (within 6 months) of truly similar homes in the same neighborhood. When in doubt, use the lower end of the range. An overestimated ARV is the most common reason flips lose money.'}
},
{id:'4-2',title:'Renovation Management & Cost Estimation',sub:'How to estimate repairs accurately and manage contractors like a professional',
terms:[
  {w:'Scope of Work',d:'A detailed written document listing every renovation task to be done, the materials to be used, and the expected cost. Given to contractors to get accurate bids.',x:'Scope of work: "Kitchen renovation — remove existing cabinets, install 20 linear feet of new cabinets (mid-grade), granite countertops, new sink and faucet, tile backsplash, paint walls, install new lighting."'},
  {w:'General Contractor (GC)',d:'A licensed professional who manages the entire renovation project — hiring and coordinating all subcontractors, purchasing materials, and ensuring quality.',x:'A GC handles your plumber, electrician, tile guy, and painter — you deal with one person instead of six.'},
  {w:'Holding Costs',d:'The ongoing expenses of owning a property while renovating it — mortgage/loan interest, property taxes, insurance, and utilities during the renovation period.',x:'Flip takes 5 months. Monthly holding costs: $1,500 loan interest + $250 taxes + $100 insurance + $150 utilities = $2,000/month × 5 months = $10,000 holding costs.'},
],
teach:[
  {n:1,t:'Estimating repair costs — before and after buying',x:'Accurate repair estimation is the most important skill in flipping. Two phases: (1) <strong>Pre-offer estimate</strong> — quick walkthrough estimate using cost-per-item knowledge or a contractor friend. Used to determine your offer. (2) <strong>Pre-close detailed estimate</strong> — during due diligence, get 2-3 contractor bids for every major item. Use this detailed estimate to confirm your deal still works. <strong>Always add 15-20% contingency to your best estimate — surprises happen in every renovation.</strong>'},
  {n:2,t:'Common renovation costs to know',x:'Approximate costs (vary by market and year): Kitchen full renovation: $15,000-$50,000. Bathroom full renovation: $8,000-$20,000. New roof: $8,000-$20,000. HVAC system: $5,000-$12,000. New electrical panel: $2,000-$5,000. New flooring throughout (1,500 sq ft): $5,000-$15,000. Fresh paint interior (1,500 sq ft): $2,000-$5,000. Landscaping/curb appeal: $1,000-$5,000. <strong>Know these ranges cold — they\'ll tell you quickly if a deal has potential.</strong>'},
  {n:3,t:'Managing contractors effectively',x:'Rules for working with contractors: (1) Get at least 3 bids for every major job. (2) Never pay more than 10-20% upfront — pay in draws tied to completed milestones. (3) Always have a written contract with scope, timeline, and payment schedule. (4) Check licenses and insurance before hiring. (5) Visit the site daily to monitor progress and catch problems early. (6) Never pay for work not yet completed — you lose all leverage if you pay early.'},
  {n:4,t:'Timeline management — every day costs money',x:'Holding costs are real and relentless. Every extra week of renovation = more interest on your hard money loan, more taxes, more insurance, more utilities. Create a project timeline before renovation begins: Week 1-2 = demo and rough work (plumbing, electrical). Week 3-6 = drywall, flooring, cabinets. Week 7-8 = finishes (paint, fixtures, appliances). Week 9-10 = punch list and staging. <strong>A 10-week flip costing $2,000/week in holding costs = $20,000. Delays to 15 weeks = $30,000 — $10,000 gone to holding costs alone.</strong>'},
],
analogy:'Managing a renovation is like being a film director. You have a script (scope of work), a budget, a schedule, and a team of specialists (contractors). Your job is not to do every job yourself — it\'s to coordinate, supervise, make decisions, and keep everything on schedule and on budget. A director who tries to also be the camera operator, sound engineer, and actor simultaneously produces a disaster. Hire the right specialists and manage them well.',
quiz:{q:'Your scope of work estimates total renovation costs at $45,000. Following best practices, what should your actual renovation budget be?',
choices:['$45,000 — the estimate is the budget','$36,000 — reduce it by 20% for negotiation room','$51,750-$54,000 — add a 15-20% contingency buffer to cover inevitable surprises','$90,000 — double it just to be safe'],
correct:2,explain:'Always add 15-20% contingency to renovation estimates. Surprises happen in every renovation: hidden water damage, asbestos discovered during demo, subcontractor delays requiring a different crew, code violations uncovered during inspection. $45,000 × 15-20% = $6,750-$9,000 contingency. Budget $51,750-$54,000. <strong>If surprises don\'t happen (rare), you keep the contingency as extra profit.</strong>',lesson:'Never budget exactly what your estimate says. Add 15-20% contingency to every renovation budget. The surprises that kill flip profits are almost always the surprises that weren\'t budgeted for.'}
},
{id:'4-3',title:'Calculating Flip Profit — The Complete Formula',sub:'The exact math behind a house flip from purchase to sale',
terms:[
  {w:'Selling Costs',d:'The expenses of selling a property — real estate agent commissions (typically 5-6% of sale price), closing costs, and staging.',x:'Sell for $200,000. Agent commission (6%) = $12,000. Closing costs = $2,000. Total selling costs ≈ $14,000.'},
  {w:'Return on Investment (ROI)',d:'Net profit divided by total cash invested, expressed as a percentage.',x:'Made $30,000 profit on a flip. Invested $70,000 total cash. ROI = $30,000 / $70,000 = 42.8%.'},
],
teach:[
  {n:1,t:'The complete flip profit formula',x:'Net Profit = Sale Price - Purchase Price - Renovation Costs - Holding Costs - Selling Costs\n\nExample:\nSale price (ARV achieved): $200,000\nMinus purchase price: -$100,000\nMinus renovation costs: -$45,000\nMinus holding costs (5 months × $2,200): -$11,000\nMinus selling costs (7%): -$14,000\nNet Profit = $30,000\n\n<strong>This is why the 70% rule matters — every cost beyond renovation must still fit inside your margin.</strong>'},
  {n:2,t:'What eats your profit if you\'re not careful',x:'The silent profit killers in flipping: (1) Overestimated ARV — if you thought you\'d sell for $200K and only get $185K, that\'s $15K gone. (2) Underestimated repairs — if your $45K budget becomes $62K, that\'s $17K gone. (3) Extended timeline — extra 2 months of holding costs = $4,400 gone. (4) Unexpected issues — code violations, hidden damage, permit delays. Add all four together and a projected $30K profit can become a loss.'},
  {n:3,t:'Evaluating a flip before making an offer',x:'Before making any offer: (1) Determine ARV conservatively using comps. (2) Apply 70% rule to get maximum purchase price. (3) Estimate repairs (get contractor walkthrough if possible). (4) Calculate holding costs (loan rate × expected months). (5) Calculate selling costs (6-7% of ARV). (6) Subtract everything from ARV. If profit meets your minimum threshold (typically $25,000-$40,000 minimum), make an offer AT or below the 70% rule maximum.'},
  {n:4,t:'When to walk away from a flip',x:'Walk away if: (1) The seller won\'t come to a price that meets the 70% rule. (2) Hidden problems discovered in inspection dramatically change the repair estimate. (3) Comparable sales are declining (market softening). (4) The property has title issues that would delay closing. (5) Your gut says something is wrong but you can\'t quantify it. <strong>The best deal you ever make might be the one you walk away from.</strong>'},
],
analogy:'Calculating flip profit is like totaling a restaurant\'s profit. Revenue = sale price. Cost of goods = purchase price. Labor = renovation costs. Rent during renovation = holding costs. Marketing = selling costs. Everything in between is your profit — or loss. Just like a restaurant that sells $10,000 in food but has $11,000 in costs is losing money, a flip that sells for $200K but costs $205K is a loss. Run the full numbers every time.',
quiz:{q:'Using the 70% rule: ARV = $220,000. Repairs = $35,000. What is the maximum purchase price? And if you bought at that maximum, renovated at budget, and sold at $220,000 with 7% selling costs, approximately how much profit would you make?',
choices:['Maximum price = $119,000. Profit would be nearly $0 — selling costs eat everything','Maximum price = $119,000. Approximate profit = $15,400-$20,000 after all costs','Maximum price = $154,000 (just 70% of ARV without subtracting repairs). Profit = $66,000','Maximum price = $100,000. Profit = $85,000'],
correct:1,explain:'70% Rule: ($220,000 × 70%) - $35,000 = $154,000 - $35,000 = $119,000 maximum purchase price. Profit calculation: $220,000 sale - $119,000 purchase - $35,000 repairs - $15,400 selling costs (7%) - ~$10,000 holding costs = <strong>approximately $40,600 profit.</strong> The 70% rule built in that profit plus a buffer for unexpected costs.',lesson:'The 70% Rule builds your profit and cost buffer into the maximum purchase price. If you buy at or below that maximum and control your renovation budget and timeline, profit is built into the deal from day one.'}
},
{id:'4-4',title:'Level 4 Complete — Flipping Mastery',sub:'You now understand house flipping end to end',
terms:[],
teach:[
  {n:1,t:'What you\'ve mastered in Level 4',x:'✅ What house flipping is — buy distressed, renovate, sell for profit\n✅ ARV — how to determine after repair value using comparable sales\n✅ The 70% Rule — explained completely, formula memorized: (ARV × 70%) - Repairs = Max Purchase Price\n✅ Finding deals — foreclosures, probate, direct mail, wholesalers\n✅ Renovation management — accurate estimation, contractor management, contingency budgeting\n✅ Holding costs — the silent profit killer\n✅ Complete profit formula — sale price minus every cost\n✅ When to walk away — discipline is more profitable than greed'},
  {n:2,t:'The single most important flipping lesson',x:'<strong>You make your money when you BUY, not when you sell.</strong> The 70% rule exists to build your profit into the purchase price. If you overpay because you fell in love with the property or became competitive against other buyers, no amount of renovation or luck can fix a bad purchase price. Discipline at the buying stage is the foundation of profitable flipping.'},
  {n:3,t:'What Level 5 brings',x:'Level 5 moves into commercial real estate — bigger properties, different rules, different financing, and different analysis. NNN leases, cap rates, and how to value commercial property by income rather than comparable sales.'},
],
analogy:'You\'ve learned to manufacture products profitably. Buy raw materials (distressed property) at the right price, add value through production (renovation), sell the finished product at full market value. The profit formula is the same as any manufacturing business — and the same discipline applies.',
quiz:{q:'A seller wants $130,000 for a property. ARV = $190,000. Repair estimate = $35,000. Does this deal meet the 70% rule and should you make an offer?',
choices:['Yes — $130,000 is less than ARV so it\'s a good deal','No — 70% Rule: ($190,000 × 70%) - $35,000 = $133,000 - $35,000 = $98,000 maximum price. Seller wants $130,000 which is $32,000 above maximum. This deal does not work at this price.','Yes — if you negotiate hard enough you can make any deal work','The 70% rule only applies to properties over $200,000'],
correct:1,explain:'Maximum purchase price = ($190,000 × 70%) - $35,000 = $133,000 - $35,000 = $98,000. The seller wants $130,000 — $32,000 more than your maximum. At $130,000, after repairs ($35K), holding ($10K), and selling costs ($13.3K), you\'d lose money or barely break even. <strong>Counter at $98,000 and be willing to walk away if they won\'t negotiate meaningfully.</strong>',lesson:'Congratulations on completing Level 4. The 70% Rule is now part of your analysis toolkit. Apply it to every potential flip — without exception. Level 5 opens the door to commercial real estate.'}
},
]},
];
const CURRICULUM_MARKET = [
{num:1,title:'The Stock Market — Starting From Absolute Zero',desc:'What the stock market is, how it works, and why it matters for your financial future. No experience needed.',
lessons:[
{id:'1-1',title:'What Is the Stock Market? — The Simplest Explanation',sub:'Understanding what stocks are and why they exist before anything else',
terms:[
  {w:'Company',d:'A business that sells products or services to make money. Apple sells iPhones. McDonald\'s sells burgers. Netflix sells streaming.',x:'Every company you have ever bought something from is a business trying to make money.'},
  {w:'Stock',d:'A tiny piece of ownership in a company. When a company wants to raise money to grow they sell pieces of themselves to the public.',x:'Apple has about 15 billion shares of stock. If you own 1 share you own 1 fifteen-billionth of Apple. Small piece but real ownership.'},
  {w:'Stock Market',d:'The place where people buy and sell shares of companies. Like a marketplace but instead of physical items people trade ownership in businesses.',x:'The New York Stock Exchange and NASDAQ are the two main US stock markets. They are open Monday through Friday 9:30am to 4pm Eastern Time.'},
],
teach:[
  {n:1,t:'Why companies sell stock in the first place',x:'Imagine you have a lemonade stand that makes $500 a week. You want to open 10 more stands across the city but you need $50,000 to do it. You do not have $50,000. What do you do? You could get a loan from the bank and pay it back with interest. Or you could sell pieces of your lemonade business to 50 friends at $1,000 each. Now you have your $50,000. Your friends each own a small piece of your business. If the business grows and makes more money their piece becomes worth more. That is exactly what companies do when they go public and sell stock.'},
  {n:2,t:'What you actually own when you buy a stock',x:'When you buy a share of Apple you are not just buying a piece of paper or a number on a screen. You are buying real ownership in a real company. You own a fraction of their buildings their patents their products and their future profits. As a shareholder you have the right to vote on important company decisions. You may receive a dividend which is a portion of the company profits paid directly to shareholders. Your ownership goes up in value when the company grows and becomes more valuable. Your ownership falls in value if the company struggles.'},
  {n:3,t:'How the stock price goes up and down',x:'Stock prices change based on supply and demand. If more people want to buy a stock than sell it the price goes up because buyers are competing for limited shares. If more people want to sell a stock than buy it the price goes down because sellers have to lower the price to attract buyers. Why do more people want to buy? Usually because the company reported strong earnings or released a popular new product or announced good news. Why do more people want to sell? Usually because of bad news disappointing results or fear about the economy. The price at any moment is simply whatever the last buyer and seller agreed to trade at.'},
  {n:4,t:'The two ways you make money in stocks',x:'There are only two ways to make money owning stocks. The first is called capital gains. You buy a stock at $50. It rises to $80. You sell it. You made $30 per share in capital gains. That profit is yours. The second way is dividends. Some companies share a portion of their profits directly with shareholders on a regular schedule. If you own 100 shares of a company that pays a $2 dividend per share per year you receive $200 per year just for owning the stock. Many large established companies pay dividends. Younger growth companies usually do not because they reinvest all profits back into growing the business.'},
  {n:5,t:'Why the stock market exists and why you should care',x:'The stock market exists to connect companies that need money to grow with investors who have money and want it to grow. It is the engine of wealth creation in modern economies. Here is why this matters for you personally. Money sitting in a regular savings account at a bank grows at about 0.5% per year. The stock market has historically grown at about 10% per year on average over long periods. $10,000 at 0.5% for 30 years becomes $11,614. The same $10,000 at 10% for 30 years becomes $174,494. The difference between being broke in retirement and being comfortable in retirement is usually just whether or not you participated in the stock market.'},
  {n:6,t:'The risk side — what can go wrong',x:'Stocks can also go down. Companies can fail. Markets can crash. In 2008 the stock market dropped nearly 50% in one year. People who panicked and sold lost half their money permanently. People who stayed invested recovered everything and more within a few years. The stock market always has risk. The risk is lower over long periods of time because economies tend to grow. The risk is higher over short periods because anything can happen in a year. Understanding and managing risk is one of the most important skills this academy will teach you.'},
],
analogy:'The stock market is like buying into a partnership with a business. When you and your friends pool money to start a restaurant together each person owns a percentage based on how much they invested. If the restaurant does well everyone profits proportionally. If it struggles everyone shares the losses. The stock market just lets you do this with the biggest most successful companies in the world instead of a local restaurant.',
quiz:{q:'You buy 100 shares of a company at $20 per share. The company reports record profits and the stock rises to $35 per share. You sell all 100 shares. How much profit did you make and what is this type of gain called?',choices:['$1,500 profit called a dividend','$3,500 profit called capital gains','$1,500 profit called capital gains — you bought at $20 and sold at $35 making $15 per share on 100 shares','$2,000 profit called a stock split'],correct:2,explain:'You paid $20 per share times 100 shares equals $2,000 total invested. You sold at $35 per share times 100 shares equals $3,500. The profit is $3,500 minus $2,000 equals $1,500. This profit from selling a stock for more than you paid is called a capital gain.',lesson:'Capital gains are profits from selling a stock at a higher price than you paid. Dividends are regular payments from company profits. These are the two ways stocks make you money.'}
},
{id:'1-2',title:'How to Read a Stock Chart — Step by Step',sub:'Understanding what you are looking at before you try to use it',
terms:[
  {w:'Price Chart',d:'A visual display that shows how the price of a stock has moved over time. The most important tool any trader or investor uses.',x:'A stock chart shows you everything — where the price started, where it went, how fast it moved, and where it is now.'},
  {w:'Time Frame',d:'The period of time each candle or bar on a chart represents. A 5 minute chart shows each candle as 5 minutes of trading. A daily chart shows each candle as one full trading day.',x:'Day traders usually look at 1 minute 5 minute and 15 minute charts. Investors usually look at daily weekly and monthly charts.'},
  {w:'Candlestick',d:'The individual bars on a chart. Each one shows four pieces of information — where the price opened, where it closed, the highest point it reached, and the lowest point it reached during that time period.',x:'Green candle: price ended higher than it started. Good for buyers. Red candle: price ended lower than it started. Bad for buyers but good for sellers.'},
],
teach:[
  {n:1,t:'The two axes of a chart — what they mean',x:'Every price chart has two axes. The vertical axis going up and down on the left or right side shows the price. Higher on the chart means higher price. Lower on the chart means lower price. The horizontal axis going left and right across the bottom shows time. Moving left goes back in time. Moving right comes closer to the present. The most recent price action is always on the far right side of the chart. When you look at a chart you are looking at the history of how price moved over time.'},
  {n:2,t:'Reading a single candlestick',x:'A candlestick has two parts. The body and the wicks. The body is the thick rectangle in the middle. It shows where the price opened and where it closed during that time period. A green body means the price closed higher than it opened. Buyers won. A red body means the price closed lower than it opened. Sellers won. The wicks are the thin lines sticking out above and below the body. The top wick shows the highest price reached during that period even if the candle closed lower. The bottom wick shows the lowest price reached even if the candle bounced back higher. A long wick below a candle body often means buyers stepped in strongly at a low price.'},
  {n:3,t:'Patterns that candles form together',x:'Individual candles are informative but patterns of multiple candles together tell bigger stories. A series of green candles moving higher shows buying momentum. A series of red candles moving lower shows selling pressure. When you see a big green candle after a series of red candles that could signal that buyers are taking control back. When you see a big red candle after a series of green candles that could signal sellers are gaining control. You do not need to memorize dozens of patterns. Understanding what buyers and sellers are doing based on the candles is more valuable than memorizing pattern names.'},
  {n:4,t:'Why volume matters alongside price',x:'Volume tells you how many shares were traded during a time period. High volume means many people were interested and participating. Low volume means few people were involved. Here is why this matters. A price move on high volume is strong and trustworthy because many people were part of it. A price move on low volume is weak and suspicious because not many people participated and it can easily reverse. Think of it this way. If 10 people say a movie is great that is interesting. If 10,000 people say a movie is great that is convincing. Volume is the number of people confirming a price move.'},
  {n:5,t:'The trend — the most important thing on any chart',x:'A trend is the general direction a stock price is moving over time. There are three possible trends. An uptrend is when the price makes higher highs and higher lows over time. Each peak is higher than the last peak. Each valley is higher than the last valley. A downtrend is when the price makes lower highs and lower lows. Each peak is lower than the last peak. Each valley is lower than the last valley. A sideways trend is when the price moves back and forth between the same two levels without making new highs or new lows. The most important rule in trading is this: the trend is your friend. Trade in the direction of the trend not against it.'},
  {n:6,t:'How to start reading charts right now',x:'The best way to learn charts is to look at them every day. Go to finance.yahoo.com or TradingView.com both are free. Type in any stock symbol like AAPL for Apple or TSLA for Tesla. Look at the chart. Try to identify the trend. Is it going up, down, or sideways? Look at where the price has bounced before. Look at the volume bars at the bottom and notice when they are higher. You do not need to understand everything immediately. Reading charts is a skill that develops over time through consistent observation.'},
],
analogy:'Reading a stock chart is like reading a map of where someone has been. The map does not tell you exactly where they will go next but it shows you the path they have taken, the direction they have been moving, whether they have been speeding up or slowing down, and the areas they have visited multiple times. The more you study the map the better your predictions about where they might go next.',
quiz:{q:'You look at a stock chart and see 5 green candles in a row each closing higher than the last. Then you see one large red candle that is bigger than all 5 green candles. What does this pattern tell you?',choices:['The stock is definitely going to keep going up','Nothing important. Single candles do not matter.','The sellers may be taking control. Five green candles showed buying momentum but one large red candle erasing multiple green candles suggests sellers came in strongly. This is a warning sign to pay attention to.','The stock has broken out to new highs'],correct:2,explain:'Five consecutive green candles show buying momentum. But a single large red candle that wipes out multiple green candles is a significant warning. It shows that sellers came in with force and were able to push the price down substantially. This pattern suggests the upward momentum may be slowing or reversing.',lesson:'One large red candle after multiple green candles is a warning sign. It does not guarantee reversal but it tells you sellers showed up with force. Always pay attention to the size and direction of candles relative to what came before.'}
},
{id:'1-3',title:'Support and Resistance — The Foundation of All Technical Analysis',sub:'The two most important concepts in all of trading explained from the beginning',
terms:[
