  /* ============ TOKENS ============ */
  :root{
    --canvas:#F7F9F4; --surface:#FFFFFF; --surface-2:#F1F4EE;
    --ink:#16212B; --ink-muted:#5B6B70; --ink-faint:#94A19B;
    --line:#E1E7DE; --line-strong:#C9D2C4;
    --brand:#F0A202; --brand-deep:#B97900; --brand-soft:#FCE8BC; --brand-ink:#5C3B00;
    --realestate:#B04A24; --realestate-soft:#F3DED2;
    --finance:#146B49; --finance-soft:#D3E9DF;
    --auto:#2E5C7A; --auto-soft:#DCE6EC;
    --bar:#5B3E6B; --bar-soft:#E7DEEA;
    --success:#2F9E58; --success-soft:#DFF1E4;
    --danger:#C6432F; --danger-soft:#FBE0DD;
    --shadow-sm:0 1px 2px rgba(22,33,43,.07);
    --shadow-md:0 10px 28px -14px rgba(22,33,43,.28), 0 2px 6px rgba(22,33,43,.06);
    --radius-s:7px; --radius-m:12px;
    --font-display:'Big Shoulders', 'Arial Narrow', sans-serif;
    --font-body:'Karla', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'SF Mono', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --canvas:#10161A; --surface:#181F26; --surface-2:#1E2830;
      --ink:#EDF2EF; --ink-muted:#9FB2AC; --ink-faint:#5B6D67;
      --line:#28343A; --line-strong:#39474E;
      --brand:#F5B23A; --brand-deep:#FFCE73; --brand-soft:#3A2C10; --brand-ink:#FFE3A8;
      --realestate:#E38058; --realestate-soft:#3A2419;
      --finance:#49C393; --finance-soft:#12332A;
      --auto:#79ABCE; --auto-soft:#1C2E3A;
      --bar:#B79BC4; --bar-soft:#2C2233;
      --success:#54CB8F; --success-soft:#123324;
      --danger:#F0897C; --danger-soft:#3B1B18;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 16px 32px -16px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#10161A; --surface:#181F26; --surface-2:#1E2830;
    --ink:#EDF2EF; --ink-muted:#9FB2AC; --ink-faint:#5B6D67;
    --line:#28343A; --line-strong:#39474E;
    --brand:#F5B23A; --brand-deep:#FFCE73; --brand-soft:#3A2C10; --brand-ink:#FFE3A8;
    --realestate:#E38058; --realestate-soft:#3A2419;
    --finance:#49C393; --finance-soft:#12332A;
    --auto:#79ABCE; --auto-soft:#1C2E3A;
    --bar:#B79BC4; --bar-soft:#2C2233;
    --success:#54CB8F; --success-soft:#123324;
    --danger:#F0897C; --danger-soft:#3B1B18;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 16px 32px -16px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --canvas:#F7F9F4; --surface:#FFFFFF; --surface-2:#F1F4EE;
    --ink:#16212B; --ink-muted:#5B6B70; --ink-faint:#94A19B;
    --line:#E1E7DE; --line-strong:#C9D2C4;
    --brand:#F0A202; --brand-deep:#B97900; --brand-soft:#FCE8BC; --brand-ink:#5C3B00;
    --realestate:#B04A24; --realestate-soft:#F3DED2;
    --finance:#146B49; --finance-soft:#D3E9DF;
    --auto:#2E5C7A; --auto-soft:#DCE6EC;
    --bar:#5B3E6B; --bar-soft:#E7DEEA;
    --success:#2F9E58; --success-soft:#DFF1E4;
    --danger:#C6432F; --danger-soft:#FBE0DD;
    --shadow-sm:0 1px 2px rgba(22,33,43,.07);
    --shadow-md:0 10px 28px -14px rgba(22,33,43,.28), 0 2px 6px rgba(22,33,43,.06);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:700;text-wrap:balance;}
  p{margin:0;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--brand-soft);color:var(--brand-ink);}
  :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  .shell{min-height:100vh;display:flex;flex-direction:column;}
  .topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line);}
  .wordmark{display:flex;align-items:baseline;gap:2px;font-family:var(--font-display);font-weight:800;font-size:1.5rem;letter-spacing:.01em;white-space:nowrap;cursor:pointer;}
  .wordmark .app{color:var(--ink);}
  .wordmark .academy{color:var(--brand-deep);}
  .wordmark-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;margin-right:8px;flex:none;}
  .wordmark-mark svg{width:16px;height:16px;display:block;}
  .crumb{color:var(--ink-faint);font-size:.9rem;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;}
  .crumb .sep{opacity:.6;}
  .crumb .cur{color:var(--ink-muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-stat{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-muted);padding:6px 10px;border-radius:8px;flex:none;}
  .nav-stat .num{font-size:.95rem;font-weight:600;color:var(--ink);}
  .nav-stat svg{width:15px;height:15px;flex:none;}
  .streak svg{color:var(--brand);}
  .xp svg{color:var(--finance);}
  .theme-toggle{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-muted);flex:none;}
  .theme-toggle:hover{color:var(--ink);border-color:var(--line-strong);}
  .theme-toggle svg{width:16px;height:16px;}
  .avatar{width:34px;height:34px;border-radius:9px;flex:none;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:.95rem;}

  main{flex:1;}
  .screen{display:none;}
  .screen.active{display:block;animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .wrap{max-width:1120px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 80px;}

  .dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap;}

<script>

const LESSONS_BAR = [
// ── CONTRACTS (0-4) ─────────────────────────────────────────────────
{id:0,subject:'Contracts',level:1,title:'Contract Formation',icon:'🤝',
 eyebrow:'Year 1 · Contracts · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is a contract?',body:'A contract is a legally enforceable promise. If you make a deal and break it, the law makes you pay. Contracts are everywhere — buying a car, hiring a painter, signing a lease, taking a job. The law treats a broken promise the same as a wrong done to you.'},
  {type:'illus',emoji:'🧍 💬 🤝 💵 ✅',caption:'Someone makes an offer → Other person accepts → Both sides give something → Legally binding deal'},
  {type:'concept',label:'The 4 elements every contract needs',body:'1. OFFER — a clear, definite proposal: "I will sell you my car for $5,000"\n2. ACCEPTANCE — agreeing to the exact terms: "Deal"\n3. CONSIDERATION — both sides must give something of value (money, work, a promise, giving up a right)\n4. CAPACITY — both people must be legal adults (18+) with a clear mind. Minors and intoxicated persons lack capacity.'},
  {type:'rule',label:'The Mirror Image Rule',body:'Acceptance must match the offer exactly. Any change — even a small one — is a COUNTEROFFER, not acceptance. A counteroffer kills the original offer. The original offeror can accept the counteroffer or walk away, but the original deal is dead.'},
  {type:'example',label:'Example',body:'Paula offers to sell her laptop for $800. Dan says "I\'ll take it for $700." That\'s a counteroffer — Paula\'s $800 offer is now legally dead. Dan cannot then say "fine, I\'ll pay $800" and force Paula to sell. She would have to make a new offer.'},
  {type:'trap',label:'Bar Exam Trap',body:'"Meeting of the minds" — both parties must intend to contract on the same terms. If they\'re thinking of different things, there\'s no contract (mutual mistake). Example: both thinking of different ships named "Peerless" — no contract formed.'},
 ],
 quiz:{q:'Paula offers to sell her car for $5,000. Dan says "I\'ll give you $4,500." Paula says no. Dan then says "Fine, $5,000." Is there a contract?',
  choices:['A. Yes — Dan ultimately agreed to Paula\'s price','B. No — Dan\'s counteroffer killed the original offer','C. Yes — Paula never officially withdrew','D. No — car sales require writing'],
  correct:1,
  good:'Correct! The mirror image rule. A counteroffer rejects and replaces the original offer. When Dan said $4,500, Paula\'s $5,000 offer was legally dead. Dan cannot revive it. Paula would have to make a new offer.',
  bad:'Not quite. The answer is B. The mirror image rule says a counteroffer kills the original offer. Dan\'s $4,500 counter rejected Paula\'s $5,000 offer. That offer is gone — Dan cannot accept a dead offer.'}
},
{id:1,subject:'Contracts',level:1,title:'Consideration & Defenses',icon:'🤝',
 eyebrow:'Year 1 · Contracts · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Consideration — what makes a promise enforceable',body:'Consideration is the exchange that makes a contract real. Both sides must give something. A one-sided gift is not a contract.\n\nValid consideration can be:\n· Money or property\n· A service or action\n· A promise to do something\n· Giving up a legal right (forbearance)'},
  {type:'trap',label:'Past Consideration is NOT valid',body:'You cannot promise to pay for something already done. "I\'ll pay you $500 for the work you did last month" — no consideration. The work was already done before the promise. This promise is unenforceable.\n\nEXCEPTION: Promissory Estoppel — if someone reasonably relies on your promise and is harmed by that reliance, a court may enforce the promise anyway to prevent injustice.'},
  {type:'concept',label:'Defenses to Contract Enforcement',body:'Even a validly formed contract can be defeated by:\n· FRAUD — someone lied about a material fact to get you to sign\n· DURESS — you were threatened or coerced into signing\n· UNDUE INFLUENCE — someone in power over you exploited that relationship\n· UNCONSCIONABILITY — the deal was so one-sided no reasonable person would agree\n· MUTUAL MISTAKE — both parties were wrong about a key existing fact\n· ILLEGALITY — the contract requires something illegal (void, not voidable)'},
  {type:'rule',label:'Void vs. Voidable',body:'VOID — the contract never legally existed and cannot be enforced by anyone. (Illegal contracts, contracts with no consideration)\nVOIDABLE — the contract exists but the harmed party can choose to cancel it. (Fraud, duress, minor\'s contract)'},
  {type:'example',label:'Example',body:'Jake signs a contract to buy a car after the dealer falsely told him it has never been in an accident (it has). Jake was defrauded. The contract is VOIDABLE — Jake can either enforce it or cancel it. The choice is his.'},
 ],
 quiz:{q:'Maria, age 16, signs a contract to buy a car. Two weeks later she changes her mind. What happens?',
  choices:['A. She must honor the contract — she signed it','B. The contract is void — it never existed','C. The contract is voidable — she can cancel it','D. She must pay a penalty to cancel'],
  correct:2,
  good:'Correct! Contracts with minors are voidable — not void. The minor can disaffirm (cancel) the contract. The other party cannot cancel just because the other side is a minor.',
  bad:'The answer is C. Minors lack full capacity, so their contracts are voidable — the minor can choose to cancel. The contract is not automatically void; it exists until the minor cancels it.'}
},
{id:2,subject:'Contracts',level:1,title:'Statute of Frauds & Terms',icon:'🤝',
 eyebrow:'Year 1 · Contracts · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Statute of Frauds — when contracts MUST be in writing',body:'Most contracts can be oral. But certain contracts MUST be in writing to be enforceable. Remember the acronym MY LEGS:\n\nM — Marriage contracts (prenups)\nY — Year or more (contracts that cannot be performed within one year)\nL — Land (any sale of real estate)\nE — Executor promises (paying a deceased person\'s debts from your own pocket)\nG — Goods over $500 (under the UCC)\nS — Suretyship (promising to pay another person\'s debt)'},
  {type:'rule',label:'What the writing must include',body:'The writing must identify the parties, describe the subject matter, and be signed by the party being sued. It does not have to be formal — an email, a text, a napkin note can satisfy the Statute of Frauds as long as it hits these basics.'},
  {type:'concept',label:'Express and Implied Terms',body:'EXPRESS TERMS — specifically agreed to (price, delivery date, payment schedule)\nIMPLIED TERMS — not stated but read into the contract by law:\n· Implied duty of good faith — all contracts require honest, fair dealing\n· Implied warranty of merchantability — goods must work for their ordinary purpose (UCC)\n· Gap fillers — UCC fills in missing terms (reasonable price, reasonable time) so contracts don\'t fail for vagueness'},
  {type:'example',label:'Example',body:'Two business owners shake hands and agree that one will supply 1,000 widgets to the other for $600. No written contract. Is this enforceable?\n\nGoods over $500 → Statute of Frauds → Must be in writing. Without a signed writing, neither party can sue to enforce this deal.'},
 ],
 quiz:{q:'Tom orally agrees to buy Sarah\'s house for $400,000. Sarah later backs out. Can Tom enforce the deal?',
  choices:['A. Yes — oral contracts are always binding','B. No — real estate contracts must be in writing','C. Yes — if there are witnesses','D. No — only if Tom paid a deposit'],
  correct:1,
  good:'Correct! Real estate — any sale of land — falls under the Statute of Frauds. The contract must be in writing and signed. An oral agreement to buy real estate is unenforceable.',
  bad:'The answer is B. Land sales are one of the classic Statute of Frauds categories (the L in MY LEGS). Real estate contracts must be in writing to be enforceable.'}
},
{id:3,subject:'Contracts',level:1,title:'Breach & Remedies',icon:'🤝',
 eyebrow:'Year 1 · Contracts · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Types of Breach',body:'MATERIAL BREACH — so serious that the other party is excused from performing and can sue for all damages. The contract is essentially broken beyond repair.\n\nMINOR BREACH (Partial Breach) — a small deviation from the terms. The other party must still perform their own obligations but can sue for damages caused by the breach.\n\nANTICIPATORY REPUDIATION — one party says BEFORE their performance is due that they will not perform. The innocent party can immediately sue, or wait to see if the breaching party changes their mind.'},
  {type:'rule',label:'Remedies — what you can get for breach',body:'EXPECTATION DAMAGES (most common) — put the victim in the position they would have been in if the contract had been performed.\nFormula: Loss in value + Other loss − Cost avoided − Loss avoided\n\nRELIANCE DAMAGES — reimburse what the victim spent in reliance on the contract.\n\nRESTITUTION — give back any unjust enrichment (what the breaching party received).\n\nSPECIFIC PERFORMANCE — court orders the breaching party to actually perform. Only available when money damages are inadequate — typically for unique goods (art, real estate).'},
  {type:'concept',label:'Duty to Mitigate',body:'The victim of a breach MUST take reasonable steps to reduce their losses. If you don\'t try to mitigate, you cannot recover damages that could have been avoided.\n\nExample: Your employer wrongfully fires you. You must look for another job. If you find a comparable job at the same pay, you cannot sue your former employer for lost wages during that period.'},
  {type:'example',label:'Example',body:'You hire a contractor to build a deck for $10,000, due July 1. The contractor quits halfway through in June. You hire someone else to finish for $14,000.\n\nExpectation damages: $14,000 − $10,000 = $4,000 (the extra you had to pay). Plus any other costs directly caused by the delay.'},
 ],
 quiz:{q:'Owner hires Painter to paint a house for $3,000. Painter does the job but uses the wrong shade of white — cost to repaint: $200. Is this a material breach?',
  choices:['A. Yes — any deviation is material','B. No — this is a minor breach; Owner must pay but can deduct $200','C. Yes — Owner can refuse to pay anything','D. No — Owner cannot sue at all'],
  correct:1,
  good:'Correct! Using the wrong shade of white is a minor breach — a small deviation. Owner must still pay the contract price but can deduct the $200 cost to fix the error. A minor breach does not excuse the other party from performing.',
  bad:'The answer is B. The wrong shade of white is a minor breach — it does not go to the heart of the contract. Owner must pay but can deduct the actual damages caused by the breach ($200).'}
},
{id:4,subject:'Contracts',level:1,title:'UCC, Third Parties & Wrap-Up',icon:'🤝',
 eyebrow:'Year 1 · Contracts · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'UCC Article 2 — Sales of Goods',body:'The Uniform Commercial Code (UCC) Article 2 governs the SALE OF GOODS — movable, tangible things. Common law governs everything else (services, real estate, employment).\n\nKEY UCC DIFFERENCES from common law:\n· Battle of the Forms — between merchants, additional terms in an acceptance become part of the contract unless they materially alter it\n· Perfect Tender Rule — buyer can reject goods that don\'t perfectly conform to the contract\n· Implied warranty of merchantability — goods must be fit for their ordinary purpose\n· Good faith required in all UCC contracts'},
  {type:'concept',label:'Third Party Rights',body:'THIRD PARTY BENEFICIARY — someone not in the contract who benefits from it.\n· Intended beneficiary — parties meant for them to benefit; they can sue to enforce\n· Incidental beneficiary — benefit is a side effect; they cannot sue\n\nASSIGNMENT — transferring your RIGHTS under a contract to someone else. Generally allowed unless the contract prohibits it or it would materially change the other party\'s duties.\n\nDELEGATION — transferring your DUTIES to someone else. Allowed unless the contract requires personal performance (hiring a famous artist — you cannot delegate to a stranger).'},
  {type:'concept',label:'Impossibility, Impracticability & Frustration',body:'IMPOSSIBILITY — performance is literally impossible (subject matter destroyed, performer dies for personal services contracts). Excuses both parties.\n\nCOMMERCIAL IMPRACTICABILITY — performance is possible but would be commercially unreasonable due to an unforeseeable event. Courts rarely accept this excuse.\n\nFRUSTRATION OF PURPOSE — performance is possible but the entire point of the contract has been destroyed by an unexpected event. Example: you rent a room to watch the coronation parade — the parade is canceled. Contract may be excused.'},
  {type:'rule',label:'Contracts Summary — What to Check Every Time',body:'1. Is there a valid contract? (Offer, Acceptance, Consideration, Capacity, Legality)\n2. Does the Statute of Frauds apply? Is there a writing?\n3. Are there any defenses? (Fraud, duress, mistake, illegality)\n4. Was there a breach? (Material or minor?)\n5. What remedies are available? (Expectation, reliance, restitution, specific performance)\n6. Is this common law or UCC?'},
 ],
 quiz:{q:'Under the UCC, a merchant buyer receives goods that are slightly defective — they work but have a minor scratch. What can the buyer do?',
  choices:['A. Must accept — small defects don\'t count','B. Can reject the entire shipment under the Perfect Tender Rule','C. Must accept but cannot seek damages','D. Can only reject if the defect is material'],
  correct:1,
  good:'Correct! The Perfect Tender Rule under UCC Article 2 gives the buyer the right to reject goods that do not perfectly conform to the contract — even for minor defects. This is stricter than common law.',
  bad:'The answer is B. The UCC\'s Perfect Tender Rule allows a buyer to reject goods that don\'t perfectly conform — even a minor defect gives the right to reject. This is one of the major differences between UCC and common law.'}
},
// ── TORTS (5-9) ─────────────────────────────────────────────────────
{id:5,subject:'Torts',level:1,title:'Intentional Torts',icon:'⚖',
 eyebrow:'Year 1 · Torts · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is a Tort?',body:'A tort is a civil wrong — not a crime, not a broken contract. Someone wrongs you and you sue them for money damages. The government is not involved. You bring the lawsuit as the person harmed.\n\nThree categories:\n1. Intentional torts — defendant meant to do the act\n2. Negligence — defendant was careless\n3. Strict liability — defendant is liable regardless of intent or care'},
  {type:'concept',label:'The Intentional Torts You Must Know',body:'BATTERY — intentional harmful or offensive contact with another\'s person. Contact with anything connected to the person counts (knocking their coffee, grabbing their bag).\n\nASSAULT — intentional act causing reasonable apprehension of IMMINENT battery. No contact needed. Words alone are usually not enough — there must be some act.\n\nFALSE IMPRISONMENT — intentionally confining someone to a bounded area without consent and without legal authority. Must be no reasonable means of escape.\n\nIIED (Intentional Infliction of Emotional Distress) — extreme and outrageous conduct (beyond what a civilized society tolerates) that intentionally or recklessly causes severe emotional distress.'},
  {type:'concept',label:'Property Torts',body:'TRESPASS TO LAND — intentionally entering another\'s land without permission. Intent to enter is enough — you don\'t have to intend harm. Good faith mistake is no defense.\n\nTRESPASS TO CHATTELS — intentionally interfering with another\'s personal property (damaging it, borrowing without permission). Must cause some harm.\n\nCONVERSION — intentionally exercising such serious dominion over another\'s property that it is fair to make you buy it at full value. Conversion = forced sale.'},
  {type:'example',label:'Example',body:'Dan grabs Maria\'s umbrella by mistake, thinking it\'s his. He returns it one hour later.\n\nTrespass to chattels — yes, he intentionally took it (even if he thought it was his). Conversion — probably not, since he returned it quickly and the interference was minor. If he\'d kept it for weeks or destroyed it, that\'s conversion.'},
 ],
 quiz:{q:'Alex walks into a neighbor\'s yard to retrieve his ball without asking. The neighbor comes home and is furious. Has Alex committed a tort?',
  choices:['A. No — he had a good reason','B. Yes — trespass to land, even without damage','C. No — he didn\'t stay long','D. Yes — but only if the neighbor suffered harm'],
  correct:1,
  good:'Correct! Trespass to land requires only intentional entry onto another\'s land without permission. It doesn\'t matter that Alex had a good reason, that he left quickly, or that nothing was damaged. The unauthorized entry itself is the tort.',
  bad:'The answer is B. Trespass to land only requires intentional entry without consent. No damage required. Good intentions are no defense. Alex committed trespass to land.'}
},
{id:6,subject:'Torts',level:1,title:'Negligence',icon:'⚖',
 eyebrow:'Year 1 · Torts · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Negligence — the most important tort',body:'Negligence is carelessness that causes harm. You don\'t have to mean to hurt someone — you just have to fail to act like a reasonable person would.\n\nTo win a negligence case you must prove ALL FOUR elements — DBCD:\n1. DUTY — defendant owed plaintiff a duty of care\n2. BREACH — defendant fell below the standard of care\n3. CAUSATION — breach actually and proximately caused the harm\n4. DAMAGES — plaintiff suffered actual, compensable harm'},
  {type:'rule',label:'Duty of Care',body:'GENERAL RULE: Everyone owes a duty to act as a REASONABLE PERSON under the circumstances.\n\nSPECIAL RULES:\n· Professionals (doctors, lawyers) — held to the standard of their profession\n· Children — held to the standard of a child of similar age, intelligence, and experience (EXCEPT when doing adult activities like driving)\n· Landowners owe different duties to:\n  - Trespassers: only warn of known deadly traps\n  - Licensees (social guests): warn of known hidden dangers\n  - Invitees (customers, public): inspect and fix all dangers'},
  {type:'concept',label:'Breach',body:'Defendant breached if they fell below the reasonable person standard. Courts use cost-benefit analysis:\n· How likely was harm?\n· How severe was the potential harm?\n· What was the burden of taking precautions?\n\nRES IPSA LOQUITUR — "the thing speaks for itself." Negligence is inferred when: (1) the type of accident doesn\'t normally happen without negligence, and (2) defendant had exclusive control of the instrumentality causing harm. Plaintiff doesn\'t have to prove exactly what went wrong.'},
  {type:'concept',label:'Causation — two parts',body:'ACTUAL CAUSE (But-For): But for defendant\'s negligence, would plaintiff\'s harm have occurred? If yes to harm without negligence → defendant is NOT the actual cause.\n\nPROXIMATE CAUSE (Legal Cause): Was the harm a FORESEEABLE result of the defendant\'s negligence? Palsgraf rule — if harm to this plaintiff was not foreseeable, defendant is not liable even if they caused the harm.\n\nSUPERSEDING CAUSE — an unforeseeable, independent act by a third party that breaks the causal chain and relieves defendant of liability.'},
  {type:'example',label:'The Palsgraf Case — Proximate Cause Illustrated',body:'Railroad employees helped a man onto a moving train. He dropped fireworks. They exploded. The blast knocked over a scale at the other end of the platform. It hit Mrs. Palsgraf.\n\nCourt held: The railroad could not have foreseen that helping one passenger would harm someone far away. No proximate cause. No liability. Even though they caused the chain of events, the harm was unforeseeable.'},
 ],
 quiz:{q:'A hospital performs an operation and the patient is harmed by a surgical tool left inside them. The patient doesn\'t know who was negligent. What doctrine helps?',
  choices:['A. Contributory negligence','B. Res ipsa loquitur','C. Assumption of risk','D. Comparative fault'],
  correct:1,
  good:'Correct! Res ipsa loquitur — surgical tools don\'t get left inside patients without negligence, and the surgical team had exclusive control. The court will infer negligence without requiring plaintiff to identify exactly what went wrong.',
  bad:'The answer is B. Res ipsa loquitur allows the court to infer negligence when the type of accident implies negligence and defendant had exclusive control. Perfect for cases like this where the exact error is unknown.'}
},
{id:7,subject:'Torts',level:1,title:'Defenses to Negligence',icon:'⚖',
 eyebrow:'Year 1 · Torts · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Three Main Defenses',body:'CONTRIBUTORY NEGLIGENCE (minority rule) — if plaintiff was at all negligent, they recover NOTHING. Even 1% fault = zero recovery. Very harsh; only a few states use this.\n\nCOMPARATIVE NEGLIGENCE (majority rule) — plaintiff\'s recovery is reduced by their percentage of fault:\n· PURE comparative: plaintiff recovers even if 99% at fault (reduced proportionally)\n· MODIFIED comparative (most states): plaintiff cannot recover if 50% or more at fault\n\nASSUMPTION OF RISK — plaintiff knowingly and voluntarily encountered a known risk. Complete defense in contributory negligence states; reduces recovery in comparative states.'},
  {type:'rule',label:'Last Clear Chance Doctrine',body:'In contributory negligence states, even if plaintiff was negligent, they can recover if defendant had the LAST CLEAR CHANCE to avoid the harm and failed to take it. Softens the harshness of contributory negligence.'},
  {type:'example',label:'Example',body:'Kim is speeding (clearly negligent). Bob runs a red light and hits Kim. Jury finds Kim 30% at fault, Bob 70% at fault. Kim\'s damages: $100,000.\n\n· Pure comparative: Kim gets $70,000 (reduced by 30%)\n· Modified comparative: Kim still gets $70,000 (under 50%, so she can still recover)\n· Contributory negligence: Kim gets NOTHING (any fault = no recovery)'},
 ],
 quiz:{q:'Plaintiff was 55% at fault in an accident in a modified comparative negligence state. Damages total $200,000. What does plaintiff recover?',
  choices:['A. $90,000 (45% of damages)','B. $0 — over the 50% threshold','C. $200,000 — fault doesn\'t matter','D. $110,000 (55% of damages)'],
  correct:1,
  good:'Correct! Modified comparative negligence bars recovery if plaintiff is 50% or more at fault. At 55%, plaintiff is over the threshold and recovers nothing. If they were 49% at fault, they\'d recover 51% of damages.',
  bad:'The answer is B. Modified comparative negligence states bar recovery entirely if plaintiff is 50% or more at fault. At 55%, the threshold is crossed and plaintiff recovers nothing.'}
},
{id:8,subject:'Torts',level:1,title:'Strict Liability & Products',icon:'⚖',
 eyebrow:'Year 1 · Torts · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Strict Liability — no fault required',body:'Some activities are so dangerous that the law holds you liable for resulting harm regardless of how careful you were.\n\nSTRICT LIABILITY APPLIES TO:\n· Abnormally dangerous activities (blasting, storing large quantities of explosives, releasing toxic chemicals)\n· Wild animals — always strictly liable for harm caused by wild animals you keep\n· Domestic animals — strictly liable only if owner knew of the animal\'s dangerous propensity (one-bite rule in most states)'},
  {type:'concept',label:'Products Liability',body:'Manufacturers, distributors, and sellers can be strictly liable for defective products.\n\n3 TYPES OF DEFECTS:\n1. MANUFACTURING DEFECT — this specific product deviated from the intended design (one bad unit off the assembly line)\n2. DESIGN DEFECT — the entire product line is unsafe as designed. Tests:\n   · Consumer Expectation Test: was the product more dangerous than a consumer would expect?\n   · Risk-Utility Test: do the risks outweigh the benefits of the design?\n3. FAILURE TO WARN — seller knew or should have known of a non-obvious risk and failed to warn users'},
  {type:'example',label:'Example',body:'A blender has a blade that comes loose during normal use (it\'s not supposed to). A user\'s hand is cut.\n\n· Manufacturing defect if only this blender has the problem\n· Design defect if all blenders of this model have the same issue\n· Failure to warn if the manual didn\'t warn that blades can loosen after extended use'},
 ],
 quiz:{q:'Dave keeps a pet chimpanzee. The chimp attacks a visitor who had never provoked it. Is Dave strictly liable?',
  choices:['A. No — the visitor assumed the risk','B. Yes — chimps are wild animals, strict liability applies','C. Only if Dave knew the chimp was aggressive','D. No — wild animal rules only apply outside the home'],
  correct:1,
  good:'Correct! A chimpanzee is a wild animal regardless of how long it has been kept as a pet. The owner of a wild animal is strictly liable for any harm it causes — no need to show the owner knew it was dangerous.',
  bad:'The answer is B. Chimpanzees are wild animals by nature. The strict liability rule for wild animals applies automatically — no need to prove the owner knew the animal was dangerous.'}
},
{id:9,subject:'Torts',level:1,title:'Defamation & Other Torts',icon:'⚖',
 eyebrow:'Year 1 · Torts · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'Defamation',body:'Defamation = false statement of FACT about a person, communicated (published) to at least one third party, that damages the person\'s reputation.\n\nLIBEL — written defamation. Presumed harmful.\nSLANDER — spoken defamation. Must prove actual harm (with exceptions for slander per se).\n\nSLANDER PER SE (harm presumed) — statements that:\n· Accuse someone of a crime involving moral turpitude\n· Allege a loathsome disease\n· Hurt someone in their profession or business\n· Accuse a woman of sexual immorality'},
  {type:'rule',label:'Public vs. Private Figures',body:'PUBLIC FIGURES (politicians, celebrities) must prove ACTUAL MALICE — defendant knew the statement was false OR acted with reckless disregard for its truth or falsity. Very hard to prove.\n\nPRIVATE FIGURES need only prove NEGLIGENCE — defendant should have known the statement was false.\n\nDEFENSES: Truth is an absolute defense. Privilege (absolute for legislators on the floor; qualified for good-faith statements in limited contexts like employment references).'},
  {type:'concept',label:'Invasion of Privacy — 4 Types',body:'1. INTRUSION UPON SECLUSION — invading someone\'s private space (secretly recording in a bedroom)\n2. PUBLIC DISCLOSURE OF PRIVATE FACTS — publicizing embarrassing true private information\n3. FALSE LIGHT — publicizing information that puts someone in a false light (misleading context)\n4. APPROPRIATION — using someone\'s name or image for commercial benefit without consent'},
  {type:'example',label:'Example',body:'A newspaper prints "Dr. Smith was arrested for drunk driving" — it\'s completely false. Dr. Smith is a private figure.\n\nDefamation claim: False statement of fact (yes), published (yes), about plaintiff (yes), harmful to reputation (yes), negligence standard applies (private figure).\n\nIf Smith is a public figure like the mayor, he must prove the paper knew it was false or acted recklessly.'},
 ],
 quiz:{q:'A tabloid falsely reports that a famous actress has a contagious disease. She sues for defamation. What must she prove?',
  choices:['A. Negligence only — she\'s not truly a public figure','B. Actual malice — she is a public figure','C. Nothing — false statements are automatically defamatory','D. Actual damages — libel always requires proof of harm'],
  correct:1,
  good:'Correct! A famous actress is a public figure. Public figures must prove actual malice — the defendant knew the statement was false or acted with reckless disregard for truth. This is a high bar designed to protect free speech.',
  bad:'The answer is B. Public figures (celebrities, politicians, athletes) must prove actual malice to win a defamation claim — the defendant knew the statement was false or was reckless about its truth.'}
},
// ── CIVIL PROCEDURE (10-14) ──────────────────────────────────────────
{id:10,subject:'Civil Procedure',level:1,title:'Jurisdiction',icon:'📂',
 eyebrow:'Year 1 · Civil Procedure · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is Civil Procedure?',body:'Civil procedure is the rulebook for how a lawsuit moves through court from filing to judgment. It\'s not about who\'s right — it\'s about the process. Follow the rules or lose on a technicality even if you\'re right on the merits.'},
  {type:'concept',label:'Subject Matter Jurisdiction — can this court hear this type of case?',body:'FEDERAL COURTS need one of these:\n1. FEDERAL QUESTION — case involves the U.S. Constitution, federal law, or treaties\n2. DIVERSITY JURISDICTION — parties from different states AND amount in controversy exceeds $75,000\n   · Complete diversity required — no plaintiff and defendant from the same state\n   · Amount must EXCEED $75,000 (not just equal it)\n\nSTATE COURTS have general jurisdiction — they can hear almost any case. Most civil cases are in state court.'},
  {type:'rule',label:'Personal Jurisdiction — can this court reach the defendant?',body:'Court must have power over the defendant.\n\nTRADITIONAL BASES:\n· Presence — physically served in the state\n· Domicile — defendant\'s home state always has jurisdiction\n· Consent — defendant voluntarily submits (shows up without objecting)\n\nMODERN: MINIMUM CONTACTS — defendant must have purposefully availed themselves of the forum state such that being sued there is fair and reasonable.\n\nDEFENDANT MUST OBJECT to personal jurisdiction early (in first response) or waive it forever.'},
  {type:'concept',label:'Venue',body:'Venue is about WHICH courthouse — even within the right court system. Generally proper where:\n· Any defendant resides (if all defendants in same state)\n· Substantial part of the events occurred\n· For diversity cases: where any defendant resides\n\nImproper venue can be transferred (not dismissed).'},
 ],
 quiz:{q:'A California plaintiff sues a Texas defendant for $80,000 arising from a car accident that happened in Texas. Can a federal court hear this case?',
  choices:['A. No — car accidents are state law matters','B. Yes — diversity jurisdiction: different states, over $75,000','C. No — the accident was in Texas so Texas has exclusive jurisdiction','D. Yes — but only in California federal court'],
  correct:1,
  good:'Correct! Diversity jurisdiction requires complete diversity (CA plaintiff vs TX defendant — check) and amount exceeding $75,000 ($80,000 — check). The federal court can hear this case even though it\'s a state law (negligence) claim.',
  bad:'The answer is B. Diversity jurisdiction applies: the parties are from different states (California and Texas) and the amount ($80,000) exceeds the $75,000 threshold. Federal court can hear state law claims under diversity jurisdiction.'}
},
{id:11,subject:'Civil Procedure',level:1,title:'Pleadings & Service',icon:'📂',
 eyebrow:'Year 1 · Civil Procedure · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Starting a Lawsuit — Pleadings',body:'COMPLAINT — plaintiff files this document to start the lawsuit. Under federal rules must contain:\n· Identification of the parties\n· Statement of the court\'s jurisdiction\n· Short and plain statement of the claim showing entitlement to relief\n· Demand for relief (what plaintiff wants)\n\nSERVICE OF PROCESS — defendant must be properly notified of the lawsuit. Must deliver summons + complaint to defendant personally, or leave with someone of suitable age at defendant\'s home, or by mail with acknowledgment. Without proper service, court has no power over defendant.'},
  {type:'concept',label:'Defendant\'s Response Options',body:'RULE 12(b) MOTIONS (pre-answer motions) — defendant can move to dismiss for:\n· (1) Lack of subject matter jurisdiction (never waived)\n· (2) Lack of personal jurisdiction (waived if not raised immediately)\n· (3) Improper venue\n· (6) Failure to state a claim — even if everything plaintiff says is true, no legal claim exists\n\nANSWER — defendant must admit or deny each allegation and raise any affirmative defenses:\n· Self-defense, statute of limitations, assumption of risk, etc.\n· If not raised in the answer, affirmative defenses are WAIVED\n\nCOUNTERCLAIM — defendant sues plaintiff back in the same action\nCROSS-CLAIM — defendant sues a co-defendant'},
  {type:'rule',label:'Amended Pleadings',body:'A party may amend a pleading once as a matter of right within 21 days of serving it. After that, need court permission or written consent of opposing party.\n\nAMENDMENT RELATES BACK to the original filing date (important for statute of limitations) if it arises from the same transaction or occurrence.'},
 ],
 quiz:{q:'Defendant is served with a complaint for breach of contract. She believes the court has no personal jurisdiction over her AND the plaintiff failed to state a valid claim. When must she raise these issues?',
  choices:['A. Personal jurisdiction immediately; failure to state a claim can come later','B. Both must be raised in her first response or they are waived','C. Both can be raised at any time during the lawsuit','D. Personal jurisdiction can be raised at trial; failure to state a claim must be immediate'],
  correct:1,
  good:'Correct! Personal jurisdiction (and most Rule 12(b) defenses) must be raised in the first response — answer or pre-answer motion. Failure to do so waives them. The exception is subject matter jurisdiction, which can never be waived.',
  bad:'The answer is B. Personal jurisdiction and most 12(b) defenses must be raised in the first response. Failure to raise personal jurisdiction immediately = waived. Only subject matter jurisdiction (12(b)(1)) can be raised at any time.'}
},
{id:12,subject:'Civil Procedure',level:1,title:'Discovery',icon:'📂',
 eyebrow:'Year 1 · Civil Procedure · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Discovery — no surprises at trial',body:'Before trial, both sides share information. The idea: cases should be decided on the merits, not on who knew more at trial. Federal courts require extensive disclosure.\n\nAUTOMATIC DISCLOSURE (required without asking):\n· Identity of witnesses likely to have relevant information\n· Documents relevant to claims or defenses\n· Computation of claimed damages\n· Insurance agreements'},
  {type:'concept',label:'Discovery Tools',body:'DEPOSITIONS — sworn oral testimony taken before trial. Lawyer asks questions, court reporter records everything. Depositions can be used at trial to impeach (contradict) a witness or if witness is unavailable.\n\nINTERROGATORIES — written questions answered in writing under oath. Only to parties (not non-party witnesses).\n\nREQUESTS FOR PRODUCTION — demand documents, electronically stored information, or tangible things.\n\nREQUESTS FOR ADMISSION — ask the other party to admit specific facts. Admitted facts need not be proved at trial.\n\nPHYSICAL OR MENTAL EXAMINATION — when physical/mental condition is at issue; requires court order.'},
  {type:'rule',label:'Work Product & Privilege',body:'ATTORNEY-CLIENT PRIVILEGE — confidential communications between attorney and client are protected. Cannot be discovered. Client holds the privilege and can waive it.\n\nWORK PRODUCT DOCTRINE — attorney\'s mental impressions, conclusions, opinions, and legal strategies prepared in anticipation of litigation are protected. Can be overcome by showing substantial need and inability to obtain the materials elsewhere without undue hardship.\n\nCRIME-FRAUD EXCEPTION — no privilege if the communication was made to help commit a crime or fraud.'},
 ],
 quiz:{q:'Plaintiff asks defendant\'s lawyer in discovery for all notes the lawyer made while preparing for trial. Must the lawyer turn them over?',
  choices:['A. Yes — all documents must be disclosed','B. No — they are protected attorney work product','C. Yes — if plaintiff can show they\'re relevant','D. No — only oral communications are protected'],
  correct:1,
  good:'Correct! An attorney\'s mental impressions, legal strategies, and trial preparation notes are protected work product. They cannot be obtained in discovery absent a showing of substantial need and inability to get the information elsewhere.',
  bad:'The answer is B. Trial preparation notes are classic work product — the attorney\'s own thinking and strategy. This is protected and need not be turned over. Relevant alone is not enough to overcome work product protection.'}
},
{id:13,subject:'Civil Procedure',level:1,title:'Summary Judgment & Trial',icon:'📂',
 eyebrow:'Year 1 · Civil Procedure · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Pretrial Motions',body:'MOTION TO DISMISS (12(b)(6)) — no valid legal claim even if all facts are true. The legal standard: state a plausible claim.\n\nSUMMARY JUDGMENT — no genuine dispute of MATERIAL fact; one party is entitled to judgment as a matter of law. The non-moving party must show specific facts showing there\'s a genuine issue for trial. If plaintiff can\'t present evidence to support their claim, defendant wins on summary judgment.\n\nMOTION IN LIMINE — ask the judge to exclude specific evidence BEFORE trial even starts.'},
  {type:'concept',label:'Trial',body:'RIGHT TO JURY TRIAL — 7th Amendment: civil cases at common law with more than $20 in controversy have the right to a jury trial in federal court. Both sides must demand it.\n\nJURY SELECTION (voir dire) — lawyers question prospective jurors. Can challenge for cause (bias, relationship to party) unlimited times, or peremptory challenges (no reason given) — limited number. Cannot use peremptories to exclude jurors based on race or gender.\n\nBURDEN OF PROOF — plaintiff must prove each element by a PREPONDERANCE OF THE EVIDENCE (more likely than not — 51%).'},
  {type:'rule',label:'After the Verdict',body:'JUDGMENT AS A MATTER OF LAW (JMOL / Directed Verdict) — judge takes case from jury before or after verdict if no reasonable jury could find for one side.\n\nNEW TRIAL — judge can order a new trial if verdict is against the weight of the evidence, there was jury misconduct, or prejudicial error occurred at trial.\n\nRES JUDICATA (Claim Preclusion) — once a case is finally decided, neither party can sue again on the same claim.\n\nCOLLATERAL ESTOPPEL (Issue Preclusion) — specific issues actually decided in one case cannot be relitigated in future cases between the same parties.'},
 ],
 quiz:{q:'After a full trial, the jury finds for plaintiff. Defendant believes no reasonable jury could have reached this verdict. What motion should defendant file?',
  choices:['A. Motion for new trial','B. Motion for summary judgment','C. Renewed motion for judgment as a matter of law (JMOL)','D. Motion to dismiss'],
  correct:2,
  good:'Correct! After the verdict, defendant can file a renewed motion for judgment as a matter of law (JMOL) arguing that no reasonable jury could have found for plaintiff. This must be based on the ground raised in the pre-verdict motion for JMOL.',
  bad:'The answer is C. After the verdict, the motion is a renewed JMOL — arguing no reasonable jury could have found for the other side. A new trial motion is different — it asks for a re-do rather than a judgment for defendant.'}
},
{id:14,subject:'Civil Procedure',level:1,title:'Joinder & Appeals',icon:'📂',
 eyebrow:'Year 1 · Civil Procedure · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'Joining Parties and Claims',body:'JOINDER OF CLAIMS — a party may join any claims they have against an opposing party. Get all disputes resolved in one case.\n\nCOMPULSORY COUNTERCLAIMS — if defendant\'s claim arises from the same transaction as plaintiff\'s claim, defendant MUST assert it in the current case or lose it forever.\n\nPERMISSIVE COUNTERCLAIMS — if unrelated to plaintiff\'s claim, defendant may (but doesn\'t have to) include it.\n\nJOINDER OF PARTIES:\n· Permissive — parties may join if claims arise from same transaction and have common legal or factual questions\n· Compulsory (necessary parties) — must be joined if feasible; without them the court can\'t grant complete relief'},
  {type:'concept',label:'Class Actions',body:'When many people have the same claim, one person (class representative) can sue on behalf of all of them. Requirements:\n· Numerosity — too many plaintiffs to join individually\n· Commonality — common legal or factual questions\n· Typicality — representative\'s claims typical of the class\n· Adequacy — representative will adequately protect class interests\n\nCourt must certify the class. Notice to class members required.'},
  {type:'rule',label:'Appeals',body:'FINAL JUDGMENT RULE — generally, you can only appeal AFTER a final judgment. Cannot appeal mid-case rulings (interlocutory orders) except:\n· Injunctions\n· Collateral order doctrine (certain rights that would be lost without immediate review)\n· Certification by district court that a controlling question of law is involved\n\nAPPELLATE REVIEW STANDARDS:\n· Questions of law — de novo (fresh look; appellate court decides independently)\n· Factual findings — clearly erroneous (hard to overturn)\n· Discretionary rulings — abuse of discretion\n\nYou must PRESERVE the error at trial (object at the time) or waive it on appeal.'},
 ],
 quiz:{q:'Defendant loses at trial and appeals. The trial court made an incorrect ruling on what the law required. What standard does the appellate court use to review this?',
  choices:['A. Clearly erroneous','B. De novo','C. Abuse of discretion','D. Preponderance of evidence'],
  correct:1,
  good:'Correct! Questions of law are reviewed de novo — the appellate court takes a fresh, independent look and owes no deference to the trial court\'s legal conclusions. If the trial court got the law wrong, the appellate court corrects it.',
  bad:'The answer is B. Legal questions are reviewed de novo — the appellate court decides independently. "Clearly erroneous" applies to factual findings; "abuse of discretion" applies to discretionary calls. The law is the law — appellate courts review it fresh.'}
},
// ── CONSTITUTIONAL LAW (15-19) ───────────────────────────────────────
{id:15,subject:'Constitutional Law',level:1,title:'Government Powers',icon:'🏛',
 eyebrow:'Year 1 · Constitutional Law · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is Constitutional Law?',body:'The Constitution is America\'s supreme law — it creates the government AND limits what the government can do. Constitutional law is about two things: (1) does the government have the POWER to act, and (2) did it VIOLATE someone\'s rights?\n\nKey principle: The federal government only has powers the Constitution gives it. States have broad general powers. Individual rights limit BOTH.'},
  {type:'concept',label:'Congress\'s Key Powers',body:'COMMERCE CLAUSE (most important) — Congress can regulate interstate commerce. Very broad — covers anything that substantially affects interstate commerce. Almost all federal economic regulation rests here.\n\nNECESSARY & PROPER CLAUSE — Congress can make all laws necessary and proper to carry out its enumerated powers. Expands Congress\'s reach significantly.\n\nTAXING POWER — Congress can tax even for regulatory purposes (not just to raise revenue).\n\nSPENDING POWER — Congress can spend for the general welfare AND attach conditions on states receiving federal funds (must be clearly stated, related to the program, not coercive).'},
  {type:'rule',label:'State vs. Federal Power',body:'SUPREMACY CLAUSE — when federal law conflicts with state law, federal law wins (preemption).\n\nEXPRESS PREEMPTION — federal law explicitly says it preempts state law.\nIMPLIED PREEMPTION — federal law so pervasively covers a field that states have no room to regulate.\nCONFLICT PREEMPTION — impossible to comply with both state and federal law.\n\n10TH AMENDMENT — powers not given to federal government are reserved to states (but commerce clause is broad enough to cover most things).'},
 ],
 quiz:{q:'Congress passes a law requiring all trucking companies to follow federal safety standards, stating that no state may impose different standards. A state tries to require higher standards. Does federal law preempt the state law?',
  choices:['A. No — states can always set higher standards','B. Yes — express preemption: federal law explicitly preempts state law','C. No — safety is a traditional state power','D. Yes, but only if the state law conflicts with federal law'],
  correct:1,
  good:'Correct! This is express preemption — the federal law explicitly states that states may not impose different standards. When federal law expressly preempts state law, the Supremacy Clause requires the federal law to win.',
  bad:'The answer is B. Express preemption occurs when federal law explicitly states it preempts state regulation. The Supremacy Clause makes federal law supreme in areas where Congress has legislated with preemptive intent.'}
},
{id:16,subject:'Constitutional Law',level:1,title:'Due Process & Equal Protection',icon:'🏛',
 eyebrow:'Year 1 · Constitutional Law · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Due Process — 5th and 14th Amendments',body:'The government cannot deprive you of LIFE, LIBERTY, or PROPERTY without due process of law.\n\nPROCEDURAL DUE PROCESS — before the government takes something from you, you must get:\n· Notice — told what is happening and why\n· An opportunity to be heard — some kind of hearing\nThe more important the interest, the more process is required.\n\nSUBSTANTIVE DUE PROCESS — some rights are so fundamental the government cannot take them away even with perfect procedures:\n· Fundamental rights → strict scrutiny required (government almost always loses)\n· Non-fundamental rights → rational basis (government almost always wins)'},
  {type:'rule',label:'Fundamental Rights (Substantive Due Process)',body:'Rights protected as fundamental (strict scrutiny required to restrict):\n· Marriage\n· Procreation\n· Contraception\n· Privacy in intimate decisions\n· Parental rights (raising children)\n· Right to travel interstate\n· Right to vote\n\nNOT fundamental (rational basis applies): economic rights, most business regulations, education.'},
  {type:'concept',label:'Equal Protection — 14th Amendment',body:'Government cannot treat similarly situated groups differently without justification.\n\nTHREE LEVELS OF REVIEW:\n1. STRICT SCRUTINY — race, national origin, alienage. Law must be NECESSARY to serve a COMPELLING government interest. Government almost always LOSES.\n\n2. INTERMEDIATE SCRUTINY — gender, legitimacy. Law must be SUBSTANTIALLY RELATED to an IMPORTANT government interest. Government wins sometimes.\n\n3. RATIONAL BASIS — everything else. Law just needs a RATIONAL relationship to a LEGITIMATE government interest. Government almost always WINS.'},
  {type:'example',label:'Example',body:'State law gives men a longer time than women to challenge paternity. What level of scrutiny?\n\nGender → Intermediate scrutiny. The state must show the distinction substantially relates to an important government interest. A mere administrative convenience doesn\'t cut it — the law likely fails.'},
 ],
 quiz:{q:'A state law denies voting rights to felons who have served their sentences. A former felon challenges the law under equal protection. What level of scrutiny applies?',
  choices:['A. Strict scrutiny — voting is a fundamental right','B. Rational basis — felons are not a suspect class','C. Intermediate scrutiny — criminal history is quasi-suspect','D. Strict scrutiny — felon status correlates with race'],
  correct:1,
  good:'Correct! Former felons are not a suspect class (not race, national origin, etc.), and the court would apply rational basis review. The government has a rational basis for restricting voting rights of those convicted of crimes. The law would likely survive.',
  bad:'The answer is B. Although voting is a fundamental right for citizens, the equal protection challenge here turns on the classification being used — and felons are not a suspect class. Rational basis review applies, which the government will likely pass.'}
},
{id:17,subject:'Constitutional Law',level:1,title:'First Amendment — Speech',icon:'🏛',
 eyebrow:'Year 1 · Constitutional Law · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Freedom of Speech',body:'Congress shall make no law abridging the freedom of speech. But not all speech is protected — and the level of protection depends on the type of law restricting speech.\n\nCONTENT-BASED RESTRICTIONS (targeting what is said) → STRICT SCRUTINY. Government almost always loses.\n\nCONTENT-NEUTRAL RESTRICTIONS (targeting time, place, manner — not the message) → INTERMEDIATE SCRUTINY. Government must show the regulation is narrowly tailored to serve a significant interest and leaves open alternative channels.'},
  {type:'rule',label:'Unprotected Speech',body:'These categories of speech are NOT protected by the First Amendment:\n· TRUE THREATS — serious expressions of intent to commit unlawful violence\n· INCITEMENT — speech directed to and likely to produce imminent lawless action (Brandenburg test)\n· OBSCENITY — appeals to prurient interest, is patently offensive, and lacks serious literary, artistic, political, or scientific value (Miller test)\n· FIGHTING WORDS — face-to-face words likely to cause an immediate breach of the peace\n· FRAUD — deliberate false statements for commercial gain\n· DEFAMATION (actual malice for public figures)'},
  {type:'concept',label:'Public Forum Doctrine',body:'TRADITIONAL PUBLIC FORUMS (streets, parks, public squares) — government can impose reasonable time, place, and manner restrictions but cannot ban speech based on content.\n\nDESIGNATED PUBLIC FORUMS (government opens for expressive activity) — treated like traditional public forums while open.\n\nNON-PUBLIC FORUMS (government offices, military bases, jails) — government can restrict speech as long as it\'s viewpoint-neutral and reasonable.'},
 ],
 quiz:{q:'City bans all political signs in public parks. A citizen challenges this. What level of scrutiny applies?',
  choices:['A. Rational basis — parks are government property','B. Strict scrutiny — content-based restriction in a traditional public forum','C. Intermediate scrutiny — political speech can be limited','D. No protection — parks are not traditional public forums'],
  correct:1,
  good:'Correct! Public parks are traditional public forums, and a ban on political signs is a content-based restriction (targeting the message). Strict scrutiny applies. The government must show a compelling interest and narrow tailoring. This law almost certainly fails.',
  bad:'The answer is B. Public parks are traditional public forums — the government has the least power to restrict speech there. And targeting political signs is content-based. Strict scrutiny applies, and this blanket ban will almost certainly be struck down.'}
},
{id:18,subject:'Constitutional Law',level:1,title:'First Amendment — Religion & Other Rights',icon:'🏛',
 eyebrow:'Year 1 · Constitutional Law · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Religion Clauses',body:'ESTABLISHMENT CLAUSE — government cannot establish, endorse, or prefer any religion. Applies to states through the 14th Amendment.\n· No government-sponsored religious activity in public schools\n· Government can provide some aid to religious schools (secular, non-ideological aid)\n· Religious symbols on government property — context matters\n\nFREE EXERCISE CLAUSE — government cannot substantially burden a person\'s sincere religious beliefs without a compelling interest.\n· NEUTRAL, GENERALLY APPLICABLE LAWS that incidentally burden religion → only rational basis needed\n· LAWS TARGETING religion → strict scrutiny'},
  {type:'concept',label:'4th Amendment — Search & Seizure',body:'The right of the people to be secure in their persons, houses, papers, and effects against unreasonable searches and seizures.\n\nKEY POINTS:\n· Warrant required for searches, with probable cause and particularity\n· Exceptions to warrant requirement (covered in detail in Criminal Procedure)\n· Exclusionary rule — evidence obtained in violation of 4th Amendment is excluded at trial\n· Reasonable expectation of privacy — the test for whether a search occurred (Katz)'},
  {type:'concept',label:'Other Key Constitutional Provisions',body:'2ND AMENDMENT — right to keep and bear arms is an individual right (Heller). Subject to reasonable regulation.\n\n5TH AMENDMENT — no self-incrimination; no taking of private property for public use without just compensation (Takings Clause).\n\nTAKINGS CLAUSE:\n· Physical taking — government physically takes your property → must pay\n· Regulatory taking — regulation goes "too far" in reducing property value → must pay\n\n14TH AMENDMENT — applies most Bill of Rights protections to states through incorporation.'},
 ],
 quiz:{q:'A neutral, generally applicable city health code prohibits the slaughter of animals in the city. It happens to burden a religious group\'s ritual animal sacrifice. What scrutiny applies?',
  choices:['A. Strict scrutiny — religious practice is burdened','B. Rational basis — the law is neutral and generally applicable','C. Intermediate scrutiny — religious burdens require more justification','D. Strict scrutiny — religious freedom is a fundamental right'],
  correct:1,
  good:'Correct! Under Employment Division v. Smith, neutral, generally applicable laws that incidentally burden religion only need to satisfy rational basis review. The city\'s health code applies to everyone — it\'s not targeting this religion — so rational basis applies.',
  bad:'The answer is B. A neutral, generally applicable law that incidentally burdens religion only requires rational basis review (Employment Division v. Smith). If the law had been designed to target this religious group, strict scrutiny would apply.'}
},
{id:19,subject:'Constitutional Law',level:1,title:'Judicial Review & Wrap-Up',icon:'🏛',
 eyebrow:'Year 1 · Constitutional Law · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'Judicial Review & Standing',body:'JUDICIAL REVIEW — courts have the power to strike down laws that violate the Constitution (Marbury v. Madison, 1803). This is the bedrock of constitutional law.\n\nSTANDING TO SUE — to challenge a law in federal court, a plaintiff must show:\n1. INJURY IN FACT — concrete, actual or imminent harm\n2. CAUSATION — the harm is caused by defendant\'s conduct\n3. REDRESSABILITY — a court ruling would fix the harm\n\nNo advisory opinions — federal courts only decide actual cases or controversies.'},
  {type:'concept',label:'Separation of Powers',body:'EXECUTIVE POWER — President executes laws, commands military, conducts foreign policy, appoints officers.\nEXECUTIVE PRIVILEGE — President can withhold some communications (not absolute; yields to criminal proceedings).\n\nLEGISLATIVE POWER — Congress makes laws. Cannot delegate its core legislative function to executive branch without clear guidelines (non-delegation doctrine — rarely applied).\n\nJUDICIAL POWER — courts interpret laws and Constitution. Cannot issue advisory opinions. Must have a case or controversy.'},
  {type:'rule',label:'Constitutional Law — What to Check Every Time',body:'Step 1: Is there STATE ACTION? (Constitution limits government, not private parties)\nStep 2: Does the government have POWER to act? (enumerated power for Congress)\nStep 3: Does the action VIOLATE a constitutional right?\nStep 4: What LEVEL OF SCRUTINY applies?\nStep 5: Can the government JUSTIFY the action under that level of scrutiny?'},
 ],
 quiz:{q:'A private employer fires an employee for criticizing the company\'s policies. Does the First Amendment protect the employee?',
  choices:['A. Yes — free speech protects all speech','B. No — the First Amendment only limits government action','C. Yes — employers must respect free speech','D. No — employment speech is never protected'],
  correct:1,
  good:'Correct! The First Amendment restricts government action only — it does not apply to private employers. A private company can fire an employee for their speech without violating the Constitution. (Employment law and state law may provide separate protections.)',
  bad:'The answer is B. The First Amendment is a limit on GOVERNMENT — federal, state, and local. It does not apply to private actors like private employers. A private company can fire you for your speech without any constitutional violation.'}
},
// ── CRIMINAL LAW (20-24) ─────────────────────────────────────────────
{id:20,subject:'Criminal Law',level:1,title:'Elements of a Crime',icon:'🔒',
 eyebrow:'Year 1 · Criminal Law · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is Criminal Law?',body:'Criminal law is the government prosecuting someone for harming society. Unlike torts (you sue for money), the government brings criminal charges and the punishment is fines, probation, or prison.\n\nStandard of proof: BEYOND A REASONABLE DOUBT — much higher than civil law\'s preponderance (51%). The government must prove every element of the crime beyond a reasonable doubt.'},
  {type:'concept',label:'Elements of Every Crime',body:'1. ACTUS REUS — the guilty act. Must be a VOLUNTARY physical act. Reflexes and acts under hypnosis don\'t count. Omissions count only when there\'s a legal duty to act (parent/child, doctor/patient, created the danger).\n\n2. MENS REA — the guilty mind. Required for most crimes:\n   · PURPOSE/INTENT — conscious goal to bring about the result\n   · KNOWLEDGE — substantially certain the result will occur\n   · RECKLESSNESS — consciously disregards a substantial, unjustifiable risk\n   · NEGLIGENCE — should have been aware of the risk (lowest)\n\n3. CONCURRENCE — the mental state must exist at the same time as the act.\n\n4. CAUSATION — defendant\'s act must actually cause (but-for) and proximately cause the harm.'},
  {type:'rule',label:'Strict Liability Crimes',body:'Some crimes require NO mens rea — just the act. Common in:\n· Regulatory offenses (selling alcohol to minors, traffic violations, statutory rape)\n· Public welfare offenses\n\nStatutory rape is strictly liable as to age — even a reasonable, honest mistake about the victim\'s age is no defense.'},
  {type:'example',label:'Example',body:'Dan, a sleepwalker, gets up at night and punches his roommate while asleep.\n\nActus reus: Punching — but was it voluntary? Dan was sleepwalking — the act was involuntary. No actus reus. Dan is not criminally liable.\n\nIf Dan was a sleepwalker and took medication knowing it could cause violent sleepwalking — different story. His conscious choice to take the medication may supply the voluntary act.'},
 ],
 quiz:{q:'A driver has a sudden, unforeseeable seizure and runs over a pedestrian. Is the driver criminally liable for the harm?',
  choices:['A. Yes — the car caused the harm','B. No — no voluntary act during the seizure','C. Yes — drivers are strictly liable for accidents','D. No — only if the seizure was foreseeable'],
  correct:1,
  good:'Correct! During a seizure, the driver\'s actions are involuntary — there is no actus reus. Criminal liability requires a voluntary act. An unforeseeable seizure negates the voluntary act requirement. (If the driver knew they had seizures and drove anyway, the prior decision to drive could be the voluntary act.)',
  bad:'The answer is B. Criminal liability requires a voluntary act (actus reus). A sudden, unforeseeable seizure is an involuntary act. No voluntary act = no criminal liability. The driver may have civil liability under negligence, but not criminal liability.'}
},
{id:21,subject:'Criminal Law',level:1,title:'Homicide',icon:'🔒',
 eyebrow:'Year 1 · Criminal Law · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Types of Homicide',body:'MURDER — unlawful killing with MALICE AFORETHOUGHT. Malice is shown by:\n· Intent to kill\n· Intent to cause serious bodily harm\n· Depraved heart (extreme recklessness — "I don\'t care if they die")\n· Felony murder rule\n\nFIRST DEGREE MURDER — premeditated and deliberate killing, OR felony murder during enumerated dangerous felony.\n\nSECOND DEGREE MURDER — intentional killing without premeditation, or depraved heart killing.'},
  {type:'rule',label:'Felony Murder Rule',body:'If someone dies during the commission of a DANGEROUS FELONY, ALL participants in the felony are guilty of murder — even if they didn\'t intend the death and weren\'t present when it happened.\n\nEnumerated dangerous felonies: BARRK\n· Burglary\n· Arson\n· Robbery\n· Rape\n· Kidnapping\n\nLIMITS: Some states limit felony murder to foreseeable deaths, or exclude deaths caused by the victim defending themselves.'},
  {type:'concept',label:'Manslaughter',body:'VOLUNTARY MANSLAUGHTER — would be murder but reduced because of adequate provocation (heat of passion):\n· Must be adequate provocation (discovery of infidelity, serious assault)\n· Defendant must actually be provoked\n· No time to cool off\n· Actual cooling off invalidates the defense\n\nINVOLUNTARY MANSLAUGHTER — unintentional killing through:\n· Criminal negligence (gross deviation from reasonable care)\n· Unlawful act manslaughter (death during a non-dangerous misdemeanor)'},
  {type:'example',label:'Example',body:'Dan comes home and finds his wife in bed with his best friend. In a rage, he immediately grabs a lamp and kills the friend.\n\nThis would be first or second degree murder (intentional killing) but the sudden provocation (discovery of infidelity) reduces it to VOLUNTARY MANSLAUGHTER — if there was no cooling off period between the discovery and the killing.'},
 ],
 quiz:{q:'Three friends plan a robbery. During the robbery, Robber A shoots and kills a store clerk. Robber B was waiting outside as lookout and didn\'t know A had a gun. Is B liable for murder?',
  choices:['A. No — B didn\'t know about the gun','B. Yes — felony murder: all participants are liable for deaths during the robbery','C. No — B was outside and didn\'t participate in the killing','D. Yes, but only for manslaughter'],
  correct:1,
  good:'Correct! Felony murder holds all co-felons responsible for deaths that occur during a dangerous felony, regardless of their individual intent or knowledge. Robbery is an enumerated dangerous felony. B is guilty of murder even as the lookout.',
  bad:'The answer is B. The felony murder rule imposes murder liability on all participants in a dangerous felony when someone dies during the crime — even if they didn\'t pull the trigger, didn\'t know a weapon was present, and were far from the killing.'}
},
{id:22,subject:'Criminal Law',level:1,title:'Theft & Property Crimes',icon:'🔒',
 eyebrow:'Year 1 · Criminal Law · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Theft Crimes',body:'LARCENY — trespassory taking and carrying away of another\'s personal property with intent to permanently deprive. All elements must be present:\n· Taking — exercising control over property\n· Carrying away — even slight movement counts\n· Another\'s property — can\'t steal your own\n· Intent to permanently deprive — borrowing is not larceny\n\nROBBERY — larceny + force or threat of immediate force against the person. Aggravated robbery involves a weapon.\n\nEMBEZZLEMENT — fraudulent conversion of property lawfully entrusted to you. Different from larceny: you got the property lawfully.\n\nFALSE PRETENSES — obtaining title (ownership) to property by false representation of a present or past material fact. Victim voluntarily gives the property.\n\nFRAUD/LARCENY BY TRICK — obtaining possession (not title) by misrepresentation.'},
  {type:'concept',label:'Burglary & Arson',body:'BURGLARY (common law) — breaking and entering a DWELLING of another at NIGHTTIME with intent to commit a FELONY inside.\n· Modern statutes expand this: any building, any time\n· The breaking and entering can be minimal (opening an unlocked door)\n· Intent must exist at TIME OF ENTRY — can\'t form it after entering\n\nARSON — malicious burning of the dwelling of another.\n· Common law: must be an actual burning (charring) of a dwelling, at night, of another\n· Modern: any building, intentional or reckless burning'},
  {type:'rule',label:'Bar Exam Key: Larceny vs. Embezzlement vs. False Pretenses',body:'THE TRICK QUESTION: which crime was committed?\n\n· Employee takes money from employer\'s cash register = LARCENY (trespassory taking)\n· Accountant diverts client funds from their own hands = EMBEZZLEMENT (lawfully entrusted, then converted)\n· Seller lies about what they\'re selling and victim gives money over = FALSE PRETENSES (lie induces transfer of title)\n· Seller lies and victim gives money but seller never intended to deliver = LARCENY BY TRICK (possession, not title, obtained by fraud)'},
 ],
 quiz:{q:'Bank teller pockets $500 from the cash drawer at the end of her shift. What crime has she committed?',
  choices:['A. Larceny','B. Embezzlement','C. False pretenses','D. Robbery'],
  correct:1,
  good:'Correct! The bank teller was lawfully entrusted with the cash (it passed through her hands as part of her job), and she fraudulently converted it to her own use. That\'s embezzlement. Larceny requires a trespassory taking — she didn\'t take it trespassorily; it was given to her to handle.',
  bad:'The answer is B — embezzlement. The key distinction: larceny requires a trespassory taking. A bank teller is lawfully given custody of the cash as part of their job. When she converts it to her own use, that\'s embezzlement — misappropriation of lawfully entrusted property.'}
},
{id:23,subject:'Criminal Law',level:1,title:'Defenses',icon:'🔒',
 eyebrow:'Year 1 · Criminal Law · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Justification Defenses',body:'SELF-DEFENSE — can use reasonable force to protect yourself from imminent unlawful force.\n· Deadly force: only if facing death or serious bodily harm\n· Duty to retreat: minority of states require retreating if safe to do so (majority: no duty to retreat, stand your ground)\n· Aggressor cannot claim self-defense (unless they withdraw from the fight)\n\nDEFENSE OF OTHERS — same as self-defense, but protecting a third party. Majority rule: can defend if person being defended would have had the right to self-defense.\n\nDEFENSE OF PROPERTY — reasonable non-deadly force to protect property. NEVER deadly force just to protect property. (Spring gun rule — can\'t set a trap that uses deadly force against a trespasser.)'},
  {type:'concept',label:'Excuse Defenses',body:'INSANITY — not guilty by reason of insanity if defendant, at time of crime:\n· M\'NAGHTEN: didn\'t know the nature/quality of the act, OR didn\'t know it was wrong (majority)\n· IRRESISTIBLE IMPULSE: knew wrong but couldn\'t control themselves (some states)\n· MPC: lacked substantial capacity to appreciate criminality OR conform to law\n\nINTOXICATION:\n· Voluntary: only negates SPECIFIC INTENT (purpose/knowledge) — not general intent or recklessness\n· Involuntary: complete defense if negates any required mental state\n\nDURESS — another person threatened imminent death or serious bodily harm if defendant didn\'t commit the crime. NOT a defense to murder.\n\nNECESSITY — chose lesser evil to prevent greater harm. Objective, not subjective — the harm avoided must actually be greater.'},
  {type:'rule',label:'Mistake Defenses',body:'MISTAKE OF FACT — defendant was wrong about a fact that negates the required mental state:\n· Specific intent crimes: any honest mistake (reasonable or unreasonable) is a defense\n· General intent crimes: only REASONABLE mistakes are a defense\n\nMISTAKE OF LAW — "I didn\'t know it was illegal." Generally NOT a defense. Exceptions: reasonable reliance on official statement of law that turned out to be wrong.'},
 ],
 quiz:{q:'Dan is charged with stealing a watch. He says he took it believing it was his own (same model, dark parking lot). If true, is this a valid defense?',
  choices:['A. No — mistake of fact is never a defense to theft','B. Yes — a good-faith mistake of fact negates the intent to steal','C. No — he should have been more careful','D. Yes, but only if his mistake was reasonable'],
  correct:1,
  good:'Correct! Larceny requires intent to permanently deprive ANOTHER\'s property. If Dan genuinely believed the watch was his, he lacked the intent to steal. This mistake of fact — even if unreasonable — negates the specific intent required for larceny.',
  bad:'The answer is B. Larceny is a specific intent crime — intent to permanently deprive. A good-faith mistake of fact, even if unreasonable, negates specific intent. Dan thought he was taking his own watch — no intent to steal another\'s property.'}
},
{id:24,subject:'Criminal Law',level:1,title:'Inchoate Crimes & Parties',icon:'🔒',
 eyebrow:'Year 1 · Criminal Law · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'Inchoate Crimes — incomplete crimes',body:'ATTEMPT — defendant took a substantial step (more than mere preparation) toward committing a crime with intent to complete it.\n· Factual impossibility: no defense (tried to pickpocket an empty pocket — still attempt)\n· Legal impossibility: sometimes a defense (thought the act was a crime but it wasn\'t)\n· Abandonment: voluntary and complete abandonment before the act may be a defense in some states\n\nCONSPIRACY — agreement between two or more persons to commit a crime, plus an overt act in furtherance (majority rule).\n· Each conspirator is liable for all crimes committed by co-conspirators in furtherance of the conspiracy (Pinkerton liability)\n· Wharton\'s Rule: two parties who must participate in the crime cannot conspire (bigamy, adultery)\n\nSOLICITATION — requesting another person to commit a crime with intent that they commit it. The crime is complete upon asking.'},
  {type:'rule',label:'Merger Rules',body:'ATTEMPT merges into the completed crime — cannot be convicted of both attempt and the completed crime.\n\nSOLICITATION merges into attempt or the completed crime.\n\nCONSPIRACY does NOT merge — you can be convicted of both conspiracy and the completed crime. This is the most important merger rule on the bar exam.'},
  {type:'concept',label:'Parties to a Crime',body:'PRINCIPAL IN THE FIRST DEGREE — person who commits the crime\nPRINCIPAL IN THE SECOND DEGREE — present (actually or constructively) and aids/abets the crime\nACCESSORY BEFORE THE FACT — not present but helped plan or prepare\nACCESSORY AFTER THE FACT — helps the criminal AFTER the crime (harboring, hiding evidence)\n\nModern law: most states abolish distinctions — all parties except accessory after the fact are guilty as principals.'},
 ],
 quiz:{q:'Alex and Beth agree to rob a bank. Beth decides not to go through with it and tells Alex she\'s out. Alex robs the bank alone. Is Beth guilty of conspiracy?',
  choices:['A. No — she withdrew before the robbery','B. Yes — the conspiracy was complete when they agreed, withdrawal is not a full defense','C. No — she never committed the actual robbery','D. Yes, but only as an accessory'],
  correct:1,
  good:'Correct! Conspiracy is complete upon agreement (plus overt act). Withdrawal after the conspiracy is formed does not undo the conspiracy charge — Beth is still guilty of conspiracy. Withdrawal may limit liability for crimes committed AFTER withdrawal, but doesn\'t erase the conspiracy.',
  bad:'The answer is B. Conspiracy is complete at the moment of agreement (plus overt act). Beth cannot un-commit the conspiracy by withdrawing later. She remains guilty of conspiracy. Withdrawal may prevent liability for future crimes in furtherance, but the conspiracy charge stands.'}
},
// ── REAL PROPERTY (25-29) ────────────────────────────────────────────
{id:25,subject:'Real Property',level:1,title:'Estates in Land',icon:'🏡',
 eyebrow:'Year 1 · Real Property · Lesson 1 of 5',
 blocks:[
  {type:'concept',label:'What is Real Property?',body:'Real property is land and everything permanently attached to it — buildings, trees, minerals underground, airspace above. Property law governs who owns land, how it\'s transferred, what rights come with it, and what happens when people dispute it.'},
  {type:'concept',label:'Freehold Estates',body:'FEE SIMPLE ABSOLUTE — complete ownership, forever, no conditions. Can sell, give, or pass through a will. Most common. Language: "To A" or "To A and her heirs."\n\nFEE SIMPLE DEFEASIBLE — ownership that can end if a condition occurs:\n· FEE SIMPLE DETERMINABLE — ends AUTOMATICALLY if condition violated. Language: "so long as," "while," "during." Grantor keeps a possibility of reverter.\n· FEE SIMPLE SUBJECT TO CONDITION SUBSEQUENT — grantor has the RIGHT to take it back but must act. Language: "but if," "on condition that," "provided that." Grantor keeps a right of re-entry.\n· FEE SIMPLE SUBJECT TO EXECUTORY LIMITATION — upon violation, passes to a third party (not grantor).'},
  {type:'concept',label:'Life Estates & Future Interests',body:'LIFE ESTATE — ownership for the duration of a life. When that person dies, property goes to the remainder person (or back to grantor).\n· Life tenant can use the property but cannot commit WASTE (destroy its value)\n· Remainder = future interest in a third party\n· Reversion = future interest back in the grantor\n\nRAP (Rule Against Perpetuities) — a future interest must VEST, if at all, within a life in being plus 21 years. Destroys future interests that might not vest within that time.'},
