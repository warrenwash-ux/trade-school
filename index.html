  {type:'example',label:'Example',body:'"To my daughter Maria for life, then to my son Carlos."\n\nMaria has a LIFE ESTATE. Carlos has a REMAINDER (vested, since Carlos is alive and ascertainable). When Maria dies, Carlos (or his heirs) gets fee simple absolute.'},
 ],
 quiz:{q:'"To A, so long as the property is used as a school." A stops using it as a school. What happens?',
  choices:['A. Grantor can sue A for breach of contract','B. The property automatically reverts to the grantor','C. Grantor must go to court to reclaim the property','D. A can continue ownership with damages'],
  correct:1,
  good:'Correct! "So long as" language creates a Fee Simple Determinable — it ends AUTOMATICALLY when the condition is violated. No court action needed. The grantor retained a possibility of reverter, and the moment A stopped using the property as a school, ownership automatically shifted back.',
  bad:'The answer is B. "So long as" creates a Fee Simple Determinable — it ends automatically when the condition is violated. This is different from a Fee Simple Subject to Condition Subsequent (using "but if" language), where the grantor must affirmatively act to reclaim.'}
},
{id:26,subject:'Real Property',level:1,title:'Concurrent Ownership',icon:'🏡',
 eyebrow:'Year 1 · Real Property · Lesson 2 of 5',
 blocks:[
  {type:'concept',label:'Owning Property Together',body:'JOINT TENANCY — two or more people own equal shares with right of survivorship. When one owner dies, their share automatically passes to the surviving co-owners (not through a will).\n\nRequires the FOUR UNITIES at creation:\n· Time — interests created at same time\n· Title — from same instrument (same deed)\n· Interest — equal shares\n· Possession — same right to possess the whole\n\nAny joint tenant can SEVER the joint tenancy by selling or transferring their share — this converts their share to a tenancy in common.'},
  {type:'concept',label:'Tenancy in Common',body:'Each co-owner has a SEPARATE, ALIENABLE share. No survivorship — when one owner dies, their share passes through their estate (will or intestacy), not automatically to co-owners.\n\n· Shares can be unequal\n· No unity of time, title, or interest required\n· Any co-tenant can sell or mortgage their own share\n· DEFAULT: when two people own property together and nothing else is specified, assume tenancy in common\n\nTENANCY BY THE ENTIRETY — joint tenancy between married spouses. Neither spouse can unilaterally transfer or encumber the property. Creditors of one spouse cannot reach it.'},
  {type:'rule',label:'Rights and Duties of Co-Owners',body:'Each co-tenant has the right to possess and use the entire property.\n\nDUTY TO ACCOUNT — if one co-tenant collects rent from a third party, they must share with other co-tenants proportionally.\n\nOUSTER — if one co-tenant physically excludes another from the property, the excluded one can sue for their share of rental value.\n\nPARTITION — any co-tenant can force a division of the property:\n· Partition in kind: physically divide the land\n· Partition by sale: sell the property and split proceeds (preferred when division isn\'t practical)'},
 ],
 quiz:{q:'Ana and Bob own property as joint tenants. Ana sells her half to Carol without telling Bob. What is the ownership situation now?',
  choices:['A. Bob and Carol are joint tenants','B. Bob and Carol are tenants in common','C. Bob owns the whole property — Ana couldn\'t sell','D. Carol owns nothing — joint tenancy can\'t be severed'],
  correct:1,
  good:'Correct! Ana\'s sale to Carol severs the joint tenancy as to Ana\'s half — Carol gets a tenancy in common share. Bob still has his original joint tenant interest but now shares it with Carol as a tenant in common. Bob and Carol are tenants in common with equal shares.',
  bad:'The answer is B. When Ana sold her joint tenancy share to Carol, the joint tenancy was severed as to that share. Carol takes as a tenant in common. Bob and Carol are now tenants in common — no right of survivorship between them. Bob could not prevent Ana from selling.'}
},
{id:27,subject:'Real Property',level:1,title:'Adverse Possession & Easements',icon:'🏡',
 eyebrow:'Year 1 · Real Property · Lesson 3 of 5',
 blocks:[
  {type:'concept',label:'Adverse Possession',body:'You can acquire TITLE to land you don\'t own by possessing it openly for the statutory period. Think of it as: use someone\'s land long enough, and the law gives it to you.\n\nElements — OCEAN:\n· OPEN and notorious — visible possession; owner should know\n· CONTINUOUS — for the statutory period (usually 10-21 years)\n· EXCLUSIVE — not shared with the true owner\n· ACTUAL — physically using the land (farming, building, fencing)\n· NOTORIOUS/HOSTILE — without owner\'s permission; against owner\'s interest\n\nTACKING — you can add your predecessor\'s time to your own if there\'s privity (connected relationship).'},
  {type:'concept',label:'Easements',body:'An easement is the right to USE another\'s land for a specific purpose — you don\'t own the land, just the right to use it.\n\nEASEMENT APPURTENANT — benefits neighboring land (dominant estate) and burdens other land (servient estate). Runs with the land automatically when either parcel is sold.\n\nEASEMENT IN GROSS — benefits a person or company, not land. Utility easements are classic examples. Personal easements in gross are not transferable; commercial ones usually are.\n\nCREATION OF EASEMENTS:\n· Express grant (written deed)\n· Implication (prior use)\n· Necessity (landlocked parcel — must have access to public road)\n· Prescription (like adverse possession — open, continuous, hostile use for statutory period)'},
  {type:'rule',label:'Termination of Easements',body:'Easements can end by:\n· Release — easement holder gives it up in writing\n· Merger — dominant and servient estates come under same ownership\n· Abandonment — non-use PLUS intent to abandon (non-use alone is not enough)\n· Prescription — servient owner blocks easement use for statutory period\n· Estoppel — servient owner reasonably relies on easement holder\'s statement it won\'t be used'},
 ],
 quiz:{q:'For 15 years, Amy has been openly using a path across Bob\'s property to reach her house. She had no permission. The statutory period is 10 years. Does Amy have an easement?',
  choices:['A. No — she needed written permission','B. Yes — easement by prescription: open, hostile, continuous use for statutory period','C. No — only the government can create easements by use','D. Yes — but only as an easement in gross'],
  correct:1,
  good:'Correct! Easement by prescription is created by open, notorious, hostile (without permission), and continuous use for the statutory period. Amy meets all elements: 15 years (over the 10-year requirement), open and visible, no permission. She has an easement by prescription.',
  bad:'The answer is B. An easement by prescription is created just like adverse possession — open, notorious, hostile, and continuous use for the statutory period. Amy used the path for 15 years without permission. She has an easement by prescription.'}
},
{id:28,subject:'Real Property',level:1,title:'Landlord-Tenant Law',icon:'🏡',
 eyebrow:'Year 1 · Real Property · Lesson 4 of 5',
 blocks:[
  {type:'concept',label:'Types of Tenancy',body:'TENANCY FOR YEARS — fixed start and end date. Ends automatically when the term expires — no notice required. "Fixed term lease" of 1 year is tenancy for years.\n\nPERIODIC TENANCY — continues from period to period (month-to-month, week-to-week). Terminates only upon proper notice — usually one full period (month for month-to-month).\n\nTENANCY AT WILL — either party can end at any time. No specific term. Ends automatically if either party dies.\n\nTENANCY AT SUFFERANCE — holdover tenant: lease expired and tenant stays without permission. Landlord can:\n· Evict (treat as trespasser), OR\n· Bind tenant to a new lease (usually same terms, not to exceed one year)'},
  {type:'concept',label:'Landlord\'s Duties',body:'DUTY TO DELIVER POSSESSION — at start of lease, landlord must actually hand over possession (English rule — majority).\n\nIMPLIED WARRANTY OF HABITABILITY (residential leases) — landlord must maintain premises fit for human habitation. Cannot be waived.\n\nTenant remedies for breach:\n· Withhold rent\n· Repair and deduct\n· Terminate lease\n· Remain and sue for damages\n\nQUIET ENJOYMENT — tenant has right to use premises without interference from landlord. Constructive eviction: landlord\'s actions make premises uninhabitable — tenant can leave and stop paying rent.'},
  {type:'rule',label:'Tenant\'s Duties',body:'PAY RENT — obvious, but if premises become uninhabitable, duty to pay rent is suspended (IWH breach).\n\nNO WASTE:\n· Affirmative waste: actively damaging the property\n· Permissive waste: failing to make reasonable repairs (keep the property from deteriorating)\n· Ameliorative waste: changes that increase value but alter the property\'s character\n\nNO ASSIGNMENT without permission (if lease prohibits). Assignment: tenant transfers ALL remaining lease term to new person. Sublease: tenant transfers LESS than full remaining term.'},
 ],
 quiz:{q:'Tenant\'s month-to-month lease has been going for two years. Landlord wants the tenant out. How much notice is required?',
  choices:['A. No notice — landlord can evict at will','B. One full period — one month\'s notice','C. Two months — one month per year','D. 30 days only in writing'],
  correct:1,
  good:'Correct! A periodic tenancy (month-to-month) requires notice equal to one full period. For a month-to-month tenancy, that means one full month\'s notice. The length of time in the tenancy doesn\'t change the notice requirement.',
  bad:'The answer is B. Periodic tenancies require notice equal to one full period to terminate. Month-to-month = one month\'s notice. The fact that the tenancy has lasted two years is irrelevant to how much notice is required.'}
},
{id:29,subject:'Real Property',level:1,title:'Recording Acts & Mortgages',icon:'🏡',
 eyebrow:'Year 1 · Real Property · Lesson 5 of 5',
 blocks:[
  {type:'concept',label:'The Recording System',body:'When you buy land, you record your deed at the courthouse. This protects you against prior unrecorded interests.\n\nTHE PROBLEM: Seller sells same land to two buyers. Who wins?\n\nTHREE TYPES OF RECORDING ACTS:\n1. RACE STATUTE — first to RECORD wins, regardless of whether they knew about the other buyer. Pure race. (minority)\n\n2. NOTICE STATUTE — later buyer wins if they had NO NOTICE of the prior conveyance at time of purchase. Recording irrelevant. (minority)\n\n3. RACE-NOTICE STATUTE — later buyer wins if: (1) no notice of prior conveyance at time of purchase AND (2) records first. Must win the race AND be a BFP. (majority rule)'},
  {type:'rule',label:'Types of Notice',body:'ACTUAL NOTICE — buyer actually knows about the prior interest.\n\nCONSTRUCTIVE (RECORD) NOTICE — the interest is recorded in the chain of title. Buyer is charged with knowing what they would have found searching the records.\n\nINQUIRY NOTICE — facts on the ground that would make a reasonable person investigate further (visible improvements, someone else in possession of the land).'},
  {type:'concept',label:'Mortgages',body:'A mortgage is a security interest in real property — it gives the lender a claim on the property if the borrower doesn\'t pay.\n\nFORECLOSURE — if borrower defaults, lender can sell the property to pay the debt. Must give proper notice and follow state procedures.\n\nRIGHT OF REDEMPTION — borrower can reclaim property by paying the full debt:\n· Equitable right: exists until foreclosure sale\n· Statutory right: in some states, borrower can redeem even after the sale (for a period)\n\nDEFICIENCY JUDGMENT — if foreclosure sale doesn\'t cover the debt, lender can sue for the remainder. Some states limit this.'},
 ],
 quiz:{q:'Seller sells Blackacre to Buyer 1 on Jan 1. Buyer 1 doesn\'t record. Seller then sells Blackacre to Buyer 2 on Feb 1. Buyer 2 had no notice of Buyer 1. Buyer 2 records on Feb 2. Buyer 1 records on Feb 3. This is a race-notice jurisdiction. Who wins?',
  choices:['A. Buyer 1 — first in time, first in right','B. Buyer 2 — no notice of Buyer 1 and recorded first','C. Buyer 1 — eventually recorded','D. Neither — Seller committed fraud'],
  correct:1,
  good:'Correct! Race-notice statute: later buyer wins if (1) no notice of prior conveyance at time of purchase AND (2) records first. Buyer 2 had no notice (check) and recorded first on Feb 2 (check). Buyer 2 wins Blackacre.',
  bad:'The answer is B. Race-notice statute requires the later buyer to have NO NOTICE at time of purchase AND record before the prior buyer. Buyer 2 satisfied both: no notice of Buyer 1 when they bought, and they recorded first. Buyer 2 wins.'}
},
// ── LEGAL WRITING (30-32) ────────────────────────────────────────────
{id:30,subject:'Legal Writing',level:1,title:'IRAC Method',icon:'✍',
 eyebrow:'Year 1 · Legal Writing · Lesson 1 of 3',
 blocks:[
  {type:'concept',label:'The Only Way Lawyers Write',body:'Every bar essay, every legal memo, every court brief uses IRAC. Master this structure and you can answer any legal question on any subject. The bar exam rewards organized thinking above all else.\n\nI — ISSUE: What is the legal question?\nR — RULE: What is the rule of law that governs?\nA — APPLICATION: Apply the rule to these specific facts\nC — CONCLUSION: What is the outcome?'},
  {type:'illus',emoji:'❓ 📏 🔍 ✅',caption:'Issue identified → Rule stated → Rule applied to facts → Conclusion reached. Every time. No exceptions.'},
  {type:'example',label:'IRAC in action — complete example',body:'FACTS: Bob punched Dave at a party without any provocation.\n\nI: Is Bob liable to Dave for battery?\n\nR: Battery is the intentional harmful or offensive contact with the person of another. The defendant must intend the contact, and the contact must be harmful or offensive to a reasonable person.\n\nA: Bob intentionally threw a punch at Dave (satisfying intent). The punch connected with Dave\'s face (satisfying contact). A punch to the face is harmful and offensive to a reasonable person. Dave did not consent to the contact.\n\nC: Bob is liable to Dave for battery.\n\nNotice: every element of the rule is addressed in the application. That\'s where you score points.'},
  {type:'rule',label:'What Graders Are Looking For',body:'Bar exam essay graders are reading fast. They want to see:\n1. You spotted the right issue\n2. You stated the correct rule (not just "negligence" — spell out the elements)\n3. You applied the rule to THESE facts specifically (not generic)\n4. You reached a clear conclusion\n\nA clear, organized answer with incomplete knowledge beats a brilliant but disorganized answer. Structure wins the bar exam.'},
 ],
 quiz:{q:'An essay question asks whether a landlord is liable for injuries caused by a broken step in a rental unit. What is the first thing to write?',
  choices:['A. Your conclusion — start strong','B. The issue — what legal question does this raise?','C. All the facts — lay everything out first','D. Your opinion on whether the landlord is a good person'],
  correct:1,
  good:'Correct! IRAC starts with the ISSUE — the legal question presented by these facts. "The issue is whether the landlord breached the implied warranty of habitability by failing to repair the broken step, making them liable for the tenant\'s injuries." Then rule, then application, then conclusion.',
  bad:'The answer is B — start with the ISSUE. IRAC: Issue first. State the legal question these facts raise. Then the rule. Then apply the rule to the facts. Then conclude. Starting with your conclusion (C) is backwards and loses structure points.'}
},
{id:31,subject:'Legal Writing',level:1,title:'Essay Structure & Speed',icon:'✍',
 eyebrow:'Year 1 · Legal Writing · Lesson 2 of 3',
 blocks:[
  {type:'concept',label:'MEE Essay Timing Strategy',body:'You have 30 minutes per MEE essay. That\'s not much.\n\n· 5 minutes: Read the question. Identify ALL the issues.\n· 3 minutes: Brief outline — which issues, in what order\n· 20 minutes: Write using IRAC for each issue\n· 2 minutes: Quick review\n\nTIP: Finish every issue. A partial answer on 3 issues beats a perfect answer on 1 issue. Graders give points for each issue spotted and addressed.'},
  {type:'rule',label:'Crossover Issues',body:'MEE questions often involve MULTIPLE subjects — Contracts + Torts, Property + Constitutional Law, etc.\n\nTHE TRICK: Spot all the issues. Don\'t assume it\'s just about the most obvious subject.\n\nEXAMPLE: "A contractor builds a faulty deck and someone falls through." Issues might include:\n· Contract (breach of contract between homeowner and contractor)\n· Tort (negligence — duty, breach, causation, damages)\n· Products liability (if the materials were defective)'},
  {type:'concept',label:'Writing Style for Law',body:'PRECISION: Every legal word matters. "Can" is different from "must." "Shall" is mandatory. "May" is permissive.\n\nHEADERS: Use clear headers for each issue. Graders skim — headers tell them where they are.\n\nACTIVE VOICE: "The defendant breached the duty" not "A breach of duty was found to have been committed by the defendant."\n\nDEFINE EVERY TERM: Don\'t assume the grader knows what "consideration" means — define it, then apply it.\n\nAVOID CONCLUSIONS WITHOUT REASONING: Never just say "This is battery." Say why each element is or isn\'t met.'},
 ],
 quiz:{q:'An MEE essay raises issues of negligence, contract breach, and battery. You have 30 minutes. You write a perfect negligence analysis and run out of time. What score do you likely get?',
  choices:['A. A high score — quality beats quantity','B. A low score — you missed two of three issues','C. Full credit — the grader appreciates thoroughness','D. Partial credit only for negligence — still worth doing'],
  correct:1,
  good:'Correct! Bar exam essays are graded on ISSUE COVERAGE. Spotting and addressing each issue (even briefly) earns more points than perfecting one issue and missing others. A complete-but-brief IRAC on all three issues scores higher than a perfect answer on one.',
  bad:'The answer is B. Bar exam essays reward issue coverage and breadth. Missing two out of three issues — even with a perfect analysis of the third — results in a low score. The strategy is to briefly address every issue rather than exhaustively analyze just one.'}
},
{id:32,subject:'Legal Writing',level:1,title:'MPT — Performance Test',icon:'✍',
 eyebrow:'Year 1 · Legal Writing · Lesson 3 of 3',
 blocks:[
  {type:'concept',label:'What the MPT Is',body:'The Multistate Performance Test (MPT) gives you a FAKE CASE FILE — everything you need is in the file. No outside knowledge required. They\'re testing whether you can think and write like a practicing lawyer.\n\nThe file contains:\n· A memo from your supervising attorney explaining what they want\n· A library: cases, statutes, regulations relevant to the issue\n· A file: facts, client interview, documents\n\nYou have 90 minutes. Read the task first (what does the attorney want?), then skim the library and file for what\'s relevant, then write.'},
  {type:'concept',label:'Common MPT Task Types',body:'1. OBJECTIVE MEMO — analyze both sides fairly, predict how a court would rule. Do NOT argue one side.\n   Structure: Issue → Rule (from the library cases/statutes) → Analysis of both sides → Conclusion\n\n2. PERSUASIVE BRIEF — argue one side only. Be an advocate.\n   Structure: Facts → Legal argument using library materials → Why client should win\n\n3. CLIENT LETTER — explain the legal situation in plain English. No jargon. Clear advice.\n\n4. CONTRACT/AGREEMENT DRAFTING — draft a clause or agreement using provided template and facts.'},
  {type:'rule',label:'MPT Strategy',body:'CRITICAL: Use only materials from the file. Do not bring in outside law — you might be wrong and it definitely goes against instructions.\n\nQUOTE the library cases and statutes directly — the file\'s law IS the law for this exercise.\n\nFOLLOW THE FORMAT requested. If they want an objective memo, don\'t write a brief. If they want a client letter, don\'t write a memo. Format points are easy points.\n\nORGANIZATION: Clear headers, numbered sections. Graders are reading fast.'},
 ],
 quiz:{q:'In an MPT task, you remember a case from your bar prep that\'s directly on point, but it\'s not in the provided library. Should you use it?',
  choices:['A. Yes — it strengthens your argument','B. No — use only materials provided in the file','C. Yes, but acknowledge it may not apply','D. Only if the library cases don\'t answer the question'],
  correct:1,
  good:'Correct! MPT is a closed-universe exercise. You use only what\'s in the file. Using outside law — even if you\'re right — can hurt your score because it shows you didn\'t follow instructions. The file IS the law for this exercise.',
  bad:'The answer is B. The MPT is a closed-universe exercise. Everything you need is in the file. Using outside materials — even correct ones — violates the task instructions. Graders are testing whether you can work from provided materials, not test your memory.'}
},
// ── EVIDENCE (33-35) ─────────────────────────────────────────────────
{id:33,subject:'Evidence',level:2,title:'Relevance & Character',icon:'🔍',
 eyebrow:'Year 2 · Evidence · Lesson 1 of 3',
 blocks:[
  {type:'concept',label:'Relevance — the gateway to admissibility',body:'Only relevant evidence is admissible. Relevant = tends to make a fact of consequence more or less probable than it would be without the evidence.\n\nEven relevant evidence can be EXCLUDED if:\n· Unfair prejudice substantially outweighs probative value (Rule 403)\n· Confusion of issues\n· Misleading the jury\n· Undue delay, waste of time, needless cumulative evidence'},
  {type:'concept',label:'Character Evidence',body:'Generally INADMISSIBLE to prove conforming conduct (can\'t prove "he\'s a bad guy therefore he did this bad thing").\n\nEXCEPTIONS:\n· Criminal defendant can offer own good character (opens the door for prosecution to rebut)\n· Character of the victim in criminal cases (self-defense claims)\n· Sexual assault/child molestation cases — prior acts almost always admissible\n\nMIMIC RULE (Rule 404(b)) — prior bad acts ARE admissible to show:\n· Motive\n· Intent\n· Mistake (absence of)\n· Identity\n· Common scheme or plan'},
  {type:'rule',label:'Habit vs. Character',body:'CHARACTER: tendency to be a certain type of person. Generally inadmissible.\n\nHABIT: regular response to a specific situation. ADMISSIBLE to show the person acted in conformity with the habit.\n\nExample: "John always stops at that stop sign" = habit (admissible). "John is a careful driver" = character (inadmissible to prove he stopped).'},
 ],
 quiz:{q:'In a drug trial, prosecutor wants to admit evidence that defendant was convicted of drug dealing 5 years ago. Is it admissible?',
  choices:['A. No — prior crimes are never admissible','B. Yes — to show knowledge or intent under the MIMIC rule','C. No — too old to be relevant','D. Yes — character evidence is always admissible in criminal cases'],
  correct:1,
  good:'Correct! Prior drug dealing conviction can be admitted under Rule 404(b) — the MIMIC rule — to show knowledge or intent. It\'s not admitted to prove "he\'s a drug dealer therefore he did it" (impermissible character evidence) but rather to prove he knew what he was doing (knowledge/intent).',
  bad:'The answer is B. Prior crimes are excluded as character evidence — but the MIMIC rule provides an exception. Prior drug convictions can show the defendant had knowledge of drug operations or intent to deal. It comes in for that specific purpose, not to show general bad character.'}
},
{id:34,subject:'Evidence',level:2,title:'Hearsay',icon:'🔍',
 eyebrow:'Year 2 · Evidence · Lesson 2 of 3',
 blocks:[
  {type:'concept',label:'What is Hearsay?',body:'HEARSAY = an out-of-court statement offered to prove the TRUTH of the matter asserted.\n\nAll three elements must be present:\n1. OUT-OF-COURT — made outside of this trial\n2. STATEMENT — oral, written, or assertive conduct\n3. OFFERED TO PROVE THE TRUTH — offered to establish that what was said is actually true\n\nNOT HEARSAY (doesn\'t meet all three elements):\n· Verbal acts ("I accept your offer" — words that create the contract, not offered for truth)\n· Effect on listener (to show what someone heard/knew, not that it was true)\n· Prior inconsistent statements made under oath (used to impeach)\n· Party admissions — anything an opposing party said is NOT hearsay (by definition under FRE 801(d)(2))'},
  {type:'rule',label:'Hearsay Exceptions — Availability Doesn\'t Matter',body:'PRESENT SENSE IMPRESSION — statement made while perceiving an event or immediately after ("That car is running the red light!")\n\nEXCITED UTTERANCE — statement made under stress of excitement from a startling event ("He had a knife!")\n\nTHEN-EXISTING MENTAL OR PHYSICAL CONDITION — "I feel sick" / "I intend to go to the store" — shows present state of mind\n\nSTATEMENTS FOR MEDICAL DIAGNOSIS — statements made to doctors for purpose of diagnosis or treatment\n\nBUSINESS RECORDS — records made in regular course of business, at time of event, by someone with knowledge. Highly reliable. Must be custodian to lay foundation.\n\nPUBLIC RECORDS — government records of activities and observations'},
  {type:'rule',label:'Hearsay Exceptions — Declarant Must Be Unavailable',body:'FORMER TESTIMONY — testified at prior proceeding, under oath, with opportunity to cross-examine\n\nDYING DECLARATION — statement made under belief of imminent death, about the cause of that death. Admissible in homicide cases and civil cases.\n\nSTATEMENT AGAINST INTEREST — statement so against the declarant\'s interest (financial, criminal exposure) that they wouldn\'t make it unless true\n\nFORFEITURE BY WRONGDOING — defendant caused declarant\'s unavailability (killed the witness) → forfeits hearsay objection'},
 ],
 quiz:{q:'Witness testifies: "The victim told me right before she died, \'John stabbed me.\'" Is this admissible?',
  choices:['A. Yes — it is not hearsay','B. No — classic hearsay, no exception','C. Yes — dying declaration exception','D. Only if the victim is unavailable and it was a civil case'],
  correct:2,
  good:'Correct! A dying declaration is an exception to hearsay. Requirements: (1) declarant believed death was imminent, (2) statement concerned the cause of death. Admissible in homicide cases. If the victim believed she was dying when she said this, it comes in.',
  bad:'The answer is C. This is hearsay (out-of-court statement offered to prove John stabbed her) but qualifies as a dying declaration exception: made under belief of imminent death, about the cause of that death. Admissible in homicide prosecutions.'}
},
{id:35,subject:'Evidence',level:2,title:'Witnesses & Privileges',icon:'🔍',
 eyebrow:'Year 2 · Evidence · Lesson 3 of 3',
 blocks:[
  {type:'concept',label:'Witnesses',body:'COMPETENCY — witnesses must: have personal knowledge, take an oath, and be able to communicate. Virtually anyone can testify.\n\nIMPEACHMENT — attacking a witness\'s credibility:\n· Prior inconsistent statements\n· Bias or motive to lie\n· Prior convictions (felonies, crimes of dishonesty)\n· Bad reputation for truthfulness\n· Contradiction\n\nEXPERT WITNESSES — can testify to opinions based on specialized knowledge. Must be qualified. Opinion must be based on sufficient facts, reliable methods, and applied reliably to the case.'},
  {type:'concept',label:'Privileges',body:'ATTORNEY-CLIENT PRIVILEGE — confidential communications between attorney and client, made for the purpose of obtaining legal advice. Client holds the privilege. Very broad — covers pre-representation consultations.\n\nSPOUSAL PRIVILEGE — two separate privileges:\n1. Testimonial privilege: one spouse cannot be FORCED to testify against the other in a criminal case. Holder: the witness spouse (can waive).\n2. Confidential communications: protects private communications between spouses. Survives divorce.\n\nDOCTOR-PATIENT — confidential communications for treatment. Not recognized in federal courts.\n\nPRIEST-PENITENT — confidential communications for spiritual counseling.\n\nCRIME-FRAUD EXCEPTION — no privilege if attorney\'s help was sought to commit a crime or fraud.'},
  {type:'rule',label:'Best Evidence Rule',body:'To prove the content of a writing, recording, or photograph, you must produce the original (or an acceptable duplicate) unless it\'s unavailable for a legitimate reason.\n\nDoes NOT mean best evidence must be used generally — only applies when you\'re trying to prove what the document said.\n\nExample: If you want to prove what a contract said, produce the contract. Don\'t just have a witness describe it from memory.'},
 ],
 quiz:{q:'Client tells her attorney that she hid the murder weapon in her garage. Attorney says nothing to police. Is this privileged?',
  choices:['A. No — attorney must report evidence of a crime','B. Yes — this is a confidential attorney-client communication','C. No — the crime-fraud exception applies','D. Yes, but attorney must retrieve the weapon'],
  correct:1,
  good:'Correct! Attorney-client privilege protects confidential communications between client and attorney made for the purpose of obtaining legal representation — including admissions of past crimes. The attorney cannot be forced to disclose this. The crime-fraud exception applies only to FUTURE crimes the client is seeking help to commit.',
  bad:'The answer is B. Attorney-client privilege protects this communication. The client is telling the attorney about a past act — where the weapon is. This is protected. The crime-fraud exception applies when the client seeks the attorney\'s help in committing a FUTURE crime, not when confessing a past one.'}
},
// ── ETHICS (36-37) ───────────────────────────────────────────────────
{id:36,subject:'Professional Ethics',level:2,title:'Duties to Clients',icon:'🎓',
 eyebrow:'Year 2 · Professional Ethics · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'Core Duties Every Lawyer Owes',body:'COMPETENCE — provide legal services with the skill, thoroughness, and preparation reasonably necessary for the representation. A lawyer can become competent through necessary study — but must do so without unreasonable risk to the client.\n\nCOMMUNICATION — keep the client reasonably informed. Promptly respond to requests for information. Explain things so the client can make informed decisions.\n\nCONFIDENTIALITY — never reveal client information without consent. BROADER than privilege — covers everything related to the representation, not just attorney-client communications.\n\nLOYALTY — avoid conflicts of interest. Client\'s interests come first.'},
  {type:'rule',label:'Exceptions to Confidentiality',body:'A lawyer MAY reveal confidential information (but is not required unless noted):\n· To prevent death or substantial bodily harm (permissive)\n· To prevent client crime or fraud using lawyer\'s services (permissive)\n· To secure legal ethics advice\n· To defend against client\'s malpractice claim\n· When ordered by court\n\nA lawyer MUST reveal:\n· To prevent certain perjury (client lies on the stand — lawyer must take reasonable remedial measures including disclosure to tribunal)'},
  {type:'concept',label:'Conflicts of Interest',body:'CONCURRENT CONFLICTS — representing two clients with adverse interests. GENERALLY PROHIBITED unless:\n1. Conflict is not severe (lawyer reasonably believes they can represent both)\n2. Informed written consent from BOTH clients\n\nFORMER CLIENT CONFLICTS — cannot represent someone in a substantially related matter against a former client without former client\'s informed written consent.\n\nPERSONAL INTEREST CONFLICTS — lawyer\'s own interest interferes. Cannot: enter into business transaction with client without full disclosure, written fair terms, and advice to get independent counsel.'},
 ],
 quiz:{q:'Lawyer represents both the driver and passenger injured in a car accident. The insurance company can only pay one large claim. Is this a conflict of interest?',
  choices:['A. No — they\'re on the same side against the other driver','B. Yes — their interests are adverse (one may get more money at the expense of the other)','C. No — conflicts only arise between opposing parties','D. Yes, but only if they ask for different amounts'],
  correct:1,
  good:'Correct! Even though both clients are suing the same defendant, their interests are adverse to each other — there\'s only one pot of money and each client wants as much as possible. This is a concurrent conflict of interest. The lawyer cannot represent both unless both give informed written consent.',
  bad:'The answer is B. A conflict exists whenever representation of one client is directly adverse to another — even when both are on the same "side" of a lawsuit. Here, both clients compete for the same limited insurance funds. This is a conflict requiring informed written consent from both or separate representation.'}
},
{id:37,subject:'Professional Ethics',level:2,title:'Duties to Court & Fees',icon:'🎓',
 eyebrow:'Year 2 · Professional Ethics · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'Duties to the Tribunal',body:'CANDOR — lawyers must be honest with courts:\n· Never make false statements of law or fact\n· Never offer evidence lawyer knows is false\n· If client offers false testimony (perjury), lawyer must take remedial measures: try to persuade client to correct, withdraw, or disclose to court\n\nFAIRNESS TO OPPOSING PARTY — don\'t hide evidence, don\'t obstruct justice, don\'t make frivolous arguments.\n\nNO EX PARTE COMMUNICATIONS — lawyers cannot communicate with the judge without the other side being present or notified.\n\nNO FRIVOLOUS CLAIMS — must have a non-frivolous basis in law and fact for every claim asserted.'},
  {type:'concept',label:'Fees',body:'FEES MUST BE REASONABLE — factors: time required, novelty/difficulty, skill needed, exclusion of other work, geographic location, amount at stake, results obtained.\n\nCONTINGENT FEES — lawyer gets percentage of recovery if they win. PROHIBITED in:\n· Criminal cases\n· Family law (divorce/custody)\nMust be in writing, state the percentage, and describe how expenses are handled.\n\nFEE SPLITTING — between lawyers from different firms: client must consent in writing, total fee must be reasonable, each lawyer takes responsibility for the representation.'},
  {type:'rule',label:'Advertising & Solicitation',body:'ADVERTISING — permitted if truthful and not misleading. Must say "Attorney Advertising." Cannot claim to be an expert unless certified by an accredited organization.\n\nDIRECT SOLICITATION — cannot directly contact a prospective client in person or by phone for money if the person hasn\'t asked for legal services. Exceptions: family, close friends, prior professional relationship.\n\nWRITTEN SOLICITATION — allowed but must be marked "Advertising Material." Cannot be targeted at people known to be vulnerable (accident victims in the hospital).'},
 ],
 quiz:{q:'Client tells her lawyer she intends to lie on the stand tomorrow. What must the lawyer do?',
  choices:['A. Nothing — attorney-client privilege prevents any action','B. Try to dissuade client, and if that fails, take remedial measures including possible disclosure','C. Withdraw from the case immediately','D. Allow the client to testify — the lawyer cannot control what the client says'],
  correct:1,
  good:'Correct! When a lawyer knows a client intends to commit perjury, they must: (1) try to persuade the client not to, (2) if that fails, consider withdrawal, (3) if withdrawal isn\'t possible or permitted, the lawyer must take reasonable remedial measures — which can include disclosing to the tribunal. Confidentiality yields to the duty of candor.',
  bad:'The answer is B. Knowing a client plans to commit perjury requires action. The lawyer must first try to dissuade the client. If unsuccessful, the lawyer must take reasonable remedial measures. The duty of candor to the tribunal overrides confidentiality when the client is about to commit perjury.'}
},
// ── FAMILY LAW (38-39) ───────────────────────────────────────────────
{id:38,subject:'Family Law',level:2,title:'Marriage & Divorce',icon:'👨‍👩‍👧',
 eyebrow:'Year 2 · Family Law · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'Marriage Requirements',body:'VALID MARRIAGE requires:\n· Capacity — both parties of legal age and of sound mind\n· No existing valid marriage (bigamy is void, not voidable)\n· Not too closely related (consanguinity limits)\n· Consent — free and voluntary (no fraud, duress)\n· Compliance with state formalities (license, ceremony, officiant in most states)\n\nCOMMON LAW MARRIAGE — recognized in ~10 states: couple holds themselves out as married, cohabits, and intends to be married. No ceremony. Creates a valid marriage that must be dissolved by divorce.\n\nVOID vs. VOIDABLE:\n· Void (never valid): bigamy, incest\n· Voidable (can be challenged): fraud, duress, mental incapacity'},
  {type:'concept',label:'Divorce',body:'NO-FAULT DIVORCE — irreconcilable differences; incompatibility. No need to prove wrongdoing. All states now allow no-fault divorce.\n\nFAULT GROUNDS — adultery, cruelty, desertion, imprisonment. Still relevant in some states for:\n· Property division (fault may affect equitable distribution)\n· Alimony (fault may bar alimony for the spouse at fault)\n\nALIMONY (SPOUSAL SUPPORT):\n· Purpose: allow lower-earning spouse to maintain reasonable standard of living\n· Factors: length of marriage, standard of living, earning capacity, contributions to marriage\n· Terminates: death, remarriage (usually), sometimes cohabitation\n· Modifiable upon change in circumstances'},
  {type:'rule',label:'Property Division',body:'COMMUNITY PROPERTY (9 states: CA, TX, AZ, NV, WA, ID, LA, NM, WI) — property acquired during marriage is owned equally by both spouses and split 50/50 on divorce. Separate property (pre-marriage, gifts, inheritance) stays with the recipient spouse.\n\nEQUITABLE DISTRIBUTION (majority rule) — court divides marital property fairly, considering:\n· Length of marriage\n· Contributions of each spouse\n· Economic circumstances\n· Fault (in some states)\n\nNot always 50/50 — equitable means fair, not equal.'},
 ],
 quiz:{q:'Husband and wife live in a community property state. Wife owned a house before the marriage. During the marriage, they paid down the mortgage using joint income. On divorce, how is the house treated?',
  choices:['A. Entirely wife\'s separate property','B. Entirely marital property — split 50/50','C. Separate property, but the mortgage paydown from marital funds may give husband a community interest','D. Husband gets half because he contributed to payments'],
  correct:2,
  good:'Correct! The house is wife\'s separate property (acquired before marriage). However, mortgage payments made with community funds during the marriage create a community property interest in the equity paid down. The house isn\'t fully split 50/50, but husband may have a claim to the portion paid with joint funds.',
  bad:'The answer is C. The house started as wife\'s separate property. But mortgage payments made from community property (joint income) during the marriage give the community an interest in the home — specifically the equity those payments generated. The house isn\'t entirely separate or entirely community.'}
},
{id:39,subject:'Family Law',level:2,title:'Custody & Child Support',icon:'👨‍👩‍👧',
 eyebrow:'Year 2 · Family Law · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'Child Custody',body:'BEST INTERESTS OF THE CHILD — the only standard. Courts consider:\n· Child\'s age and adjustment\n· Parent\'s physical and mental health\n· Quality of relationship with each parent\n· Stability and continuity\n· Child\'s preference (if old enough)\n· History of domestic violence\n\nTYPES OF CUSTODY:\n· Legal custody — who makes major decisions (education, healthcare, religion)\n· Physical custody — where the child lives\n· Joint custody — parents share legal custody, physical custody, or both\n\nMODIFICATION — requires showing of SUBSTANTIAL CHANGE IN CIRCUMSTANCES since last order. Courts are reluctant to modify custody constantly.'},
  {type:'rule',label:'Child Support',body:'BOTH PARENTS must support their children financially regardless of custody arrangements or their relationship with each other.\n\nCALCULATED based on both parents\' income, child\'s needs, and state guidelines.\n\nCANNOT BE WAIVED by parents — it belongs to the child. Parents cannot agree to eliminate child support.\n\nMODIFICATION — allowed when circumstances change substantially (income change, child\'s needs change).\n\nTERMINATION — typically at age 18 (or graduation), or earlier emancipation.\n\nUNIFORM INTERSTATE FAMILY SUPPORT ACT (UIFSA) — prevents multiple states from issuing conflicting support orders. The state that issued the original order retains jurisdiction to modify while a party or child still lives there.'},
  {type:'concept',label:'Termination of Parental Rights',body:'A court can permanently terminate parental rights only upon clear and convincing evidence of:\n· Abuse or neglect\n· Abandonment\n· Failure to maintain a relationship\n· Parental unfitness (substance abuse, mental illness)\n\nTermination is the most severe action and requires a high burden of proof. It is a prerequisite to adoption.'},
 ],
 quiz:{q:'Parents divorce and agree that neither will pay child support. Can the court enforce this agreement?',
  choices:['A. Yes — parents have freedom to contract','B. No — child support belongs to the child and cannot be waived by parents','C. Yes — if both parents agree in writing','D. No — only the state can waive child support'],
  correct:1,
  good:'Correct! Child support belongs to the CHILD, not the parents. Parents cannot contractually eliminate it — their agreement is unenforceable. A court will impose child support based on the applicable guidelines regardless of what the parents agreed to.',
  bad:'The answer is B. Child support is the child\'s right — not the parents\'. Parents cannot waive it by agreement. Even if both parents agree to no support, a court will not enforce that agreement. Support will be set based on state guidelines.'}
},
// ── WILLS & TRUSTS (40-41) ───────────────────────────────────────────
{id:40,subject:'Wills & Trusts',level:2,title:'Wills & Intestacy',icon:'📜',
 eyebrow:'Year 2 · Wills & Trusts · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'Dying Without a Will — Intestacy',body:'If you die without a valid will, state intestacy laws decide who gets your property:\n\n· Surviving spouse + children: spouse gets a share (varies by state); children split the rest\n· No spouse: children take all equally per capita\n· No children: parents, then siblings, then extended family by degree\n· No relatives: property escheats (goes) to the state\n\nHALF-BLOODS: take equally with full-bloods in most states\nADOPTED CHILDREN: treated same as biological children\nNON-MARITAL CHILDREN: inherit from mother; inherit from father if paternity established'},
  {type:'concept',label:'Valid Will Requirements',body:'ATTESTED (WITNESSED) WILL — valid in all states:\n· Testamentary capacity: 18+, of sound mind (knows nature of making a will, knows the natural objects of their bounty, knows the nature and extent of their property)\n· Testamentary intent: intends THIS document to operate as a will\n· In writing and signed by testator\n· Signed by TWO witnesses who watched the testator sign\n\nHOLOGRAPHIC WILL — handwritten and signed entirely by testator. No witnesses required. Recognized in most (not all) states.\n\nORAL WILL (nuncupative) — valid only in very limited circumstances (soldiers in battle, etc.) in a few states.'},
  {type:'rule',label:'Will Problems',body:'REVOCATION — a will can be revoked by:\n· Physical act (burning, tearing, destroying) with intent to revoke\n· Writing (new will or codicil that revokes the old one)\n· Operation of law (divorce automatically revokes provisions for ex-spouse in most states)\n\nADEMPTION — a specific gift fails if the property no longer exists at testator\'s death ("I give my Honda Civic to Bob" — but testator sold the Civic)\n\nLAPSE — a gift fails if the beneficiary dies before the testator. Anti-lapse statutes (most states): if a close relative predeceases, their share passes to THEIR descendants.'},
 ],
 quiz:{q:'A will leaves "$10,000 to my Toyota Camry" to the testator\'s nephew. The testator sold the Camry before death. What does nephew receive under the will?',
  choices:['A. The cash proceeds from the car sale','B. Nothing — the gift has adeemed','C. A comparable car','D. $10,000 from the estate'],
  correct:1,
  good:'Correct! Ademption: a specific bequest (of a particular item) fails if the item no longer exists at death. The gift of the Toyota Camry adeems — it\'s gone, so the nephew gets nothing from the will for that gift. (Some states give the proceeds from the sale, but the classic rule is ademption = nothing.)',
  bad:'The answer is B. Ademption applies to specific bequests — gifts of a particular item. When the testator sold the Toyota Camry, that specific item no longer existed at death. The gift adeems — nephew gets nothing for that bequest under the traditional rule.'}
},
{id:41,subject:'Wills & Trusts',level:2,title:'Trusts',icon:'📜',
 eyebrow:'Year 2 · Wills & Trusts · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'What is a Trust?',body:'A trust splits ownership: the TRUSTEE holds legal title and manages the property for the benefit of the BENEFICIARY, who holds equitable title.\n\nRequirements (STRICT):\n1. SETTLOR with capacity to create the trust\n2. INTENT to create a trust (precatory words like "I hope" aren\'t enough)\n3. TRUST PROPERTY (res) — must exist\n4. ASCERTAINABLE BENEFICIARY — must be identifiable\n5. VALID TRUST PURPOSE — not illegal, not violating public policy\n6. TRUSTEE — always someone; courts will appoint one if named trustee refuses'},
  {type:'concept',label:'Types of Trusts',body:'REVOCABLE LIVING TRUST — settlor creates during lifetime, can change or end it any time. Avoids probate (doesn\'t go through will process), but NOT protected from creditors.\n\nIRREVOCABLE TRUST — cannot be changed once created. Provides asset protection and potential tax benefits. Property is no longer "yours."\n\nTESTAMENTARY TRUST — created by a will, takes effect at death. Goes through probate.\n\nCHARITABLE TRUST — no specific beneficiaries — benefits the public/a cause. Cy pres doctrine: if charitable purpose fails, court redirects assets to a similar charitable purpose rather than letting trust fail.\n\nSPENDTHRIFT TRUST — beneficiary cannot transfer their interest and creditors cannot reach it directly.'},
  {type:'rule',label:'Trustee\'s Duties',body:'DUTY OF LOYALTY — no self-dealing. All decisions made for beneficiaries\' benefit, not trustee\'s own.\n\nPRUDENT INVESTOR RULE — must invest as a prudent investor would (diversification required, risk-adjusted returns).\n\nDUTY OF IMPARTIALITY — balance the interests of income beneficiaries (want current returns) and remainder beneficiaries (want long-term growth).\n\nDUTY TO ACCOUNT — keep accurate records and provide regular accountings to beneficiaries.\n\nDUTY NOT TO DELEGATE — cannot hand off core trustee functions (but may delegate investment management to professionals).'},
 ],
 quiz:{q:'A trustee invests all trust assets in her own company\'s stock. The investment performs well. Has she violated her duties?',
  choices:['A. No — the investment was profitable','B. Yes — self-dealing violates the duty of loyalty regardless of outcome','C. No — profitability is the only test','D. Yes, but only if she knew the stock would go up'],
  correct:1,
  good:'Correct! The duty of loyalty prohibits self-dealing regardless of outcome. Investing trust assets in the trustee\'s own company is a classic breach of the duty of loyalty — it doesn\'t matter that it was profitable. The trustee must act solely in the beneficiaries\' interest, not her own.',
  bad:'The answer is B. Self-dealing violates the duty of loyalty regardless of whether the investment performed well. The rule is prophylactic — it prevents conflicts of interest by prohibiting self-dealing transactions entirely, not just bad ones. Good outcomes don\'t excuse the breach.'}
},
// ── BUSINESS ORGS (42-43) ────────────────────────────────────────────
{id:42,subject:'Business Organizations',level:2,title:'Agency & Partnerships',icon:'🏢',
 eyebrow:'Year 2 · Business Organizations · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'Agency Law',body:'An AGENT acts on behalf of a PRINCIPAL. The principal is bound by the agent\'s acts within the scope of authority.\n\nACTUAL AUTHORITY — principal expressly authorized the act (express) or it\'s implied from context (implied)\nAPPARENT AUTHORITY — third party reasonably believes agent has authority based on principal\'s conduct or representations\nRATIFICATION — principal adopts an unauthorized act after the fact (must know all material facts)\n\nLIABILITY: If agent acts within authority, principal is liable. If agent acts outside authority without ratification, agent is personally liable.'},
  {type:'concept',label:'Partnerships',body:'GENERAL PARTNERSHIP — all partners are equally liable for ALL partnership debts with their personal assets. No formalities required — just co-owning a business for profit creates a general partnership.\n\nPartner owes duties to the partnership:\n· Duty of loyalty (no self-dealing, no competing)\n· Duty of care (act as a reasonably prudent person)\n\nLIMITED PARTNERSHIP (LP) — has general partners (manage, unlimited liability) AND limited partners (invest only, limited liability — cannot participate in management or lose limited liability protection).\n\nLIMITED LIABILITY PARTNERSHIP (LLP) — all partners get limited liability. Used by law firms, accounting firms. Must register with the state.'},
 ],
 quiz:{q:'Partner A enters a contract on behalf of the partnership without the other partners\' knowledge. The contract is for a normal business purpose. Are the other partners bound?',
  choices:['A. No — they didn\'t authorize it','B. Yes — each partner has apparent authority to bind the partnership for normal business','C. No — requires written authorization','D. Yes, but only if the partnership benefits'],
  correct:1,
  good:'Correct! In a general partnership, each partner has apparent authority to bind the partnership for transactions in the ordinary course of business. Third parties can rely on a partner\'s authority. The other partners are bound even if they didn\'t know or agree.',
  bad:'The answer is B. Each general partner has apparent authority to bind the partnership in the ordinary course of business. Third parties dealing with the partnership can rely on a partner\'s authority. The other partners are liable even without express authorization.'}
},
{id:43,subject:'Business Organizations',level:2,title:'Corporations & LLCs',icon:'🏢',
 eyebrow:'Year 2 · Business Organizations · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'Corporations',body:'FORMATION — file articles of incorporation with the state. Upon filing, corporation is a legal entity separate from its owners.\n\nLIMITED LIABILITY — shareholders are NOT personally liable for corporate debts. They can only lose their investment.\n\nFIDUCIARY DUTIES of directors and officers:\n· DUTY OF CARE — act as a reasonably prudent person in a similar position. Make informed decisions.\n· DUTY OF LOYALTY — put corporation\'s interests first. No self-dealing without disclosure and shareholder approval.\n\nBUSINESS JUDGMENT RULE — courts will not second-guess good-faith business decisions made on an informed basis. Directors are protected as long as they were informed, acted in good faith, and had a rational business purpose.'},
  {type:'rule',label:'Piercing the Corporate Veil',body:'Courts can hold SHAREHOLDERS personally liable despite limited liability when:\n1. Corporation is an ALTER EGO of its shareholders (commingling personal and corporate funds, ignoring corporate formalities)\n2. Corporation was used to commit FRAUD\n3. UNDERCAPITALIZATION — corporation was formed without adequate capital to meet foreseeable obligations\n\nThis is the EXCEPTION, not the rule. Courts pierce reluctantly.'},
  {type:'concept',label:'Limited Liability Companies (LLCs)',body:'Best of both worlds:\n· LIMITED LIABILITY of a corporation (members not personally liable)\n· PASS-THROUGH TAXATION of a partnership (profits taxed once, at member level — no corporate double taxation)\n· FLEXIBLE MANAGEMENT — members manage directly, or appoint managers\n· Governed by OPERATING AGREEMENT — the key document\n\nLLC MEMBER DUTIES — same loyalty and care duties as partners in a partnership unless operating agreement modifies them.'},
 ],
 quiz:{q:'A one-person LLC owner uses the business bank account to pay personal bills, never holds meetings, and mixes business and personal assets freely. If the LLC is sued, what might happen?',
  choices:['A. Nothing — LLC protects against all personal liability','B. The corporate veil may be pierced — owner treated as personally liable','C. Owner is only liable up to their investment','D. Owner is liable only if they committed fraud'],
  correct:1,
  good:'Correct! When an LLC member treats the LLC as an alter ego — commingling funds, ignoring formalities, making no distinction between personal and business assets — courts may pierce the veil and hold the member personally liable. The whole point of an LLC requires treating it as a separate entity.',
  bad:'The answer is B. The alter ego doctrine allows courts to pierce the LLC veil when the member treats the entity as their personal checkbook — no separation of finances, no formalities, complete disregard for the entity\'s separate existence. The member loses limited liability protection.'}
},
// ── CRIMINAL PROCEDURE (44-45) ───────────────────────────────────────
{id:44,subject:'Criminal Procedure',level:2,title:'4th Amendment & Exclusionary Rule',icon:'🛡',
 eyebrow:'Year 2 · Criminal Procedure · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'4th Amendment — Search & Seizure',body:'Police need a WARRANT to search, backed by probable cause and particularity (must describe place to be searched and things to be seized).\n\nA SEARCH occurs when police invade a reasonable expectation of privacy (Katz test).\nA SEIZURE occurs when a reasonable person would not feel free to leave.\n\nWARRANTLESS SEARCHES ARE VALID when:\n· SEARCH INCIDENT TO ARREST — person arrested and area within immediate control\n· AUTOMOBILE EXCEPTION — probable cause to believe contraband in vehicle\n· PLAIN VIEW — officer lawfully present and immediately apparent contraband visible\n· EXIGENT CIRCUMSTANCES — emergency, hot pursuit, imminent evidence destruction\n· CONSENT — voluntary, from person with authority (can be withdrawn)\n· TERRY STOP — reasonable articulable suspicion → brief detention + pat-down for weapons only'},
  {type:'rule',label:'Exclusionary Rule & Exceptions',body:'Evidence obtained in violation of 4th Amendment is EXCLUDED at trial. (Mapp v. Ohio)\nFRUIT OF THE POISONOUS TREE — evidence derived from an illegal search is also excluded.\n\nEXCEPTIONS (evidence comes in despite violation):\n· GOOD FAITH — officer reasonably relied on a facially valid warrant that turned out to be defective\n· INDEPENDENT SOURCE — evidence discovered through a separate lawful investigation\n· INEVITABLE DISCOVERY — evidence would have been found anyway through lawful means\n· ATTENUATION — connection between the violation and the evidence has weakened (time, intervening events)'},
 ],
 quiz:{q:'Officer pulls over a car for speeding. While writing the ticket, she smells marijuana. She searches the car and finds drugs. Is the search valid?',
  choices:['A. No — she only had authority to write a ticket','B. Yes — smell of marijuana gives probable cause; automobile exception applies','C. No — warrant required even for cars','D. Yes, but only if driver consented'],
  correct:1,
  good:'Correct! The smell of marijuana provides probable cause to believe contraband is present in the vehicle. The automobile exception allows police to search a vehicle without a warrant when they have probable cause to believe it contains contraband. The search is valid.',
  bad:'The answer is B. The automobile exception: police can search a vehicle without a warrant when they have probable cause to believe it contains contraband or evidence of a crime. The smell of marijuana supplies that probable cause. Valid search.'}
},
{id:45,subject:'Criminal Procedure',level:2,title:'5th & 6th Amendments',icon:'🛡',
 eyebrow:'Year 2 · Criminal Procedure · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'5th Amendment — Miranda',body:'No person shall be compelled to be a witness against themselves.\n\nMIRANDA WARNINGS required before CUSTODIAL INTERROGATION:\n· You have the right to remain silent\n· Anything you say can be used against you in court\n· You have the right to an attorney\n· If you cannot afford one, one will be appointed\n\nCUSTODY = reasonable person would not feel free to leave\nINTERROGATION = express questioning or its functional equivalent (words/actions police know are likely to elicit a response)\n\nWAIVER — suspect can waive Miranda rights (must be knowing, voluntary, and intelligent)\nINVOKE — must be UNAMBIGUOUS. If invoked: (1) right to silence → questioning must cease; (2) right to counsel → questioning must cease until counsel present'},
  {type:'rule',label:'6th Amendment — Right to Counsel',body:'Right to counsel attaches at the start of FORMAL PROCEEDINGS (indictment, arraignment, preliminary hearing).\n\nAttaches to all CRITICAL STAGES: arraignment, preliminary hearings, trial, sentencing, first appeal.\n\nDoes NOT attach before formal charges: initial questioning, lineup before charges, grand jury.\n\nINEFFECTIVE ASSISTANCE (Strickland test):\n1. Counsel\'s performance was DEFICIENT (fell below reasonable professional standard)\n2. PREJUDICE — reasonable probability that but for the deficiency, the outcome would have been different'},
  {type:'concept',label:'Double Jeopardy',body:'Cannot be tried twice for the same offense after:\n· Acquittal, OR\n· Conviction\n\nATTACHES when the jury is sworn in (or in a bench trial, when the first witness is sworn).\n\nEXCEPTIONS:\n· DUAL SOVEREIGNTY — state and federal government can both prosecute for the same conduct (different sovereigns)\n· MISTRIAL for manifest necessity (hung jury) — can retry\n· HUNG JURY — can retry\n\nSAME OFFENSE: Two crimes are the "same offense" for double jeopardy if each does not require proof of an element the other does not (Blockburger test).'},
 ],
 quiz:{q:'Police arrest a suspect and begin questioning without reading Miranda warnings. The suspect confesses. At trial, the prosecution wants to use the confession. Is it admissible?',
  choices:['A. Yes — confessions are always admissible','B. No — Miranda warnings required before custodial interrogation','C. Yes — if the confession was voluntary','D. No — all post-arrest statements are inadmissible'],
  correct:1,
  good:'Correct! Miranda warnings are required before custodial interrogation. The suspect was in custody (arrested) and interrogated (questioned). Without the warnings, the confession was obtained in violation of Miranda and must be excluded. Voluntary alone is not enough without Miranda compliance.',
  bad:'The answer is B. Custodial interrogation without Miranda warnings = inadmissible confession. The arrest puts the suspect in custody. The questioning is interrogation. Miranda warnings were required. Without them, the confession is excluded from trial.'}
},
// ── CONFLICT OF LAWS (46-47) ─────────────────────────────────────────
{id:46,subject:'Conflict of Laws',level:2,title:'Choice of Law',icon:'🗺',
 eyebrow:'Year 2 · Conflict of Laws · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'When States Disagree',body:'When a legal dispute involves parties or events from multiple states, courts must decide WHICH STATE\'S LAW APPLIES. This is conflict of laws — also called "choice of law."\n\nExample: Texas driver hits a Florida driver in Georgia. All three states have different negligence rules. Which state\'s law governs?'},
  {type:'concept',label:'Choice of Law Approaches',body:'TRADITIONAL (First Restatement) — rigid territorial rules:\n· TORTS: law of the state where the INJURY OCCURRED (lex loci delicti)\n· CONTRACTS: law of the state where the CONTRACT WAS MADE\n· PROPERTY: law of the state where the PROPERTY IS LOCATED (always)\n\nMODERN — MOST SIGNIFICANT RELATIONSHIP (Second Restatement — majority):\n· Apply law of the state with the most significant contacts to the issue\n· Factors: place of injury, place of conduct, domicile of parties, place of relationship centered\n\nGOVERNMENTAL INTEREST ANALYSIS — apply law of the state with the strongest interest in the outcome of this particular issue'},
  {type:'rule',label:'Party Autonomy in Contracts',body:'Parties can often CHOOSE which state\'s law governs their contract by including a choice of law clause. Enforceable if:\n· The chosen state has a reasonable relationship to the contract, AND\n· Applying chosen state\'s law doesn\'t violate fundamental public policy of the forum state\n\nExample: "This agreement shall be governed by the laws of Delaware." Common in business contracts.'},
 ],
 quiz:{q:'A contract between parties from New York and California was signed in Texas and includes a clause saying "governed by Texas law." Is this clause enforceable?',
  choices:['A. No — parties cannot choose their own law','B. Yes — if Texas has a reasonable relationship and no public policy violation','C. No — must use the law where the contract was signed','D. Yes — always enforceable if parties agree'],
  correct:1,
  good:'Correct! Choice of law clauses in contracts are generally enforceable if the chosen state has a reasonable relationship to the transaction (Texas is where they signed — that\'s a connection) and applying Texas law doesn\'t violate a fundamental public policy of the forum state.',
  bad:'The answer is B. Parties generally have autonomy to choose which state\'s law governs their contract. Courts enforce choice of law clauses when the chosen state has a reasonable relationship to the parties or transaction, and applying that law doesn\'t violate fundamental public policy.'}
},
{id:47,subject:'Conflict of Laws',level:2,title:'Full Faith & Credit & Domicile',icon:'🗺',
 eyebrow:'Year 2 · Conflict of Laws · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'Full Faith and Credit',body:'Article IV, Section 1: States must give FULL FAITH AND CREDIT to the judicial proceedings of other states.\n\nPRACTICAL MEANING: Once a case is FINALLY decided in one state, other states must recognize and enforce that judgment.\n\nYou CANNOT re-litigate a case that was finally decided in another state.\n\nEXCEPTIONS (state need not recognize):\n· Forum state had no jurisdiction (personal or subject matter)\n· Judgment obtained by fraud\n· Penal judgments (fines paid to another state\'s government)\n\nAPPLIES TO: civil judgments, divorce decrees, custody orders (with modifications)'},
  {type:'concept',label:'Domicile',body:'DOMICILE = where you live with the INTENT TO REMAIN indefinitely. You can only have ONE domicile at a time.\n\nPhysical presence + intent to make it your home = domicile.\n\nDomicile affects:\n· DIVERSITY JURISDICTION (what state are you "from"?)\n· INHERITANCE (which state\'s law governs your estate?)\n· DIVORCE (which state can grant it?)\n· VOTING AND JURY DUTY\n\nYou keep your old domicile until you establish a new one (presence + intent in the new state).'},
  {type:'rule',label:'Interstate Recognition of Same-Sex Marriage',body:'After Obergefell v. Hodges (2015), same-sex marriage is a constitutional right nationwide. All states must recognize same-sex marriages performed in other states — this is both a constitutional requirement and a full faith and credit issue.'},
 ],
 quiz:{q:'Plaintiff wins a $500,000 judgment against defendant in California. Defendant moves to Texas and refuses to pay. Plaintiff tries to collect in Texas. Must Texas enforce the California judgment?',
  choices:['A. No — Texas can ignore other states\' judgments','B. Yes — Full Faith and Credit requires enforcement','C. No — only federal courts enforce out-of-state judgments','D. Yes, but only if Texas would have reached the same result'],
  correct:1,
  good:'Correct! Full Faith and Credit: states must recognize and enforce final judgments of other states\' courts. California\'s final judgment against defendant must be enforced by Texas. Defendant cannot re-litigate the case in Texas.',
  bad:'The answer is B. The Full Faith and Credit Clause requires each state to honor the judicial proceedings of other states. Texas must enforce the California judgment. Defendant cannot escape liability simply by moving to another state.'}
},
// ── BAR EXAM PREP (48-49) ────────────────────────────────────────────
{id:48,subject:'Bar Exam Prep',level:3,title:'MBE Strategy',icon:'📋',
 eyebrow:'Bar Exam Prep · Lesson 1 of 2',
 blocks:[
  {type:'concept',label:'The MBE — What You\'re Facing',body:'200 multiple choice questions across two sessions of 100 questions each. You have approximately 1.8 minutes per question. The exam is designed to trick you — wrong answers are deliberately close to right answers.\n\n7 subjects: Contracts/Sales, Torts, Civil Procedure, Constitutional Law, Criminal Law & Procedure, Evidence, Real Property. Each subject has roughly the same weight.'},
  {type:'rule',label:'Answering MBE Questions — The Method',body:'STEP 1: Read the CALL OF THE QUESTION first (the last sentence asking what you must determine). This tells you what issue to look for.\n\nSTEP 2: Read the fact pattern carefully. Every word is intentional. Juries are reasonable people. Pay attention to which jurisdiction, which standard, which relationship.\n\nSTEP 3: Identify the legal issue and rule before looking at answers.\n\nSTEP 4: Eliminate clearly wrong answers (2 are usually clearly wrong).\n\nSTEP 5: Between the final two — pick the answer with the correct legal rule applied correctly. The examiners hide the correct answer by making the wrong answer seem reasonable.'},
  {type:'concept',label:'MBE Traps to Avoid',body:'· DISTRACTOR FACTS — not every fact matters. Don\'t let irrelevant details derail you.\n· ATTRACTIVE WRONG ANSWERS — often state a true rule but apply it to the wrong issue\n· "NEVER" AND "ALWAYS" — extreme answers are rarely correct\n· MODERN VS. COMMON LAW — the question may specify one; know both\n· UCC vs. COMMON LAW — watch for whether the item is a good or a service\n· FIRST INSTINCT — don\'t change your answer unless you have a definite reason'},
  {type:'warn',label:'Timing is a skill',body:'Practice under timed conditions before the exam. Running out of time and guessing the last 30 questions is fatal. Practice sprints of 10 questions in 18 minutes. Build the speed BEFORE exam day.'},
 ],
 quiz:{q:'You\'re 1.5 minutes into a question and stuck between two answers. What should you do?',
  choices:['A. Skip it and come back — even if you run out of time','B. Pick your best answer, mark it for review, and move on — never leave it blank','C. Spend as much time as needed — one question could mean passing','D. Always pick C when stuck — statistically common correct answer'],
  correct:1,
  good:'Correct! Never leave a question blank on the MBE — there\'s no penalty for wrong answers. Make your best guess, mark it for review, and move on. Spending too long on one question costs you time on easier questions ahead.',
  bad:'The answer is B. Never leave an MBE question blank — no penalty for wrong answers, and a guess has a 25% chance of being right. Mark your best answer, flag it for review if time permits, and keep moving. Time management is critical.'}
},
{id:49,subject:'Bar Exam Prep',level:3,title:'Essay & Exam Day Strategy',icon:'✍',
 eyebrow:'Bar Exam Prep · Lesson 2 of 2',
 blocks:[
  {type:'concept',label:'MEE Essay Strategy',body:'6 essays, 30 minutes each. Any bar-tested subject can appear.\n\nTHE STRATEGY:\n1. Read the call of the question first (what do they want?)\n2. Read the facts — underline parties and key facts\n3. Outline: list every issue you see (2-3 minutes)\n4. Write using IRAC for each issue\n5. Move on — don\'t perfect one, miss others\n\nISSUE SPOTTING IS HALF THE BATTLE: You get points for identifying the right issues. Even a partial analysis of a spotted issue earns more than a perfect analysis of a missed issue.'},
  {type:'rule',label:'What MEE Graders Look For',body:'· Issue identification — did you find the right question(s)?\n· Rule statement — did you state the correct rule clearly?\n· Application to THESE facts — not generic law, but THIS situation\n· Organized structure — IRAC headers, clean paragraphs\n· Definite conclusion — pick a side; "it depends" loses points\n\nGRADERS READ FAST. Clear headers and organized IRAC make it easy to give you points. Dense paragraphs with buried analysis make it easy to miss.'},
  {type:'concept',label:'Exam Day Logistics',body:'BEFORE:\n· Know the exact location — do a dry run if possible\n· Confirm your admission ticket, ID requirements\n· Sleep the night before matters less than you think — what matters is the months before\n\nDURING:\n· Don\'t read others\' answers at breaks — shake off each session\n· Eat real food at the lunch break\n· Don\'t discuss questions at breaks — anxiety is contagious\n· If a question goes badly, it\'s done. Focus on the next one.\n\nAFTER:\n· Don\'t compare answers with others. Nothing productive comes from it.\n· Results take weeks — have something to do. Don\'t wait by your phone.'},
  {type:'rule',label:'You Are Ready',body:'If you have completed every lesson in this academy, you have been exposed to every rule, doctrine, and tested concept on the UBE. You know the law. The bar exam is not testing intelligence — it\'s testing preparation and organization.\n\nWrite the rule. Apply it to the facts. Reach a conclusion. Do that 200 times for MBE and 6 times for MEE. Pass the bar exam.\n\nYou are ready.'},
 ],
 quiz:{q:'You finish an MEE essay with a great analysis of negligence — but you notice with 5 minutes left that you missed a battery issue. What do you do?',
  choices:['A. Ignore it — your negligence analysis is solid','B. Quickly add a brief IRAC on battery using the remaining time','C. Cross out part of the negligence analysis to make room','D. Write "See battery issue" and explain you ran out of time'],
  correct:1,
  good:'Correct! Any issue spotted and briefly analyzed earns points. A quick IRAC on battery — even 4-5 sentences — earns more than leaving it blank. Don\'t cross out solid work. Add the battery analysis and let both analyses stand.',
  bad:'The answer is B. Issue coverage is critical on the MEE. A brief but organized IRAC on the battery issue earns points — don\'t leave it blank. Use your remaining time to add the missing analysis. Even a short, correctly structured IRAC scores better than nothing.'}
}
];
const CURRICULUM_PROPERTY = [
{num:1,title:'Real Estate Foundations',desc:'What real estate is, how it works, and why it builds more wealth than almost anything else',
lessons:[
{id:'1-1',title:'What Is Real Estate & Why Does It Build Wealth?',sub:'Starting from absolute zero — what real estate is and why it matters',
terms:[
  {w:'Real Estate',d:'Land and everything permanently attached to it — buildings, structures, trees, and anything built into the ground.',x:'A house is real estate. An apartment building is real estate. A parking lot is real estate. Your car is NOT real estate.'},
  {w:'Personal Property',d:'Everything that is NOT real estate — movable items not permanently attached to land or a building.',x:'Furniture, cars, computers, clothing = personal property. Built-in cabinets, a house, a barn = real estate.'},
],
teach:[
  {n:1,t:'Real estate is land plus everything attached to it',x:'Real estate includes: the land itself, any buildings on it, anything permanently built into those buildings (plumbing, electrical, built-in appliances), and trees and plants. The legal term is "real property." It\'s different from "personal property" which includes movable items like furniture or cars.'},
  {n:2,t:'Four ways real estate builds wealth simultaneously',x:'Unlike stocks or bonds, real estate builds wealth four ways at once: (1) <strong>Cash flow</strong> — rental income exceeds expenses, putting money in your pocket monthly. (2) <strong>Appreciation</strong> — the property increases in value over time. (3) <strong>Equity buildup</strong> — your tenant\'s rent payments pay down your mortgage, increasing your ownership. (4) <strong>Tax benefits</strong> — depreciation deductions, mortgage interest deductions, and 1031 exchanges reduce your tax burden.'},
  {n:3,t:'Real estate is one of the oldest wealth-building tools in human history',x:'Land has been a source of wealth for thousands of years. In modern America, real estate is how most millionaires built their wealth. Studies consistently show that real estate investors accumulate more wealth than people who only invest in stocks — primarily because of leverage (using borrowed money to control a much larger asset) and the four simultaneous wealth-building forces.'},
  {n:4,t:'You do not need to be rich to start',x:'The biggest myth in real estate is that you need a lot of money to begin. FHA loans allow you to buy an owner-occupied property with just 3.5% down. On a $150,000 property that\'s $5,250. Many investors start with house hacking — buying a small multi-unit, living in one unit, and having tenants pay most or all of the mortgage. <strong>You can build a real estate portfolio starting with almost nothing if you know the right strategies.</strong>'},
],
analogy:'Real estate wealth is like planting a fruit tree. You plant it (buy the property), it gives you fruit every season (rental income = cash flow), the tree itself grows bigger and more valuable each year (appreciation), and the roots spread deeper (equity building). Tax benefits are like getting paid to water the tree. One tree can eventually fund the purchase of the next tree — and so on.',
quiz:{q:'Which of the following best describes the four ways real estate builds wealth simultaneously?',
choices:['Price appreciation only — real estate just goes up in value','Cash flow, appreciation, equity buildup, and tax benefits — four forces working together at the same time','Only tax benefits matter — real estate is mainly a tax shelter','Cash flow and appreciation only — equity and taxes don\'t matter much'],
correct:1,explain:'Real estate\'s power comes from four simultaneous forces: (1) Cash flow from rents. (2) Appreciation as the property gains value. (3) Equity buildup as tenants\' rent pays down your mortgage. (4) Tax benefits including depreciation and interest deductions. <strong>No other common investment gives you all four at once.</strong>',lesson:'Real estate\'s wealth-building power comes from multiple forces working simultaneously. One rental property can generate income, appreciate, build equity, AND reduce your tax bill — all at the same time.'}
},
{id:'1-2',title:'Types of Real Estate — Every Category Explained',sub:'Residential, commercial, industrial, land — what each means',
terms:[
  {w:'Residential Real Estate',d:'Properties designed for people to live in. Includes single-family homes, condos, townhomes, and multi-family buildings up to 4 units.',x:'A single-family house, a duplex, a condo unit, or a 4-plex are all residential real estate.'},
  {w:'Commercial Real Estate',d:'Properties used for business purposes. Includes office buildings, retail stores, strip malls, and multi-family buildings with 5+ units.',x:'A strip mall, office building, hotel, or apartment complex with 20 units = commercial real estate.'},
  {w:'Single-Family Home',d:'A standalone residential building designed for one household. The most common type of property in the US.',x:'The classic house with a yard, one front door, one family — that\'s a single-family home.'},
  {w:'Multi-Family Property',d:'A building containing multiple separate housing units. Duplexes (2 units), triplexes (3), fourplexes (4) are residential. 5+ units = commercial.',x:'Buy a duplex: two separate apartments in one building. You can live in one and rent the other.'},
],
teach:[
  {n:1,t:'Residential real estate — where most investors start',x:'Residential properties are for people to live in: single-family homes, condos, townhomes, duplexes (2 units), triplexes (3 units), and fourplexes (4 units). Properties with 1-4 units are classified as residential for lending purposes, meaning you can get favorable homeowner mortgage rates even as an investor. <strong>This is why most beginners start with 1-4 unit properties.</strong>'},
  {n:2,t:'Commercial real estate — bigger deals, different rules',x:'Commercial properties include: office buildings, retail centers, strip malls, industrial warehouses, hotels, and any apartment complex with 5 or more units. Commercial properties are valued differently than residential (based on income, not comparable sales) and require commercial loans which typically demand 25-35% down payment. <strong>Higher barrier to entry but often more stable, long-term income.</strong>'},
  {n:3,t:'Industrial real estate — warehouses and manufacturing',x:'Industrial properties include warehouses, distribution centers, manufacturing facilities, and flex spaces. Amazon\'s warehouses, FedEx distribution centers, and car manufacturing plants are all industrial real estate. Industrial has been one of the best-performing real estate sectors in recent years due to e-commerce growth.'},
  {n:4,t:'Land — raw and undeveloped',x:'Vacant land can be residential (a lot to build a house on), commercial (land for a shopping center), agricultural (farmland), or industrial. Land investing is different — it produces no income and costs money to hold (taxes), but can appreciate significantly when development arrives nearby. Requires a long-term horizon.'},
],
analogy:'Real estate types are like different kinds of businesses. Residential = apartments above a bakery (people need homes like they need food — steady, reliable demand). Commercial = a business district (higher rent, more complex, larger scale). Industrial = a factory (specialized, essential to the supply chain). Land = an empty lot (no income today, but may be worth much more when the city grows around it).',
quiz:{q:'A building with 6 separate apartment units is what type of real estate and why does the classification matter?',
choices:['Residential — because people live there','Commercial — because 5+ units crosses the threshold from residential to commercial for lending and valuation purposes','Industrial — because it has multiple units','It doesn\'t matter — all properties are financed the same way'],
