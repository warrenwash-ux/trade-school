/* =====================================================================
   TRACK REGISTRY — normalizes all four sources into one shape:
   track.modules[] -> {num,title,lessons:[{id,title,sub,schema,...}]}
   ===================================================================== */
function groupBarBySubject(lessons){
  const order = []; const map = {};
  lessons.forEach(l=>{
    if(!map[l.subject]){ map[l.subject]=[]; order.push(l.subject); }
    map[l.subject].push(l);
  });
  return order.map((subj,i)=>({
    num:i+1, title:subj,
    desc:'Year '+(map[subj][0].level||1)+' subject',
    lessons: map[subj].map(l=>({id:'bar-'+l.id, title:l.title, sub:l.eyebrow||'', schema:'blocks', blocks:l.blocks, quiz:l.quiz}))
  }));
}

function kingsModules(curriculum){
  return curriculum.map(m=>({
    num:m.num, title:m.title, desc:m.desc,
    lessons:(m.lessons||[]).map(l=>({id:l.id, title:l.title, sub:l.sub||'', schema:'kings', terms:l.terms, teach:l.teach, analogy:l.analogy, quiz:l.quiz}))
  }));
}

// Investiq dedup: 'candles' track is fully redundant with Market Kings'
// Module 2 (Candlestick Patterns). Two 'day' lessons duplicate Market
// Kings 1-2 / 1-3 and are dropped; everything else is genuinely new
// content (Forex, ETFs, Options, and the rest of Day Trading) and is
// folded in as additional modules, unmodified.
const INVESTIQ_INCLUDE = ['day','forex','etf','options'];
const INVESTIQ_NAMES = {day:'Day Trading', forex:'Forex Trading', etf:'ETF Investing', options:'Options Basics'};
const INVESTIQ_EXCLUDE_LESSONS = { day: new Set(['How to Read a Stock Chart','Support & Resistance']) };

function investiqModules(startNum){
  const mods = [];
  let num = startNum;
  INVESTIQ_INCLUDE.forEach(key=>{
    const t = TRACKS_INVESTIQ_RAW[key];
    if(!t) return;
    const skip = INVESTIQ_EXCLUDE_LESSONS[key] || new Set();
    const lessons = t.lessons.filter(l=>!skip.has(l.title)).map((l,i)=>({
      id:'inv-'+key+'-'+i, title:l.title, sub:(l.duration||'')+' read', schema:'raw', raw:l.content
    }));
    if(lessons.length){
      num++;
      mods.push({num, title:INVESTIQ_NAMES[key]||t.name, desc:t.sub||'', lessons});
    }
  });
  return mods;
}

/* =====================================================================
   PROGRESS (localStorage now, Supabase-sync-ready later: swap the
   load/save functions below for API calls without touching render code)
   ===================================================================== */
const PROGRESS_KEY = 'appacademy_progress_v1';
const LAST_KEY = 'appacademy_last_v1';
const START_KEY = 'appacademy_started_v1';

function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(p){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
function isDone(trackKey, lessonId){ const p=loadProgress(); return !!(p[trackKey] && p[trackKey][lessonId]); }
function markDone(trackKey, lessonId){
  const p=loadProgress();
  if(!p[trackKey]) p[trackKey]={};
  if(!p[trackKey][lessonId]){
    p[trackKey][lessonId]=Date.now();
    saveProgress(p);
    bumpStreak();
  }
}
function trackDoneCount(trackKey){
  const p=loadProgress()[trackKey]||{};
  return TRACKS[trackKey].flat.filter(l=>p[l.id]).length;
}
function setLast(trackKey, lessonId){ localStorage.setItem(LAST_KEY, JSON.stringify({trackKey,lessonId})); }
function getLast(){ try{ return JSON.parse(localStorage.getItem(LAST_KEY)); }catch(e){ return null; } }

function bumpStreak(){
  const today = new Date().toDateString();
  let s;
  try{ s = JSON.parse(localStorage.getItem(START_KEY)); }catch(e){ s=null; }
  if(!s) s = {days:[], count:0};
  if(s.days[s.days.length-1] !== today){
    s.days.push(today);
    s.count = (s.count||0) + 1;
  }
  localStorage.setItem(START_KEY, JSON.stringify(s));
}
function getStreak(){
  try{ const s = JSON.parse(localStorage.getItem(START_KEY)); return s ? s.count : 0; }catch(e){ return 0; }
}
function getXP(){
  let total = 0;
  TRACK_ORDER.forEach(k=> total += trackDoneCount(k) * 25);
  return total;
}

function firstIncomplete(trackKey){
  const t = TRACKS[trackKey];
  const p = loadProgress()[trackKey]||{};
  return t.flat.find(l=>!p[l.id]) || t.flat[0];
}

function renderDashboard(){
  refreshNavStats();
  let totalDone=0, totalLessons=0;
  TRACK_ORDER.forEach(k=>{
    if(TRACKS[k].comingSoon) return;
    totalDone += trackDoneCount(k);
    totalLessons += TRACKS[k].flat.length;
  });
  const overallPct = totalLessons ? Math.round(totalDone/totalLessons*100) : 0;
  const activeTracks = TRACK_ORDER.filter(k=>!TRACKS[k].comingSoon).length;

  let last = getLast();
  if(!last || !TRACKS[last.trackKey]){
    const t0 = TRACKS.bar.flat[0];
    last = t0 ? {trackKey:'bar', lessonId:t0.id} : null;
  }

  let resumeHtml = '';
  if(last){
    const t = TRACKS[last.trackKey];
    const lesson = t.flat.find(l=>l.id===last.lessonId) || t.flat[0];
    const idx = t.flat.indexOf(lesson);
    const pct = t.flat.length ? Math.round((idx)/t.flat.length*100) : 0;
    const circumference = 150.8;
    const offset = circumference - (pct/100*circumference);
    resumeHtml = '<div class="resume-card">'
      + '<div class="resume-ring"><svg viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24"/><circle class="fg" cx="28" cy="28" r="24" stroke="var(--'+colorVar(t.cls)+')" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/></svg></div>'
      + '<div class="resume-body">'
        + '<div class="resume-eyebrow" style="color:var(--'+colorVar(t.cls)+')">Continue · '+t.name+'</div>'
        + '<div class="resume-title">'+esc(lesson.title)+'</div>'
        + '<div class="resume-sub">Module '+lesson.moduleNum+' · '+esc(lesson.moduleTitle)+' — Lesson '+(idx+1)+' of '+t.flat.length+'</div>'
      + '</div>'
      + '<button class="btn btn-primary" id="resumeBtn">Resume'
        + '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
      + '</div>';
  }

  const cardsHtml = TRACK_ORDER.map(k=>{
    const t = TRACKS[k];
    if(t.comingSoon){
      return '<article class="track-card locked '+t.cls+'">'
        + '<div class="track-head" style="background:var(--'+colorVar(t.cls)+')">'
          + '<div class="track-icon"><svg viewBox="0 0 24 24" fill="none">'+t.icon+'</svg></div>'
          + '<h3>'+t.name+'</h3><span class="sub">'+t.sub+'</span>'
        + '</div>'
        + '<div class="track-body"><p class="track-desc">'+t.desc+'</p><span class="soon-pill">Coming soon</span></div>'
      + '</article>';
    }
    const done = trackDoneCount(k), total = t.flat.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const next = firstIncomplete(k);
    return '<article class="track-card" data-track="'+k+'">'
      + '<div class="track-head" style="background:var(--'+colorVar(t.cls)+')">'
        + '<div class="track-icon"><svg viewBox="0 0 24 24" fill="none">'+t.icon+'</svg></div>'
        + '<h3>'+t.name+'</h3><span class="sub">'+t.sub+'</span>'
      + '</div>'
      + '<div class="track-body">'
        + '<p class="track-desc">'+t.desc+'</p>'
        + '<div><div class="track-progress-row"><span>Module '+(next?next.moduleNum:1)+' of '+t.modules.length+'</span><span class="num">'+done+' / '+total+'</span></div>'
        + '<div class="bar"><span style="width:'+pct+'%;background:var(--'+colorVar(t.cls)+')"></span></div></div>'
        + '<div class="track-foot"><span class="track-next">'+(done===0?'Start':'Next')+': '+esc(next?next.title:'')+'</span>'
        + '<button class="track-btn" style="color:var(--'+colorVar(t.cls)+');border-color:var(--'+colorVar(t.cls)+'-soft)">'+(done===0?'Start':'Continue')+'</button></div>'
      + '</div>'
    + '</article>';
  }).join('');

  document.getElementById('dashboardWrap').innerHTML =
    '<div class="dash-head"><div>'
      + '<span class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</span>'
      + '<h1>Good to see you, Warren.</h1>'
      + '<p class="sub">'+activeTracks+' tracks, one shell. Pick up where you left off or jump into something new.</p>'
    + '</div>'
    + '<div class="stat-strip">'
      + '<div class="stat-tile"><span class="v num">'+totalDone+'</span><span class="l">Lessons done</span></div>'
      + '<div class="stat-tile"><span class="v num">'+overallPct+'<span style="font-size:.9rem">%</span></span><span class="l">Overall</span></div>'
      + '<div class="stat-tile"><span class="v num">'+activeTracks+'</span><span class="l">Tracks</span></div>'
    + '</div></div>'
    + resumeHtml
    + '<div class="section-label"><h2>Your tracks</h2><div class="line"></div></div>'
    + '<div class="track-grid">'+cardsHtml+'</div>';

  const resumeBtn = document.getElementById('resumeBtn');
  if(resumeBtn && last) resumeBtn.addEventListener('click', ()=> openLesson(last.trackKey, last.lessonId));
  document.querySelectorAll('.track-card[data-track]').forEach(card=>{

  return {re:'realestate', fin:'finance', auto:'auto', bar:'bar'}[cls] || 'ink';
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function calloutClass(type){
  return {concept:'concept', example:'example', rule:'rule', trap:'trap', warn:'warn', illus:'illus'}[type] || 'concept';
}
function calloutLabel(b){
  if(b.label) return b.label;
  return {concept:'Concept', example:'Example', rule:'Rule', trap:'Bar Exam Trap', warn:'Watch Out', illus:''}[b.type] || '';
}

function renderBlocksBody(lesson, accentVar){
  return (lesson.blocks||[]).map(b=>{
    if(b.type==='illus'){
      return '<div class="callout illus">'+esc(b.emoji||'')+(b.caption?'<div>'+esc(b.caption)+'</div>':'')+'</div>';
    }
    const cls = calloutClass(b.type);
    const style = (cls==='rule') ? ' style="background:var(--'+accentVar+'-soft)"' : '';
    const labelStyle = (cls==='rule') ? ' style="color:var(--'+accentVar+')"' : '';
    return '<div class="callout '+cls+'"'+style+'><span class="clabel"'+labelStyle+'>'+esc(calloutLabel(b))+'</span><p>'+esc(b.body||'')+'</p></div>';
  }).join('');
}

    ).join('')+'</div>';

  const lesson = t.flat.find(l=>l.id===state.lessonId);
  const idx = t.flat.indexOf(lesson);
  const pct = t.flat.length ? Math.round(((idx+1)/t.flat.length)*100) : 0;
  const accentVar = colorVar(t.cls);
  const prev = t.flat[idx-1], next = t.flat[idx+1];

  let bodyHtml, titleBlockHtml;
  if(lesson.schema==='raw'){
    titleBlockHtml = '';
    bodyHtml = lesson.raw;
  } else {
    titleBlockHtml = '<h1 class="lesson-title">'+esc(lesson.title)+'</h1>'
      + (lesson.sub ? '<p class="lesson-sub">'+esc(lesson.sub)+'</p>' : '<div style="margin-bottom:32px"></div>');
    bodyHtml = lesson.schema==='blocks' ? renderBlocksBody(lesson, accentVar) : renderKingsBody(lesson);
  }

  const hasQuiz = lesson.schema!=='raw' && lesson.quiz;
  const actionLabel = hasQuiz ? 'Mark complete &amp; take quiz' : 'Mark complete';

  document.getElementById('lessonWrap').innerHTML =
    '<aside class="lesson-rail">'+railHtml()+'</aside>'
    + '<div class="lesson-main">'
      + '<div class="lesson-progress"><span style="width:'+pct+'%;background:var(--'+accentVar+')"></span></div>'
      + '<div class="lesson-eyebrow" style="color:var(--'+accentVar+')">'+t.name+' · Module '+lesson.moduleNum+' · Lesson '+(idx+1)+' of '+t.flat.length+'</div>'
      + titleBlockHtml
      + '<div class="lesson-body">'+bodyHtml+'</div>'
      + (lesson.schema==='raw' ? '' :
        '<div class="lesson-actionbar">'
        + '<button class="actionbar-prev" id="prevBtn"'+(prev?'':' disabled')+'><svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Previous lesson</button>'
        + '<button class="btn btn-complete" id="completeBtn" style="background:var(--'+accentVar+')">'+actionLabel
          + '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        + '</div>')
    + '</div>';

  document.getElementById('railBack').addEventListener('click', ()=>{ renderDashboard(); goScreen('dashboard'); });
  document.querySelectorAll('.rail-lesson').forEach(b=> b.addEventListener('click', ()=> openLesson(state.trackKey, b.dataset.lesson)));

  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(prev) openLesson(state.trackKey, prev.id); });

  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn){
    completeBtn.addEventListener('click', ()=>{
      if(hasQuiz){ renderQuiz(); goScreen('quiz'); }
      else { advanceAfterComplete(); }
    });
  }
  renderCrumb();
}

function advanceAfterComplete(){
  markDone(state.trackKey, state.lessonId);
  const t = TRACKS[state.trackKey];
  const idx = t.flat.findIndex(l=>l.id===state.lessonId);
  const next = t.flat[idx+1];
  if(next){ openLesson(state.trackKey, next.id); }
  else { renderDashboard(); goScreen('dashboard'); }
}

/* =====================================================================
   QUIZ VIEW (structured lessons only — raw/Investiq lessons carry their
   own inline quiz, handled by checkAnswer()/completeLesson() below)
   ===================================================================== */
function renderQuiz(){
  const t = TRACKS[state.trackKey];
  const lesson = t.flat.find(l=>l.id===state.lessonId);
  const q = lesson.quiz;
  const accentVar = colorVar(t.cls);
  const letters = ['A','B','C','D','E','F'];

  document.getElementById('quizWrap').innerHTML =
    '<div class="quiz-progress-row"><span class="num">'+t.name+' · Quick Check</span></div>'
    + '<div class="quiz-card">'
      + '<div class="quiz-eyebrow" style="color:var(--'+accentVar+')">'+esc(lesson.title)+'</div>'
      + '<h2 class="quiz-q">'+esc(q.q)+'</h2>'
      + '<div class="quiz-options">'+q.choices.map((c,i)=>
          '<button class="quiz-opt" data-idx="'+i+'"><span class="letter">'+letters[i]+'</span><span class="t">'+esc(c)+'</span></button>'
        ).join('')+'</div>'
      + '<div class="quiz-feedback" id="quizFeedback"></div>'
      + '<div class="quiz-footer"><button class="btn btn-next" id="quizNext" disabled>Continue</button></div>'
    + '</div>';

  let answered = false;
  document.querySelectorAll('#quizWrap .quiz-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      const chosen = parseInt(opt.dataset.idx,10);
      const correct = chosen === q.correct;
      document.querySelectorAll('#quizWrap .quiz-opt').forEach(o=>{
        o.disabled = true;
        if(parseInt(o.dataset.idx,10)===q.correct) o.classList.add('correct');
        else if(o===opt) o.classList.add('wrong');
      });
      const fb = document.getElementById('quizFeedback');
      fb.classList.add('show', correct ? 'good':'bad');
      const msg = correct ? (q.good || q.explain || '') : (q.bad || q.explain || '');
      const takeaway = (!correct && q.lesson) ? ('<br><br>'+esc(q.lesson)) : '';
      fb.innerHTML = '<b class="'+(correct?'good-label':'bad-label')+'">'+(correct?'Correct.':'Not quite.')+'</b> '+esc(msg)+takeaway;
      document.getElementById('quizNext').disabled = false;
    });
  });
  document.getElementById('quizNext').addEventListener('click', advanceAfterComplete);
}

/* =====================================================================
   Globals used by inline onclick handlers inside raw (Investiq-sourced)
   lesson HTML — same call signatures the original app used.
   ===================================================================== */
function checkAnswer(el, isCorrect){
  const group = el.closest('.quiz-options');
  if(group) group.querySelectorAll('.quiz-opt').forEach(o=>{ o.disabled = true; });
  el.classList.add(isCorrect ? 'correct' : 'wrong');
}
function completeLesson(){ advanceAfterComplete(); }

/* =====================================================================
   THEME TOGGLE
   ===================================================================== */
const root = document.documentElement;
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const cur = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : (cur === 'light' ? null : 'dark');
  if(next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
});

/* =====================================================================
   INIT
   ===================================================================== */
renderDashboard();
</script>
